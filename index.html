<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Matemonstros 6º ano</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
/* Layout: app de uma coluna estilo console — barra do jogador fixa no topo, abas, e telas de jogo centralizadas. Visual único e escuro de propósito (jogo). */
:root{
  color-scheme: dark;
  --bg:#0e1a2c; --bg2:#13243b; --panel:#182d48; --panel2:#1e3657; --line:#2a4669;
  --ink:#f3f7ff; --muted:#a3b6d1; --accent:#ffcf3f; --accent-ink:#2a1d00; --accent-dk:#b3540b;
  --ok:#2ee59d; --ok-ink:#05301f; --bad:#ff5d73; --bad-ink:#3a0610;
  --c-comum:#9fb2c9; --c-raro:#3fb8ff; --c-epico:#cf6bff; --c-lend:#ffc93c;
  --nu:#7ec8ff; --de:#ff9a8b;
  --display:'Lilita One','Arial Black',system-ui,sans-serif;
  --body:'Nunito',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;
  background-image:radial-gradient(circle at 1px 1px, rgba(255,255,255,.06) 1px, transparent 0);background-size:22px 22px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg2)}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
input{font:inherit}
.wrap{max-width:980px;margin:0 auto;padding-block:16px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;letter-spacing:.01em;text-wrap:balance}
h2{font-size:1.7rem} h3{font-size:1.3rem}
p{margin:0}
.muted{color:var(--muted)}
.stack{display:grid;gap:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* botões */
.btn{border:0;border-radius:14px;padding:13px 20px;font-weight:900;font-size:1.05rem;color:var(--accent-ink);background:var(--accent);box-shadow:0 5px 0 var(--accent-dk);transition:transform .08s, box-shadow .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--accent-dk)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:0 5px 0 var(--accent-dk)}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line);box-shadow:none}
.btn.ghost:hover{background:var(--panel)}
.btn.sm{padding:8px 14px;font-size:.92rem;border-radius:11px}
.link{background:none;border:0;color:var(--muted);text-decoration:underline;font-weight:800;padding:4px}

/* logo e início */
.logo{font-family:var(--display);font-size:clamp(2.6rem,9vw,4.2rem);line-height:.95;margin:0;color:var(--accent);
  text-shadow:0 4px 0 var(--accent-dk),0 8px 18px rgba(0,0,0,.45);-webkit-text-stroke:1.5px #5a2a00}
.start{max-width:520px;margin:6vh auto 0;display:grid;gap:18px;text-align:center;justify-items:center}
.start .mons{display:flex;justify-content:center;gap:4px}
.start .mons svg{width:96px}
.card-box{background:linear-gradient(180deg,var(--panel),var(--bg2));border:2px solid var(--line);border-radius:20px;padding:18px;display:grid;gap:12px;width:100%;text-align:left}
.field{display:grid;gap:6px}
.field label{font-weight:800;color:var(--muted);font-size:.9rem}
.txt{width:100%;padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);font-weight:800;font-size:1.1rem}
.err{color:var(--bad);font-weight:800;font-size:.92rem}

/* barra do jogador */
.player{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg2);border-bottom:2px solid var(--line)}
.player .in{max-width:980px;margin:0 auto;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.pname{font-family:var(--display);font-size:1.25rem;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:40vw}
.lvl{display:flex;align-items:center;gap:8px;font-weight:900;font-size:.9rem;flex:1;min-width:150px}
.lvl .xb{flex:1;height:10px;border-radius:999px;background:var(--panel);border:2px solid var(--line);overflow:hidden}
.lvl .xb i{display:block;height:100%;background:linear-gradient(90deg,var(--ok),var(--accent));width:0;transition:width .4s}
.coins{display:flex;align-items:center;gap:6px;font-family:var(--display);font-size:1.3rem;font-variant-numeric:tabular-nums}
.coin{width:22px;height:22px;flex:none}
.tabs{display:flex;gap:6px;margin:16px 0;overflow-x:auto}
.tab{flex:1;min-width:110px;border:2px solid var(--line);background:var(--panel);border-radius:14px;padding:10px 8px;font-weight:900;display:grid;justify-items:center;gap:2px}
.tab small{font-weight:800;font-size:.72rem;color:var(--muted)}
.tab.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);box-shadow:0 4px 0 var(--accent-dk)}
.tab.on small{color:var(--accent-ink)}

/* conteúdos */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.ct{border:2px solid var(--line);background:linear-gradient(180deg,var(--panel),var(--bg2));border-radius:18px;padding:14px;text-align:left;display:grid;gap:8px;align-content:start}
.ct:hover{border-color:var(--accent)}
.ct .ic{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;font-family:var(--display);font-size:1.15rem;background:var(--hue);color:#0e1a2c}
.ct h3{font-size:1.15rem}
.ct .st{display:flex;gap:10px;font-size:.8rem;font-weight:900;color:var(--muted)}
.starrow{letter-spacing:1px;color:var(--accent)}
.starrow .off{color:var(--line)}

/* setup */
.levels{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:620px){.levels{grid-template-columns:1fr}}
.lv{border:2px solid var(--line);background:var(--panel);border-radius:16px;padding:12px;text-align:left;display:grid;gap:6px}
.lv.on{border-color:var(--accent);background:var(--panel2);box-shadow:0 0 0 2px var(--accent) inset}
.lv:disabled{opacity:.5;cursor:not-allowed}
.lv b{font-family:var(--display);font-weight:400;font-size:1.15rem}
.lv span{font-size:.86rem;color:var(--muted);font-weight:700}
.modes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:520px){.modes{grid-template-columns:1fr}}
.mode{border:2px solid var(--line);background:var(--panel);border-radius:16px;padding:14px;text-align:left;display:grid;gap:4px}
.mode b{font-family:var(--display);font-weight:400;font-size:1.3rem}
.mode span{color:var(--muted);font-size:.9rem;font-weight:700}
.mode.fire{border-color:var(--accent)}
.back{display:inline-flex;align-items:center;gap:6px}

/* jogo */
.hud{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.pill{background:var(--panel);border:2px solid var(--line);border-radius:999px;padding:6px 14px;font-weight:900;font-variant-numeric:tabular-nums}
.pill.timer{font-family:var(--display);font-size:1.4rem;padding:4px 16px}
.pill.timer.low{border-color:var(--bad);color:var(--bad);animation:pulse .6s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.06)}}
.combo{font-family:var(--display);font-size:1.3rem;color:var(--accent);min-width:90px;text-align:right}
.combo.x2{color:#7ef0ff}.combo.x3{color:#ff7ae6}
.tbar{height:8px;border-radius:999px;background:var(--panel);overflow:hidden}
.tbar i{display:block;height:100%;background:var(--accent);width:100%;transition:width .25s linear}
.qbox{background:linear-gradient(180deg,var(--panel),var(--bg2));border:2px solid var(--line);border-radius:22px;padding:22px 18px;display:grid;gap:16px;justify-items:center;text-align:center;position:relative;overflow:hidden}
.qbox.good{animation:good .45s}
.qbox.badq{animation:badq .4s}
@keyframes good{0%{box-shadow:0 0 0 0 rgba(46,229,157,.0)}40%{box-shadow:0 0 0 6px rgba(46,229,157,.7)}100%{box-shadow:0 0 0 0 rgba(46,229,157,0)}}
@keyframes badq{20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
.qlabel{font-weight:900;color:var(--muted);font-size:.85rem;letter-spacing:.06em;text-transform:uppercase}
.qtext{font-size:clamp(1.15rem,3.2vw,1.45rem);font-weight:800;max-width:36ch}
.big{font-family:var(--display);font-size:clamp(2.2rem,8vw,3.4rem);line-height:1.1;display:flex;align-items:center;justify-content:center;gap:.35em;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.big .op{color:var(--muted);font-size:.8em}
.fr{display:inline-flex;flex-direction:column;align-items:center;line-height:1;vertical-align:middle;font-variant-numeric:tabular-nums}
.fr .n{color:var(--nu)} .fr .d{color:var(--de)}
.fr .b{align-self:stretch;height:.08em;min-height:3px;background:var(--ink);border-radius:2px;margin:.08em 0}
.mixed{display:inline-flex;align-items:center;gap:.12em}
.unk{display:inline-grid;place-items:center;min-width:1.3em;padding:0 .15em;border:3px dashed var(--accent);border-radius:10px;color:var(--accent);line-height:1.1}
.box{display:inline-grid;place-items:center;width:1.4em;height:1.2em;border:3px dashed var(--muted);border-radius:12px;color:var(--muted);font-size:.8em}
.ansrow{display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap}
.ain{width:8.5rem;text-align:center;font-family:var(--display);font-size:2rem;padding:6px 10px;border-radius:14px;border:3px solid var(--line);background:var(--bg);color:var(--ink)}
.ain:focus{border-color:var(--accent);outline:none}
.fin{display:grid;justify-items:center;gap:4px}
.fin .ain{width:6.5rem;font-size:1.8rem;padding:4px 8px}
.fin .ain.n{border-color:var(--nu)} .fin .ain.d{border-color:var(--de)}
.fin .bar{width:7.5rem;height:5px;background:var(--ink);border-radius:3px}
.fin small{font-weight:900;font-size:.75rem}
.fin small.n{color:var(--nu)} .fin small.d{color:var(--de)}
.choices{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.choice{min-width:110px;border:3px solid var(--line);background:var(--panel2);border-radius:16px;padding:12px 18px;font-family:var(--display);font-size:1.6rem}
.choice:hover{border-color:var(--accent)}
.choice small{display:block;font-family:var(--body);font-weight:800;font-size:.75rem;color:var(--muted)}
.fb{width:100%;border-radius:14px;padding:12px 14px;font-weight:800;text-align:left;display:grid;gap:4px}
.fb.ok{background:color-mix(in srgb,var(--ok) 18%,transparent);border:2px solid var(--ok);color:var(--ok)}
.fb.bad{background:color-mix(in srgb,var(--bad) 15%,transparent);border:2px solid var(--bad);color:#ffc2cb}
.fb.hint{background:color-mix(in srgb,var(--accent) 12%,transparent);border:2px solid var(--accent);color:var(--ink)}
.fb .ans{font-family:var(--display);font-weight:400;font-size:1.3rem;color:var(--ink);display:flex;gap:.4em;align-items:center;flex-wrap:wrap}
.float{position:absolute;right:18px;top:14px;font-family:var(--display);font-size:1.4rem;color:var(--ok);pointer-events:none;animation:up .8s ease-out forwards}
@keyframes up{from{transform:translateY(0);opacity:1}to{transform:translateY(-40px);opacity:0}}

/* fim de rodada */
.end{display:grid;gap:14px;justify-items:center;text-align:center}
.end .score{font-family:var(--display);font-size:clamp(3rem,12vw,4.6rem);line-height:1;color:var(--accent);font-variant-numeric:tabular-nums}
.end .stars3{font-size:2.6rem;letter-spacing:6px}
.end .stars3 span{display:inline-block;color:var(--line)}
.end .stars3 span.on{color:var(--accent);animation:starpop .45s cubic-bezier(.2,1.6,.4,1) both}
@keyframes starpop{from{transform:scale(0) rotate(-90deg)}to{transform:none}}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;width:100%;max-width:520px}
.stat{background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:10px;display:grid;gap:2px}
.stat b{font-family:var(--display);font-weight:400;font-size:1.5rem;font-variant-numeric:tabular-nums}
.stat span{font-size:.78rem;font-weight:900;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.code{font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;font-size:1.5rem;font-weight:800;letter-spacing:.08em;background:var(--bg);border:2px dashed var(--accent);border-radius:12px;padding:10px 16px;user-select:all;word-break:break-all}
.newrec{background:var(--accent);color:var(--accent-ink);font-weight:900;border-radius:8px;padding:2px 10px;font-size:.85rem}

/* monstros */
.hatch{background:linear-gradient(180deg,var(--panel),var(--bg2));border:2px solid var(--line);border-radius:22px;padding:18px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:18px;align-items:center}
@media (max-width:720px){.hatch{grid-template-columns:1fr}}
.stage{position:relative;min-height:280px;display:grid;place-items:center;border-radius:18px;background:radial-gradient(circle at 50% 70%, #24426a 0%, #132640 60%, #0d1a2b 100%);overflow:hidden}
.stage .ground{position:absolute;bottom:30px;left:50%;width:150px;height:22px;transform:translateX(-50%);border-radius:50%;background:rgba(0,0,0,.35)}
.egg{width:160px;height:auto;position:relative;z-index:1;transform-origin:50% 90%}
.egg.shake{animation:shake .9s ease-in-out}
@keyframes shake{0%,100%{transform:rotate(0)}15%{transform:rotate(-9deg)}30%{transform:rotate(8deg)}45%{transform:rotate(-7deg)}60%{transform:rotate(6deg)}75%{transform:rotate(-4deg)}90%{transform:rotate(3deg)}}
.egg .crack{opacity:0;transition:opacity .15s}
.egg.cracked .crack{opacity:1}
.egg.open .top{transform:translate(-26px,-60px) rotate(-28deg);opacity:0;transition:transform .45s ease-out,opacity .45s .1s}
.egg.open .bottom{transform:translateY(30px);opacity:0;transition:transform .45s ease-in,opacity .4s .1s}
.flash{position:absolute;inset:0;background:radial-gradient(circle, rgba(255,255,255,.95), rgba(255,255,255,0) 60%);opacity:0;pointer-events:none;z-index:3}
.flash.on{animation:flash .6s ease-out}
@keyframes flash{0%{opacity:0}20%{opacity:1}100%{opacity:0}}
.born{position:absolute;inset:0;display:grid;place-items:center;z-index:2}
.born .mon{width:200px;max-width:80%;animation:pop .55s cubic-bezier(.2,1.6,.4,1) both}
@keyframes pop{0%{transform:scale(.2) translateY(40px);opacity:0}100%{transform:none;opacity:1}}
.result{min-height:120px;display:grid;gap:6px;align-content:center}
.result .rar{font-family:var(--display);font-size:2rem;line-height:1}
.result .name{font-family:var(--display);font-size:1.5rem;line-height:1.1}
.new{display:inline-block;font-family:var(--body);font-weight:900;font-size:.75rem;letter-spacing:.08em;background:var(--ok);color:var(--ok-ink);border-radius:6px;padding:2px 7px;margin-left:6px;vertical-align:middle}
.wallet{display:flex;gap:16px;flex-wrap:wrap;font-weight:800;color:var(--muted);font-size:.9rem}
.wallet b{color:var(--ink);font-variant-numeric:tabular-nums}
.dexhead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.count{font-family:var(--display);font-size:1.6rem;font-variant-numeric:tabular-nums}
.pbar{height:12px;border-radius:999px;background:var(--panel);border:2px solid var(--line);overflow:hidden}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--ok),var(--accent));transition:width .5s}
.dex{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:8px}
@media (max-width:720px){.dex{grid-template-columns:repeat(5,minmax(0,1fr))}}
.slot{aspect-ratio:1/1;max-width:100%;border-radius:12px;background:var(--panel);border:2px solid var(--line);position:relative;display:grid;place-items:center;overflow:hidden;padding:0}
.slot .sn{position:absolute;top:3px;left:5px;font-size:.66rem;font-weight:900;color:var(--muted);font-variant-numeric:tabular-nums}
.slot .q{font-family:var(--display);font-size:1.3rem;color:var(--line)}
.slot.s-comum{border-color:color-mix(in srgb,var(--c-comum) 45%,var(--line))}
.slot.s-raro{border-color:color-mix(in srgb,var(--c-raro) 55%,var(--line))}
.slot.s-epico{border-color:color-mix(in srgb,var(--c-epico) 55%,var(--line))}
.slot.s-lend{border-color:color-mix(in srgb,var(--c-lend) 65%,var(--line))}
.slot.got{background:radial-gradient(circle at 50% 60%, color-mix(in srgb,var(--rc) 35%,transparent), var(--panel) 75%)}
.slot.got .mon{width:92%}
.slot.fresh{animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
.slot.soon{opacity:.45}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.85rem;font-weight:800;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--rc);margin-right:6px;vertical-align:middle}
.note{background:var(--panel);border:2px dashed var(--line);border-radius:14px;padding:12px 14px;color:var(--muted);font-size:.9rem}
.note b{color:var(--ink)}
.mcard{display:grid;grid-template-columns:120px minmax(0,1fr);gap:14px;align-items:center;background:var(--panel);border:3px solid var(--rc);border-radius:18px;padding:12px}
.mcard .mon{width:100%}
.chip{display:inline-block;font-weight:800;font-size:.72rem;letter-spacing:.04em;text-transform:uppercase;padding:2px 8px;border-radius:999px;background:color-mix(in srgb,var(--rc) 22%,transparent);color:var(--rc);border:1px solid color-mix(in srgb,var(--rc) 55%,transparent)}
.soonbox{display:grid;gap:10px;justify-items:center;text-align:center;padding:30px 16px}
.soonbox .mon{width:150px}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--accent);color:var(--accent-ink);font-weight:900;border-radius:14px;padding:12px 18px;box-shadow:0 6px 0 var(--accent-dk);animation:tin .35s cubic-bezier(.2,1.6,.4,1)}
@keyframes tin{from{transform:translate(-50%,40px);opacity:0}}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden}
.confetti i{position:absolute;top:-12px;width:9px;height:14px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.mon .bob{animation:bob 2.6s ease-in-out infinite;transform-origin:60px 98px}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
.foot{margin-top:28px;display:flex;justify-content:center;gap:16px;flex-wrap:wrap}

.missions{background:var(--panel);border:2px solid var(--line);border-radius:18px;padding:14px;display:grid;gap:8px;margin-bottom:18px}
.ms{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:center;font-weight:800;font-size:.95rem}
.ms .ck{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;color:var(--ok-ink);font-weight:900}
.ms.done .ck{background:var(--ok);border-color:var(--ok)}
.ms.done .mt{color:var(--muted);text-decoration:line-through}
.ms .mp{font-variant-numeric:tabular-nums;color:var(--muted)}
/* pizzaria */
.pzhero{display:flex;gap:16px;align-items:center;flex-wrap:wrap;background:var(--panel);border:2px solid var(--line);border-radius:18px;padding:14px}
.pzhero > div:last-child{flex:1;min-width:220px;display:grid;gap:6px}
.hearts{font-size:1.5rem;letter-spacing:2px}.hrt{color:var(--line)}.hrt.on{color:var(--bad)}
.counter{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.4fr);gap:16px;align-items:start;background:linear-gradient(180deg,#2b1c12,#1d140d);border:3px solid #6b4423;border-radius:22px;padding:16px}
@media (max-width:720px){.counter{grid-template-columns:1fr}}
.cust{display:grid;gap:8px;justify-items:center;text-align:center}
.cust.angry .cmon{animation:badq .5s infinite}
.bubble{background:#fff;color:#1a1530;border-radius:18px;padding:12px 16px;font-weight:900;font-size:1.2rem;position:relative;max-width:100%}
.bubble .fr .n{color:#1f6fd1}.bubble .fr .d{color:#d0283a}.bubble .fr .b{background:#1a1530}

/* Código de salvamento: moedas(16) xp(20) pity(6) ovos(10) coleção(40) estrelas(42) + verificação(15) */
const CIDS=['EQ','CP','FQ','SF','DC','PC','MD'];
const RUNKEYS=[...CIDS.map(c=>'C:'+c),'SIM','G1','G2','G3','G4'];
function dayStamp(){ const d=new Date(); return Math.floor(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/864e5)%512; }
function packSave(){
  let n=0n; const put=(v,bits)=>{ v=Math.max(0,Math.min(v,2**bits-1)); n=(n<<BigInt(bits))|BigInt(v); };
  put(S.coins,14); put(S.xp,18); put(S.pity,6); put(S.hatched,9);
  let col=0n; S.got.forEach(k=>{ col|=1n<<BigInt(k-1); }); n=(n<<40n)|col;
  CIDS.forEach(c=>{ for(let l=1;l<=3;l++) put(S.stars[c+l]||0,2); });
  put(S.simBest==null?15:S.simBest,4);
  const body=toB32(n,27);
  const chk=fnv(normName(S.apelido)+'|'+body)%1024;
  return (body+toB32(chk,2)).match(/.{1,5}/g).join('-');
}

  const st={}; for(let i=CIDS.length-1;i>=0;i--) for(let l=3;l>=1;l--) st[CIDS[i]+l]=take(2);
  const col=n&((1n<<40n)-1n); n>>=40n;
  const got=[]; for(let k=1;k<=40;k++) if((col>>BigInt(k-1))&1n) got.push(k);
  const hatched=take(9), pity=take(6), xp=take(18), coins=take(14);
  return {coins,xp,pity,hatched,got,stars:st,simBest:sb===15?null:sb};
}
function confCode(cid,l,pts){ return `${cid}${l}-${pts}-${toB32(fnv(normName(S.apelido)+'|R|'+cid+l+'|'+pts)%32768,3)}`; }
function checkConf(apelido,code){
  const m=String(code||'').toUpperCase().replace(/\s/g,'').match(/^([A-Z]{2})([1-3])-(\d+)-([0-9A-Z]{3})$/);
  if(!m||!CIDS.includes(m[1])) return null;
  const ok=toB32(fnv(normName(apelido)+'|R|'+m[1]+m[2]+'|'+m[3])%32768,3)===normCode(m[4]);
  return {ok,cid:m[1],l:+m[2],pts:+m[3]};
}

function lvlInfo(xp){ let L=1, need=60; while(xp>=need){ xp-=need; L++; need=40+20*L; } return {L,cur:xp,need}; }
function gain(coins){
  const before=lvlInfo(S.xp).L;
  S.coins+=coins; S.xp+=coins;
  const after=lvlInfo(S.xp).L;
  if(after>before){ S.coins+=20; toast(`Subiu para o nível ${after}! +20 moedas`); sfx.combo(); }
  save(); renderBar();
}

const MULTS=[1,.75,.5,.25];
function today(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function day(){ const t=today(); if(!S.day||S.day.date!==t||S.day.who!==S.apelido){ S.day={date:t,who:S.apelido,runs:{}}; S.day.ms=pickMissions(t); save(); } return S.day; }
function runsToday(key){ return (day().runs[key]||0); }
function startRun(key){ const d=day(); d.runs[key]=(d.runs[key]||0)+1; save(); return MULTS[Math.min(d.runs[key]-1,3)]; }
function nextMult(key){ return MULTS[Math.min(runsToday(key),3)]; }
function earn(base,mult){ S.coinFrac=(S.coinFrac||0)+base*mult; const w=Math.floor(S.coinFrac+1e-9); S.coinFrac-=w; if(w>0) gain(w); else save(); return w; }
const MPOOL=[
 {id:'treino', n:10, ev:'treinoOk'},
 {id:'sim', n:1, ev:'simDone', t:'Faça 1 simulado completo'},
 {id:'retry', n:3, ev:'retryOk', t:'No Treino, acerte 3 contas de revisão (as que voltam depois de um erro)'},
 {id:'star', n:1, ev:'starNew', t:'Ganhe 1 estrela nova no Relâmpago'},
 {id:'rel', n:3, ev:'relDone', t:'Jogue 3 rodadas de Relâmpago'},
 {id:'combo', n:1, ev:'combo5', t:'Faça um combo de 5 acertos seguidos no Relâmpago'},
 {id:'sim5', n:1, ev:'sim5', t:'Acerte 5 questões ou mais em um simulado'},
 {id:'game', n:2, ev:'gameDone', t:'Jogue 2 turnos de qualquer game'}
];
function pickMissions(t){
  let seed=fnv(t+'|'+normName(S.apelido)); const rnd=()=>{ seed=(Math.imul(seed,1664525)+1013904223)>>>0; return seed/4294967296; };
  const allStars=CIDS.every(c=>[1,2,3].every(l=>(S.stars[c+l]||0)===3));
  let pool=MPOOL.filter(m=>!(m.id==='star'&&allStars));
  const out=[{...MPOOL[0]}];
  pool=pool.filter(m=>m.id!=='treino');
  while(out.length<3){ const m=pool.splice(Math.floor(rnd()*pool.length),1)[0]; out.push({...m}); }
  // treino: conteúdo com menos estrelas (empate decidido pelo sorteio do dia)
  const score=c=>[1,2,3].reduce((a,l)=>a+(S.stars[c+l]||0),0)+rnd()*.9;
  const cid=[...CIDS].sort((a,b)=>score(a)-score(b))[0];
  out[0].cid=cid; out[0].t=`Acerte 10 contas no Treino de ${ctById(cid).nome}`;
  return out.map(m=>({id:m.id,ev:m.ev,n:m.n,t:m.t,cid:m.cid||null,p:0,done:false}));
}
function mission(ev,cid){
  const d=day(); let changed=false;
  d.ms.forEach(m=>{ if(m.done||m.ev!==ev||(m.cid&&m.cid!==cid)) return; m.p++; changed=true;
    if(m.p>=m.n){ m.done=true; gain(20); toast('Missão cumprida! +20 moedas'); sfx.combo(); } });
  if(changed) save();
}
function missionsHTML(){
  const d=day();
  if(d.locked) return `<div class="missions"><h3>Missões do dia</h3><p class="muted" style="font-weight:700">Você entrou com código de salvamento hoje, então as missões de hoje ficaram encerradas. Amanhã aparecem 3 missões novas!</p></div>`;
  return `<div class="missions"><div class="row" style="justify-content:space-between"><h3>Missões do dia</h3><span class="muted" style="font-weight:800;font-size:.85rem">+20 moedas cada</span></div>
    ${d.ms.map(m=>`<div class="ms ${m.done?'done':''}"><span class="ck">${m.done?'✓':''}</span><span class="mt">${m.t}</span><span class="mp">${Math.min(m.p,m.n)}/${m.n}</span></div>`).join('')}</div>`;
}

// --- Frações equivalentes
function genEQ(l){
  if(l<3){
    let b,a,k; do{ b=rint(2,l===1?10:9); a=rint(1,b-1); }while(gcd(a,b)!==1);
    k = l===1?2:rint(2,6);
    const askNum=Math.random()<.5;
    const ans= askNum? a*k : b*k;
    const right= askNum? `${fr(`<span class="unk">?</span>`,b*k)}` : `${fr(a*k,`<span class="unk">?</span>`)}`;
    return {kind:'int', label:'Complete a fração equivalente', html:`<div class="big">${fr(a,b)}<span class="op">=</span>${right}</div>`, ans,
      show:String(ans),
      hint: askNum? `O denominador foi multiplicado por ${k} (${b} × ${k} = ${b*k}). Faça o mesmo com o numerador.` : `O numerador foi multiplicado por ${k} (${a} × ${k} = ${a*k}). Faça o mesmo com o denominador.`,
      wrong:v=>{ if(askNum&&v===a+(b*k-b)) return 'Você somou. Em frações equivalentes, multiplicamos numerador e denominador pelo mesmo número.';
                 if(!askNum&&v===b+(a*k-a)) return 'Você somou. Em frações equivalentes, multiplicamos numerador e denominador pelo mesmo número.'; return null; }};
  }
  let a,b; do{ b=rint(2,9); a=rint(1,b-1); }while(gcd(a,b)!==1);
  const k=rint(2,8);
  return {kind:'frac', label:'Simplifique até a forma irredutível', html:`<div class="big">${fr(a*k,b*k)}<span class="op">=</span><span class="box">?</span></div>`, ans:{n:a,d:b},
    show:fr(a,b),
    hint:`Procure um número que divida ${a*k} e ${b*k} ao mesmo tempo. Tente ${k}.`,
    check:v=>v.n===a&&v.d===b,
    wrong:v=>{ if(v.d&&v.n*b===a*v.d) return 'Essa fração é equivalente, mas ainda dá para simplificar mais.'; return null; }};
}
// --- Comparar
function genCP(l){
  let A,B,va,vb,tip;
  if(l===1){
    const ip=rint(0,5); let x,y;
    const t=Math.random();
    if(t<.15){ x=rint(1,9)/10; y=x; A=fmt(x); B=fmt(x)+'0'; }
    else { x=ip+rint(1,9)/10; y=ip+rint(1,99)/100; if(Math.round(x*100)===Math.round(y*100)) y+=0.01; A=fmt(x); B=fmt(y); }
    if(Math.random()<.5) [A,B,x,y]=[B,A,y,x];
    va=x; vb=y; tip='Compare primeiro a parte inteira, depois os décimos, depois os centésimos. Completar com zero ajuda: 0,7 = 0,70.';
    A=`<span>${A}</span>`; B=`<span>${B}</span>`;
  } else if(l===2){
    if(Math.random()<.5){ const d=rint(3,12); let n1=rint(1,d+3), n2=rint(1,d+3); while(n2===n1) n2=rint(1,d+3);
      A=fr(n1,d); B=fr(n2,d); va=n1/d; vb=n2/d; tip='Mesmo denominador: os pedaços têm o mesmo tamanho. Ganha quem tem mais pedaços (maior numerador).'; }
    else { const n=rint(1,6); let d1=rint(n+1,12), d2=rint(n+1,12); while(d2===d1) d2=rint(n+1,12);
      A=fr(n,d1); B=fr(n,d2); va=n/d1; vb=n/d2; tip='Mesmo numerador: quanto maior o denominador, menores são os pedaços. Então a fração é menor.'; }
  } else {
    const t=pick(['eq','int','mix','one']);
    if(t==='eq'){ let a,b; do{ b=rint(2,8); a=rint(1,b-1);}while(gcd(a,b)!==1); const k=rint(2,5);
      if(Math.random()<.65){ A=fr(a,b); B=fr(a*k,b*k); va=a/b; vb=va; } else { A=fr(a,b); B=fr(a*k+1,b*k); va=a/b; vb=(a*k+1)/(b*k); }
      tip='Multiplique numerador e denominador para deixar as frações com o mesmo denominador e compare.'; }
    if(t==='int'){ const d=rint(2,6), w=rint(1,4); let n=w*d+rint(-d+1,d-1); if(n===w*d) n++;
      A=fr(n,d); B=String(w); va=n/d; vb=w; tip=`Transforme o inteiro em fração: ${w} = ${w*d}/${d}. Depois compare os numeradores.`; }
    if(t==='mix'){ const d1=rint(2,5), w=rint(1,3), n1=rint(1,d1-1); const d2=rint(2,6); let n2=rint(w*d2-d2+1,w*d2+2*d2-1);
      if(n2*d1===(w*d1+n1)*d2) n2++;
      A=mixed(w,n1,d1); B=fr(n2,d2); va=w+n1/d1; vb=n2/d2; tip=`Transforme o número misto em fração imprópria: ${w} inteiro(s) e ${n1}/${d1} = ${(w*d1+n1)}/${d1}.`; }
    if(t==='one'){ const d=rint(3,12); let n=rint(d-3,d+3); if(n<1) n=1; A=fr(n,d); B='1'; va=n/d; vb=1; tip='Quando o numerador é igual ao denominador, a fração vale 1 inteiro.'; }
    if(Math.random()<.5){ [A,B]=[B,A]; [va,vb]=[vb,va]; }
  }
  const ans= Math.abs(va-vb)<1e-9?'=': va>vb?'>':'<';
  return {kind:'choice', label:'Qual sinal completa?', html:`<div class="big">${A}<span class="box">?</span>${B}</div>`, ans,
    opts:[['>','maior'],['<','menor'],['=','igual']], show:ans, hint:tip, wrong:()=>tip};
}
// --- Fração de quantidade
function genFQ(l){

  else if(l===2){ d=rint(3,10); n=rint(2,d-1); g=rint(2,Math.floor(120/d)); }

  const T=d*g, ans=n*g;

    wrong:v=>{ if(n>1&&v===g) return `Esse é o valor de 1 parte. O numerador pede ${n} partes.`; if(v===T*d||v===T*n) return 'Primeiro divida pelo denominador.'; return null; }};

// --- Soma e subtração de frações
function genSF(l){
  let a,b,c,d,op,html,N,D;
  op=Math.random()<.5?'+':'−';
  if(l===1){ d=rint(3,12); a=rint(1,d-1); c=rint(1,d-1); if(op==='−'){ if(a<c)[a,c]=[c,a]; if(a===c) op='+'; } b=d;
    N= op==='+'?a+c:a-c; D=d; html=`${fr(a,d)}<span class="op">${op}</span>${fr(c,d)}`; }
  else if(l===2){ const d1=rint(2,6), k=rint(2,3), d2=d1*k; let p=[[rint(1,d1-1),d1],[rint(1,d2-1),d2]]; if(Math.random()<.5) p.reverse();
    [[a,b],[c,d]]=p; if(op==='−'&&a*d<=c*b){ [[a,b],[c,d]]=[[c,d],[a,b]]; if(a*d===c*b) op='+'; }
    N= op==='+'?a*d+c*b:a*d-c*b; D=b*d; html=`${fr(a,b)}<span class="op">${op}</span>${fr(c,d)}`; }

      N= op==='+'?A*d+c*b:A*d-c*b; D=b*d; html=`${mixed(w,a,b)}<span class="op">${op}</span>${fr(c,d)}`; a=A; }
    else { if(op==='−'&&a*d<=c*b){ [a,b,c,d]=[c,d,a,b]; if(a*d===c*b) op='+'; }
      N= op==='+'?a*d+c*b:a*d-c*b; D=b*d; html=`${fr(a,b)}<span class="op">${op}</span>${fr(c,d)}`; }
  }
  const sameDen=(l===1);

    check:v=>v.d>0&&v.n*D===N*v.d,
    wrong:v=>{ if(sameDen&&v.d===2*D) return 'Você somou os denominadores. Com denominadores iguais, ele se conserva.';
      if(!sameDen&&op==='+'&&v.n===(a+c)) return 'Não dá para somar numerador com numerador e denominador com denominador. Iguale os denominadores primeiro.'; return null; }};
}
// --- Operações com decimais (trabalha com inteiros para evitar erros de arredondamento)
function genDC(l){
  let A,B,op,ans,tip;

  if(l===1){

    A=d2(x); B=d2(y); ans= op==='+'?d2(x+y):d2(x-y);

  } else if(l===2){
    const t=pick(['p10','nat','div10']);

    if(t==='nat'){ const x=rint(11,999); const n=rint(2,9); A=x/10; B=n; op='×'; ans=x*n/10; tip='Multiplique como se não houvesse vírgula e depois coloque a mesma quantidade de casas decimais.'; }
    if(t==='div10'){ const p=pick([10,100]); const x=rint(1,9999); A=x/10; B=p; op='÷'; ans=x/10/p; tip=`Dividir por ${p} desloca a vírgula ${String(p).length-1} casa(s) para a esquerda.`; }
  } else {
    if(Math.random()<.5){ const x=rint(11,99), y=rint(11,59); A=x/10; B=y/10; op='×'; ans=x*y/100; tip='Multiplique sem as vírgulas. O resultado tem tantas casas decimais quanto os dois fatores juntos.'; }
    else { const n=rint(2,9); const q=rint(11,999); A=q*n/100; B=n; op='÷'; ans=q/100; tip='Divida normalmente e coloque a vírgula no resultado quando "descer" a vírgula do dividendo.'; }
  }
  return {kind:'dec', label:'Calcule', html:`<div class="big">${fmt(A)}<span class="op">${op}</span>${typeof B==='number'?fmt(B):B}<span class="op">=</span><span class="box">?</span></div>`,

}
// --- Porcentagem
function genPC(l){

    return {kind:'int', label:'Calcule', html:`<div class="big">${p}%<span class="op">de</span>${T}<span class="op">=</span><span class="box">?</span></div>`, ans, show:String(ans), hint:tip,

    wrong:v=>{ if(v===part) return `Esse é o valor do ${desc?'desconto':'aumento'}. Agora ${desc?'subtraia do':'some ao'} preço.`; if(v===(desc?P+part:P-part)) return desc?'Desconto diminui o preço: subtraia.':'Aumento: some ao preço.'; return null; }};
}
// --- Múltiplos e divisores
function genMD(l){
  let N,k,yes,tip,q;
  if(l===1){ k=rint(2,10); yes=Math.random()<.5; const m=rint(2,12); N=k*m+(yes?0:rint(1,k-1));
    q= Math.random()<.5? `${N} é múltiplo de ${k}?` : `${k} é divisor de ${N}?`;
    tip= yes? `Sim: ${k} × ${m} = ${N}.` : `Não: ${k} × ${Math.floor(N/k)} = ${k*Math.floor(N/k)} e sobra ${N%k}.`; }
  else {
    k= l===2? pick([2,3,5,9,10]) : pick([4,6,8,100,1000]);
    yes=Math.random()<.5;
    const maxN= k>=100? 99999 : 9999;
    do{ N=rint(100,maxN); if(yes) N=N-(N%k); else if(N%k===0) N+=rint(1,Math.min(k-1,9)); }while(N<100||(N%k===0)!==yes);
    const s=String(N).split('').reduce((a,b)=>a+ +b,0);
    tip={2:`Divisível por 2 quando termina em número par. ${N} termina em ${N%10}.`,
         3:`Divisível por 3 quando a soma dos algarismos é múltiplo de 3. Soma: ${s}.`,
         5:`Divisível por 5 quando termina em 0 ou 5. ${N} termina em ${N%10}.`,
         9:`Divisível por 9 quando a soma dos algarismos é múltiplo de 9. Soma: ${s}.`,
         10:`Divisível por 10 quando termina em 0. ${N} termina em ${N%10}.`,
         4:`Divisível por 4 quando os dois últimos algarismos formam múltiplo de 4. Últimos dois: ${String(N%100).padStart(2,'0')}.`,
         6:`Divisível por 6 quando é par e divisível por 3. Termina em ${N%10} e a soma dos algarismos é ${s}.`,
         8:`Divisível por 8 quando os três últimos algarismos formam múltiplo de 8. Últimos três: ${String(N%1000).padStart(3,'0')}.`,
         100:`Divisível por 100 quando termina em 00.`,1000:`Divisível por 1000 quando termina em 000.`}[k];
    q= Math.random()<.5? `${N.toLocaleString('pt-BR')} é divisível por ${k}?` : `${k} é divisor de ${N.toLocaleString('pt-BR')}?`;
  }
  return {kind:'choice', label: l===1?'Múltiplo ou divisor':'Critérios de divisibilidade', html:`<p class="big" style="font-size:clamp(1.6rem,6vw,2.4rem)">${q}</p>`,
    ans: yes?'S':'N', opts:[['S','Sim'],['N','Não']], show: yes?'Sim':'Não', hint: l===1?'Pense na tabuada: dá para chegar no número só multiplicando, sem sobrar nada?':tip, wrong:()=>tip};
}

let G=null, TIMER=null;
function stopTimer(){ if(TIMER){ clearInterval(TIMER); TIMER=null; } if(typeof SIMT!=='undefined'&&SIMT){ clearInterval(SIMT); SIMT=null; } if(typeof PZT!=='undefined'&&PZT){ clearInterval(PZT); PZT=null; } if(typeof RTA!=='undefined'&&RTA){ cancelAnimationFrame(RTA); RTA=null; } if(typeof TST!=='undefined'&&TST){ clearInterval(TST); TST=null; } if(typeof MKT!=='undefined'&&MKT){ clearInterval(MKT); MKT=null; } }
function startGame(mode){
  const c=ctById(VIEW.cid);
  G={mode,cid:c.id,l:VIEW.lvl,q:null,ok:0,tries:0,combo:0,best:0,pts:0,coins:0,queue:[],sinceWrong:0,state:'ask',fb:null,hint:false,t:60,recent:[],mult:startRun('C:'+c.id)};
  nextQ();
  VIEW.scr='play'; render();
  if(mode==='relampago'){
    const t0=Date.now();
    TIMER=setInterval(()=>{ G.t=Math.max(0,60-(Date.now()-t0)/1000); const el=$('#tm'); if(el){ el.textContent=Math.ceil(G.t)+'s'; el.classList.toggle('low',G.t<=10); } const b=$('#tb'); if(b) b.style.width=(G.t/60*100)+'%';
      if(G.t<=0){ stopTimer(); finishRelampago(); } },200);
  }
}
function nextQ(){
  const c=ctById(G.cid);
  if(G.mode==='treino'&&G.queue.length&&G.queue[0].due<=G.tries){ G.q=G.queue.shift().q; G.q.retry=true; }
  else { let q, n=0; do{ q=c.gen(G.l); n++; }while(G.recent.includes(q.html)&&n<30); G.q=q; G.recent.push(q.html); if(G.recent.length>12) G.recent.shift(); }
  G.state='ask'; G.fb=null; G.hint=false;
}
function multOf(combo){ return combo>=10?3:combo>=5?2:1; }
function viewPlay(){
  const c=ctById(G.cid), q=G.q, rel=G.mode==='relampago';
  const mult=multOf(G.combo);
  const hud= rel? `<div class="hud"><span class="pill timer" id="tm">${Math.ceil(G.t)}s</span><span class="pill">${G.pts} pts</span><span class="combo ${mult>1?'x'+mult:''}">${G.combo>=2?`Combo ${G.combo}${mult>1?` ×${mult}`:''}`:''}</span></div><div class="tbar"><i id="tb" style="width:${G.t/60*100}%"></i></div>`
               : `<div class="hud"><span class="pill">Acertos ${G.ok} / ${G.tries}</span><span class="pill">+${G.coins} moedas</span><span class="combo">${G.combo>=3?`Sequência ${G.combo}`:''}</span></div>`;
  let input='';
  if(G.state==='ask'){
    if(q.kind==='choice') input=`<div class="choices">${q.opts.map(([v,l])=>`<button class="choice" data-act="choose" data-v="${v}">${v==='S'||v==='N'?l:v}${v==='S'||v==='N'?'':`<small>${l}</small>`}</button>`).join('')}</div>`;
    else if(q.kind==='frac') input=`<form class="ansrow" id="fAns"><div class="fin"><small class="n">numerador</small><input class="ain n" id="an" inputmode="numeric" autocomplete="off" aria-label="numerador"><span class="bar"></span><input class="ain d" id="ad" inputmode="numeric" autocomplete="off" aria-label="denominador"><small class="d">denominador</small></div><button class="btn" type="submit">Confirmar</button></form>`;
    else input=`<form class="ansrow" id="fAns"><input class="ain" id="a1" inputmode="${q.kind==='dec'?'decimal':'numeric'}" autocomplete="off" aria-label="resposta" placeholder="${q.kind==='dec'?'0,0':''}"><button class="btn" type="submit">Confirmar</button></form>`;
  }
  let fb='';
  if(G.fb) fb=`<div class="fb ${G.fb.c}" role="status">${G.fb.m}</div>`;
  if(G.hint&&G.state==='ask') fb+=`<div class="fb hint">Dica: ${q.hint}</div>`;
  const tools = G.state==='ask'
    ? `<div class="row" style="justify-content:center">${!rel?`<button class="btn ghost sm" data-act="hint">Dica</button>`:''}<button class="btn ghost sm" data-act="quit">${rel?'Desistir':'Encerrar treino'}</button></div>`
    : `<div class="row" style="justify-content:center"><button class="btn" data-act="next" id="nextBtn">Continuar</button><button class="btn ghost sm" data-act="quit">Encerrar treino</button></div>`;
  return `<div class="stack">
    <div class="row" style="justify-content:space-between"><h3>${c.nome} · Nível ${G.l}</h3><span class="pill">${rel?'Relâmpago ⚡':'Treino'}</span></div>
    ${hud}
    <div class="qbox" id="qbox">
      <span class="qlabel">${q.retry?'Revisão: ':''}${q.label}</span>
      ${q.html}

      ${fb}
    </div>
    ${tools}
  </div>`;
}
function focusInput(){ const el=$('#a1')||$('#an')||$('#nextBtn'); if(el) setTimeout(()=>el.focus(),30); }
function readAnswer(){
  const q=G.q;
  if(q.kind==='frac'){ const n=$('#an').value.trim(), d=$('#ad').value.trim(); if(!/^\d+$/.test(n)||!/^\d+$/.test(d)||+d===0) return {err:'Preencha numerador e denominador com números (o denominador não pode ser 0).'}; return {v:{n:+n,d:+d}}; }
  const v=parseNum($('#a1').value); if(v===null) return {err:'Digite sua resposta com números.'+(q.kind==='dec'?' Use vírgula para decimais.':'')}; return {v};
}
function isRight(q,v){
  if(q.kind==='choice') return v===q.ans;
  if(q.kind==='frac') return q.check?q.check(v):(v.n===q.ans.n&&v.d===q.ans.d);
  if(q.kind==='dec') return Math.abs(v-q.ans)<1e-6;
  return v===q.ans;
}
function answer(v){
  const q=G.q, rel=G.mode==='relampago';
  G.tries++;
  const right=isRight(q,v);
  const box=$('#qbox');
  if(right){
    G.ok++; G.combo++; G.best=Math.max(G.best,G.combo);
    let base=1;
    if(rel){ G.pts+=10*G.l*multOf(G.combo); if(G.combo%5===0){ base+=2; sfx.combo(); mission('combo5'); } }
    else { mission('treinoOk',G.cid); if(q.retry) mission('retryOk'); if(G.ok%20===0){ G.mult=startRun('C:'+G.cid); toast(`20 acertos! Agora este Treino rende ${Math.round(G.mult*100)}%. Varie o conteúdo.`); } }
    const coins=earn(base,G.mult); G.coins+=coins; sfx.ok();
    if(rel){ nextQ(); render(); const b=$('#qbox'); if(b){ b.classList.add('good'); const f=document.createElement('span'); f.className='float'; f.textContent=coins?'+'+coins:'✓'; b.appendChild(f); } return; }
    G.state='done'; G.fb={c:'ok',m:pick(['Isso aí!','Mandou bem!','Certinho!','Perfeito!','Acertou!'])+(coins?` +${coins} moeda${coins>1?'s':''}`:'')};
    render(); return;
  }
  G.combo=0; sfx.bad();
  const w=(q.wrong&&q.wrong(v))||'';
  if(rel){
    G.state='done'; G.fb={c:'bad',m:`<span>Resposta certa:</span><span class="ans">${q.show}</span>${w&&q.kind!=='choice'?`<span>${w}</span>`:''}`};
    render();
    setTimeout(()=>{ if(G&&G.state==='done'&&VIEW.scr==='play'){ nextQ(); render(); } }, 1400);
    return;
  }
  G.queue.push({q:{...q},due:G.tries+3});
  G.state='done'; G.fb={c:'bad',m:`<span>Resposta certa:</span><span class="ans">${q.show}</span>${w?`<span>${w}</span>`:`<span>${q.hint}</span>`}<span class="muted" style="font-weight:700">Essa conta vai voltar daqui a pouco.</span>`};
  render(); if(box) {}
  const b=$('#qbox'); if(b) b.classList.add('badq');
}
function finishRelampago(){
  const c=ctById(G.cid), key=G.cid+G.l, t=c.alvo[G.l-1];
  const stars= G.ok>=t?3: G.ok>=Math.ceil(t*.65)?2: G.ok>=Math.ceil(t*.35)?1:0;

let busy=false;
function hatch(){
  const PR=eggPrice(); if(busy||S.coins<PR) return; busy=true;
  S.coins-=PR; renderBar(); const back=Math.floor(PR/2);
  const egg=$('#egg'), born=$('#born'), flash=$('#flash'), res=$('#result'), btn=$('#hatchBtn');
  btn.disabled=true; res.innerHTML='<p>O ovo está tremendo...</p>';
  const r=rollRarity(); S.pity = r==='lend'?0:S.pity+1;
  const all=SP.filter(s=>s.r===r), miss=all.filter(s=>!S.got.includes(s.n)), pool=miss.length?miss:all;
  const s=pool[Math.floor(Math.random()*pool.length)], isNew=!S.got.includes(s.n);
  S.hatched++; if(isNew) S.got.push(s.n); else S.coins+=back;
  save();
  const finish=()=>{
    const R=RAR[r];
    egg.style.visibility='hidden';
    born.innerHTML=`<div style="display:grid;place-items:center;width:100%">${monSVG(s)}</div>`;
    res.innerHTML=`<span class="rar" style="color:${R.c}">${R.t.toUpperCase()}!</span><span class="name">#${String(s.n).padStart(2,'0')} ${s.nome}${isNew?'<span class="new">NOVO</span>':''}</span><p class="muted">${isNew?s.poder:`Repetido! Você recebeu ${back} moedas de volta.`}</p>`;
    sfx.reveal(r); if(r==='lend'||r==='epico') confetti(r);
    $('#dex').innerHTML=dexHTML(isNew?s.n:null);
    document.querySelector('.count').textContent=S.got.length+'/40'; document.querySelector('.pbar i').style.width=(S.got.length/40*100)+'%';
    document.querySelector('.wallet').innerHTML=`<span>Ovos chocados: <b>${S.hatched}</b></span><span>Ovos sem lendário: <b>${S.pity}</b>/${PITY_MAX}</span>`;
    renderBar();
    const EGG=eggPrice(); btn.textContent=`Chocar outro · ${EGG}`; btn.disabled=S.coins<EGG; busy=false;
    if(S.coins<EGG) res.insertAdjacentHTML('beforeend',`<p class="muted">O próximo ovo custa ${EGG}. Faltam ${EGG-S.coins} moedas.</p>`);
  };
  if(window.matchMedia('(prefers-reduced-motion: reduce)').matches){ finish(); return; }
  egg.classList.add('shake'); sfx.tick();
  setTimeout(()=>{ egg.classList.add('cracked'); sfx.crack(); },950);
  setTimeout(()=>{ egg.classList.add('open'); flash.classList.add('on'); },1350);
  setTimeout(finish,1600);
}

const shuffle=a=>{ a=[...a]; for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const nf=n=>Number(n).toLocaleString('pt-BR');
const reais=c=>'R$ '+(c/100).toFixed(2).replace('.',',');
const NOMES=['Ana','Bia','Caio','Davi','Duda','Enzo','Gabi','Heitor','Isa','João','Júlia','Lara','Léo','Lia','Malu','Miguel','Nina','Pedro','Rafa','Sofia','Théo','Vitor'];
const two=()=>{ const a=pick(NOMES); let b; do{ b=pick(NOMES); }while(b===a); return [a,b]; };
const frS=(n,d)=>{ const g=gcd(n,d); return fr(n/g,d/g); };
function mkQ(area,hab,enun,ok,wrongs,expl,fig=''){
  const seen=new Set([ok.t]); const alts=[{t:ok.t,ok:true,why:''}];
  for(const w of wrongs){ if(alts.length>=4) break; if(!w||w.t==null||seen.has(w.t)) continue; seen.add(w.t); alts.push({t:w.t,ok:false,why:w.why||''}); }
  if(alts.length<4) return null;
  return {area,hab,enun,fig,alts:shuffle(alts),expl};
}

function qFracSoma(){

      ()=>`${pick(NOMES)} tinha ${fr(a,d1)} de uma pizza e deu ${fr(c,d2)} da pizza para o irmão. Com quanto da pizza ficou?`])()
    : pick([

      ()=>`${pick(NOMES)} pintou ${fr(a,d1)} de um muro de manhã e ${fr(c,d2)} à tarde. Que fração do muro foi pintada?`,
      ()=>`${pick(NOMES)} caminhou ${fr(a,d1)} de km antes da escola e ${fr(c,d2)} de km depois. Quanto caminhou ao todo?`])();
  const g=gcd(N,D);

  const q=mkQ('Frações','EF06MA10',`<p>${ctx}</p>`,{t:okT},
    [{t:wa>0?fr(wa,d1+d2):null,why:'Os denominadores não podem ser somados. Deixe as frações com o mesmo denominador e opere só os numeradores.'},
     {t:wa>0?fr(wa,d2):null,why:'Antes de operar, a primeira fração precisa ser transformada para o mesmo denominador.'},
     {t:fr(N/g+1,D/g),why:'Confira a conta dos numeradores.'},
     {t:N/g>1?fr(N/g-1,D/g):fr(N/g+2,D/g),why:'Confira a conta dos numeradores.'},
     {t:fr(D/g,N/g),why:'Numerador e denominador trocados.'}],
    `${k>1?`${fr(a,d1)} = ${fr(a*k,d2)}. `:''}${fr(a*k,d2)} ${minus?'−':'+'} ${fr(c,d2)} = ${fr(N,D)}${g>1?` = ${fr(N/g,D/g)} (simplificada)`:''}.`);
  if(q&&q.alts.some(al=>!al.ok&&Math.abs(valOf(al.t)-N/D)<1e-9)) return null;

}

const POOLS={nat:[qValor,qResto,qMult],nat4:[q4op],fra:[qFracQ,qFracFig,qFracDiv,qFracComp,qReta,qFracSoma],dec:[qDec,qRep,qPerc],med:[qMedida],geo:[qArea,qGeo,qGraf]};
function genFrom(fns){ for(let i=0;i<40;i++){ const q=pick(fns)(); if(q) return q; } return null; }
function buildSim(){
  const plan=[];
  const key=pick([qReta,qFracComp]); const fr3=[key,...shuffle(POOLS.fra.filter(f=>f!==key)).slice(0,2)]; fr3.forEach(f=>plan.push([f]));
  plan.push(POOLS.nat4); plan.push(POOLS.nat);
  const d2=shuffle(POOLS.dec).slice(0,2); d2.forEach(f=>plan.push([f]));
  plan.push(POOLS.med);
  const g2=shuffle(POOLS.geo).slice(0,2); g2.forEach(f=>plan.push([f]));
  return shuffle(plan.map(genFrom).filter(Boolean));
}

  S.simN=(S.simN||0)+1; SIM.rec= S.simBest==null||ok>S.simBest; if(SIM.rec) S.simBest=ok;
  save(); SIM.coins=earn(3*ok,SIM.mult); if(SIM.rec&&ok>0){ gain(15); SIM.coins+=15; }

  sfx.end(); VIEW.scr='simres'; render(); window.scrollTo(0,0);

/* ---- pedidos ---- */
function ordAprendiz(){
  if(PZ.nCust%3===0){
    let A,B; if(Math.random()<.5){ const d=rint(3,10); let a=rint(1,d-1), b=rint(1,d-1); while(b===a) b=rint(1,d-1); A=[a,d];B=[b,d]; }
    else { const n=rint(1,3); let a=rint(n+1,10), b=rint(n+1,10); while(b===a) b=rint(n+1,10); A=[n,a];B=[n,b]; }
    return {kind:'comp',A,B,txt:'Fiquei na dúvida: qual pedaço é <b>maior</b>?'};
  }
  const d=pick([2,3,4,5,6,8]), n=rint(1,d-1); const c= d<=6&&Math.random()<.3? d*2 : d;
  return {kind:'serve',n,d,cuts:[c],txt:`Quero ${fr(n,d)} de pizza!`};
}
function ordRecheio(){
  for(let t=0;t<200;t++){
    const c=pick([4,6,8,12]); const dens=[2,3,4,6,8,12].filter(x=>c%x===0&&x<=c);
    const nf=Math.random()<.4?1:2; const fl=shuffle(['cal','fra','mil']).slice(0,nf);
    const parts=fl.map(k=>{ const d=pick(dens); let n=rint(1,Math.max(1,Math.floor(d/2))); const g=gcd(n,d); return {k,n:n/g,d:d/g}; });
    const used=parts.reduce((a,p)=>a+p.n*c/p.d,0);
    if(used>=c||used<1) continue;
    if(nf===2&&parts[0].n*parts[1].d===parts[1].n*parts[0].d&&Math.random()<.5) continue;
    const rest=c-used;
    const txt=`Quero ${parts.map(p=>`${fr(p.n,p.d)} de <b>${FLAV[p.k].t.toLowerCase()}</b>`).join(nf===2?', ':'')}${nf===2?'':''} e <b>o resto de queijo</b>!`;
    return {kind:'rech',c,parts,rest,txt};
  }
  return {kind:'rech',c:4,parts:[{k:'cal',n:1,d:2}],rest:2,txt:`Quero ${fr(1,2)} de <b>calabresa</b> e <b>o resto de queijo</b>!`};
}
const lcm=(a,b)=>a*b/gcd(a,b);
function ordCortador(){
  const hard=PZ.served>=3;
  for(let t=0;t<300;t++){
    const k=hard&&Math.random()<.7?3:2;
    const ds=[]; for(let i=0;i<k;i++) ds.push(pick(hard?[2,3,4,6]:[2,3,4,6,8]));
    const L=ds.reduce(lcm,1); if(L>12||L<3) continue;
    if(!hard){ const mx=Math.max(...ds); if(!ds.every(d=>mx%d===0)) continue; }
    else if(k===2&&ds.every(d=>Math.max(...ds)%d===0)) continue;
    const ns=ds.map(d=>Math.random()<.7?1:rint(1,d-1));
    const parts=ds.map((d,i)=>{ const g=gcd(ns[i],d); return {n:ns[i]/g,d:d/g}; });
    const sum=parts.reduce((a,p)=>a+p.n*L/p.d,0); if(sum>L) continue;
    const mons=shuffle(SP.filter(s=>s.r!=='lend')).slice(0,k);
    return {kind:'cut',parts,L,mons,txt:`Somos ${k} e vamos dividir <b>uma pizza só</b>:`, ask: sum<L&&Math.random()<.6};
  }
  return {kind:'cut',parts:[{n:1,d:2},{n:1,d:4}],L:4,mons:SP.slice(0,2),txt:'Somos 2 e vamos dividir <b>uma pizza só</b>:',ask:true};
}
function pzNext(){
  const f=PZ.f; PZ.nCust++;
  const key=o=>o.kind==='comp'?'c'+o.A+o.B: o.kind==='serve'?'s'+o.n+'/'+o.d+'|'+o.cuts.join(','): o.kind==='rech'?'r'+o.c+o.parts.map(p=>p.k+p.n+'/'+p.d).join(): 'k'+o.parts.map(p=>p.n+'/'+p.d).join();
  let o,t=0; do{ o= f===1?ordAprendiz(): f===2?ordRecheio(): ordCortador(); t++; }while(PZREC.includes(key(o))&&t<60);
  PZREC.push(key(o)); if(PZREC.length>15) PZREC.shift();
  const pmax=Math.max(f===3?35:15,PZF[f].pac-Math.floor(PZ.served/3)*(f===3?3:1));
  const mon= o.kind==='cut'? o.mons[0] : pick(SP.filter(s=>s.r!=='lend'||Math.random()<.2));
  PZ.cust={o,mon,pac:pmax,pmax};
  if(o.kind==='serve') PZ.cust.sel=o.cuts.map(()=>[]);
  if(o.kind==='rech'){ PZ.cust.fill=Array(o.c).fill(null); PZ.cust.tool='cal'; }
  if(o.kind==='cut'){ PZ.cust.cut=null; PZ.cust.who=0; PZ.cust.asg=[]; PZ.cust.stage='cut'; }
  PZ.msg=null; PZ.busy=false;
}
/* ---- desenho ---- */
function sliceGeom(c,i,R=86){
  const cx=100,cy=100, a0=-Math.PI/2+i*2*Math.PI/c, a1=a0+2*Math.PI/c, am=(a0+a1)/2;
  return {am, d:`M${cx} ${cy} L${(cx+R*Math.cos(a0)).toFixed(1)} ${(cy+R*Math.sin(a0)).toFixed(1)} A${R} ${R} 0 0 1 ${(cx+R*Math.cos(a1)).toFixed(1)} ${(cy+R*Math.sin(a1)).toFixed(1)} Z`, pt:k=>[(cx+Math.cos(am)*R*k).toFixed(1),(cy+Math.sin(am)*R*k).toFixed(1)]};
}
function topping(kind,g,c){
  const r=c>8?4:6;
  if(kind==='cal') return [.5,.78].map((k,j)=>{ const [x,y]=g.pt(k); return `<circle cx="${x}" cy="${y}" r="${r+1}" fill="#c0392b" stroke="#8e2316" stroke-width="1.5"/>`; }).join('');
  if(kind==='fra') return [.45,.7,.85].map(k=>{ const [x,y]=g.pt(k); return `<rect x="${x-r/1.5}" y="${y-r/2.2}" width="${r*1.4}" height="${r}" rx="2" fill="#c98b3a"/>`; }).join('');
  if(kind==='mil') return [.4,.58,.74,.88].map(k=>{ const [x,y]=g.pt(k); return `<circle cx="${x}" cy="${y}" r="${r/2+1}" fill="#f4b400" stroke="#b07d00" stroke-width="1"/>`; }).join('');
  if(kind==='que') return [.55,.8].map(k=>{ const [x,y]=g.pt(k); return `<circle cx="${x}" cy="${y}" r="${r/2+1.5}" fill="#fff8d6" opacity=".9"/>`; }).join('');
  return '';
}
function pizzaSVG(c,opts={}){
  const {pi=0,lifted=[],fill=null,color=null,act='pzslice',plain=false}=opts;
  let s=`<circle cx="100" cy="100" r="98" fill="#c98b3a"/><circle cx="100" cy="100" r="92" fill="#e2a24c"/>`;
  if(plain){ s+=`<circle cx="100" cy="100" r="86" fill="#ffd166" stroke="#b5651d" stroke-width="2.5"/>`; return `<svg class="pizza" viewBox="0 0 200 200">${s}</svg>`; }
  for(let i=0;i<c;i++){
    const g=sliceGeom(c,i), on=lifted.includes(i), off=on?9:0;
    const base= fill? (fill[i]?FLAV[fill[i]].c:'#b98a5a') : '#ffd166';
    const top= fill? (fill[i]?topping(fill[i],g,c):'') : topping('cal',g,c);
    const ring= color&&color[i]!=null? `<path d="${g.d}" fill="${WHO_C[color[i]]}" opacity=".55"/>` : '';
    s+=`<g class="slice ${on?'on':''}" transform="translate(${(Math.cos(g.am)*off).toFixed(1)} ${(Math.sin(g.am)*off).toFixed(1)})" data-act="${act}" data-p="${pi}" data-v="${i}" tabindex="0" role="button" aria-label="Fatia ${i+1}">
      <path d="${g.d}" fill="${base}" stroke="#b5651d" stroke-width="2.5"/>${top}${ring}${on?`<path d="${g.d}" fill="none" stroke="#2ee59d" stroke-width="5"/>`:''}</g>`;
  }
  return `<svg class="pizza" viewBox="0 0 200 200">${s}</svg>`;
}

function pzOk(extra){
  const P=PZ, c=P.cust; P.busy=true;
  P.served++; P.combo++; P.best=Math.max(P.best,P.combo);
  let pts=10*P.f+Math.ceil(c.pac); if(P.combo>=3) pts*=2; P.pts+=pts;
  sfx.ok(); if(P.combo%3===0) sfx.combo();
  P.msg={c:'ok',m:`${pick(['Delícia!','Perfeito!','Cliente feliz!','Essa saiu certinha!'])} +${pts} pontos${P.combo>=3?' (combo ×2)':''}${extra?`<span style="font-weight:700">${extra}</span>`:''}`};
  render(); setTimeout(()=>{ if(PZ===P&&VIEW.scr==='pz'&&P.t>0){ pzNext(); render(); } },1300);
}
function pzFail(why,detail){
  const P=PZ; if(P.busy) return; P.busy=true; P.lives--; P.combo=0; sfx.bad();
  P.msg={c:'bad',m: why==='tempo'?`${P.cust.o.kind==='cut'?'A mesa':P.cust.mon.nome} cansou de esperar e foi embora! 😠`:detail};
  render();
  setTimeout(()=>{ if(PZ!==P||VIEW.scr!=='pz') return; if(P.lives<=0) pzEnd(); else { pzNext(); render(); } }, why==='tempo'?1400:3200);
}
function pzServe(){
  const P=PZ, c=P.cust, o=c.o; if(P.busy) return;
  if(o.kind==='serve'){
    const cc=o.cuts[0], s=c.sel.reduce((a,x)=>a+x.length,0);
    if(s===0){ P.msg={c:'hint',m:'Toque nas fatias para separar o pedido.'}; render(); return; }
    const need=o.n*cc/o.d;
    if(s*o.d===o.n*cc){ pzOk(cc!==o.d?`${fr(o.n,o.d)} = ${fr(s,cc)}`:''); return; }
    pzFail('erro',`O cliente pediu ${fr(o.n,o.d)}. Com ${cc} fatias, isso é ${fr(need,cc)}: <b>${need} fatias</b>. Você serviu ${s}.${cc!==o.d?` (${fr(o.n,o.d)} = ${fr(need,cc)}: multiplique em cima e embaixo por ${cc/o.d})`:''}`); return;
  }
  if(o.kind==='rech'){
    if(c.fill.some(x=>!x)){ P.msg={c:'hint',m:'Ainda tem fatia sem recheio. Toda a pizza precisa ser recheada.'}; render(); return; }
    const cnt=k=>c.fill.filter(x=>x===k).length;
    const errs=o.parts.filter(p=>cnt(p.k)!==p.n*o.c/p.d);
    const qOk=cnt('que')===o.rest;
    if(!errs.length&&qOk){ pzOk(o.parts.map(p=>`${FLAV[p.k].t}: ${fr(p.n,p.d)} = ${fr(p.n*o.c/p.d,o.c)}`).join(' · ')+` · Queijo (o resto): ${fr(o.rest,o.c)}`); return; }
    const lines=o.parts.map(p=>`${FLAV[p.k].t}: ${fr(p.n,p.d)} = ${fr(p.n*o.c/p.d,o.c)} → <b>${p.n*o.c/p.d} fatias</b> (você pôs ${cnt(p.k)})`);
    lines.push(`Queijo (o resto): ${o.c} − ${o.c-o.rest} = <b>${o.rest} fatias</b> (você pôs ${cnt('que')})`);
    pzFail('erro',`Pedido errado! Numa pizza de ${o.c} fatias:<span style="font-weight:700;display:grid;gap:2px">${lines.map(l=>`<span>${l}</span>`).join('')}</span>`); return;
  }
  if(o.kind==='cut'&&c.stage==='give'){
    const need=o.parts.map(p=>p.n*c.cut/p.d);
    const got=o.parts.map((_,k)=>c.asg.filter(x=>x===k).length);
    if(need.every((n,k)=>n===got[k])){
      const left=c.cut-need.reduce((a,b)=>a+b,0);
      if(o.ask&&left>0){
        const g=gcd(left,c.cut); const ok=fr(left/g,c.cut/g);
        const cand=[fr(left,c.cut)===ok?null:fr(left,c.cut), fr(c.cut-left,c.cut), fr(left,c.cut+1), fr(1,left+1), fr(left+1,c.cut)].filter(Boolean);
        const val=t=>{ const m=t.match(/class="n">(\d+)<.*class="d">(\d+)</); return +m[1]/+m[2]; };
        const opts=[ok]; for(const x of cand){ if(opts.length>=3) break; if(!opts.some(y=>Math.abs(val(y)-val(x))<1e-9)) opts.push(x); }
        c.opts=shuffle(opts); c.okIdx=c.opts.indexOf(ok); c.left=left; c.stage='ask'; P.msg={c:'ok',m:'Mesa servida! Agora responda o gerente.'}; render(); return;
      }
      pzOk(`Corte em ${c.cut}: ${o.parts.map((p,k)=>`${fr(p.n,p.d)} = ${fr(need[k],c.cut)}`).join(' · ')}`); return;
    }
    pzFail('erro',`Com a pizza em ${c.cut} fatias: ${o.parts.map((p,k)=>`${o.mons[k].nome} pediu ${fr(p.n,p.d)} = ${fr(need[k],c.cut)} → <b>${need[k]} fatias</b> (recebeu ${got[k]})`).join('; ')}.`);
  }
}
function pzCut(n){
  const P=PZ, c=P.cust, o=c.o; if(P.busy||c.stage!=='cut') return;
  const bad=o.parts.filter(p=>n%p.d!==0);
  if(!bad.length){ c.cut=n; c.asg=Array(n).fill(null); c.stage='give'; P.msg=null; tone(700,0,.08); tone(900,.08,.1); render(); return; }
  c.pac=Math.max(1,c.pac-4); sfx.bad();
  const p=bad[0];
  P.msg={c:'bad',m:`Em ${n} fatias não dá para separar ${fr(p.n,p.d)} certinho: ${n} não é múltiplo de ${p.d}. Procure um número que seja múltiplo de ${o.parts.map(q=>q.d).filter((v,i,a)=>a.indexOf(v)===i).join(', ')}. (−4 s de paciência)`};
  render();
}
function pzLeft(k){
  const P=PZ, c=P.cust; if(P.busy) return;
  if(k===c.okIdx) pzOk(`Sobrou ${fr(c.left,c.cut)}${gcd(c.left,c.cut)>1?` = ${frS(c.left,c.cut)}`:''} da pizza.`);
  else pzFail('erro',`Sobraram ${c.left} das ${c.cut} fatias: ${fr(c.left,c.cut)}${gcd(c.left,c.cut)>1?` = ${frS(c.left,c.cut)}`:''} da pizza.`);
}
function pzComp(k){
  const P=PZ, o=P.cust.o; if(P.busy) return;
  const right= o.A[0]/o.A[1]>o.B[0]/o.B[1]?0:1, big=right?o.B:o.A;
  const same=o.A[1]===o.B[1];
  if(k===right) pzOk(same?'Mesmo denominador: ganha quem tem mais fatias (maior numerador).':'Mesmo numerador: quanto menor o denominador, maior o pedaço.');
  else pzFail('erro', same?`Com o mesmo denominador, as fatias têm o mesmo tamanho. Ganha quem tem <b>mais fatias</b>: ${fr(...big)}.`:`Com o mesmo numerador, quanto <b>maior</b> o denominador, mais fatias a pizza tem e <b>menor</b> é cada pedaço. O maior é ${fr(...big)}.`);
}

function rtNum(f){
  if(f<=2){
    const pool=[]; for(const dd of [2,3,4,5,6,8,10]){ const MM=dd<=4?2:1; for(let mm=1;mm<MM*dd;mm++) if(mm%dd!==0&&!RTREC.includes(dd+'/'+mm)) pool.push([dd,mm]); }
    const [d,m]=pick(pool.length?pool:[[4,3]]); const M=d<=4?2:1; RTREC.push(d+'/'+m); if(RTREC.length>20) RTREC.shift();
    const dec=[2,4,5,10].includes(d);
    const useDec= f===2&&dec&&Math.random()<.55;
    const show= useDec? fmt(m/d) : fr(m,d);
    let bonus=null; if(f===2&&dec&&Math.random()<.2) bonus= useDec? fr(m,d) : fmt(m/d);
    return {M,d,m,v:m/d,show,bonus};
  }
  const M=3; let d,m,t=0; do{ d=pick([2,3,4,5,10,4,2]); do{ m=rint(1,M*d-1);}while(m%d===0); t++; }while(RTREC.includes(d+'/'+m)&&t<50); RTREC.push(d+'/'+m); if(RTREC.length>20) RTREC.shift();

}

const PIR=['O capitão','A capitã','O cozinheiro','O navegador','A imediata'];
function tsGen(f){

      const L=ds.reduce(lcm,1); if(L>40) continue;

      const sum=parts.reduce((a,p)=>a+p.n/p.d,0); if(sum>=1) continue;

    const ctx=pick([`O papagaio roubou ${fr(n,d)} do tesouro, o que deu <b>${V} moedas</b>. Quantas moedas tinha o tesouro inteiro?`,`${fr(n,d)} do baú são <b>${V} moedas</b>. Quantas moedas cabem no baú inteiro?`,`O navegador ganhou ${fr(n,d)} do tesouro: <b>${V} moedas</b>. Qual era o total do tesouro?`]);

      sol:`${fr(1,a)} de ${T} = ${gasto}. Sobrou ${T} − ${gasto} = ${s1}. ${fr(1,b)} de ${s1} = ${deu}. Ficaram ${s1} − ${deu} = ${fim} moedas.`,

const ITENS=[['Pão de queijo',150,450],['Suco',250,690],['Caderno',890,1890],['Chocolate',275,795],['Biscoito',199,549],['Lápis',95,295],['Sorvete',350,990],['Refrigerante',399,899],['Bala',25,150],['Pastel',450,850]];
function mkCaixa(){
  const k=rint(1,3); const its=shuffle(ITENS).slice(0,k).map(([n,a,b])=>[n,Math.round(rint(a,b)/5)*5]);
  const tot=its.reduce((s,i)=>s+i[1],0); const V=[1000,2000,5000,10000].find(v=>v>tot&&v-tot<=6000&&(v-tot)%100!==0)||[1000,2000,5000,10000].find(v=>v>tot);
  return {kind:'troco',its,tot,V,ans:V-tot,key:'t'+its.map(i=>i[1]).join('-')+'/'+V};
}
function mkPromo(){
  const t=pick(['perc','pack','dec','dec']);
  if(t==='dec'){
    const w=rint(1,15), d1=rint(1,9);
    let c2; do{ c2=d1*10+pick([5,3,8,-5,-2,-1,4,6]); }while(c2<1||c2>99||c2%10===0||c2===d1*10);
    const A=w*100+d1*10, B=w*100+c2;
    const sA=`${w},${d1}`, sB=`${w},${String(c2).padStart(2,'0')}`;
    const it=pick(['O pacote de biscoito','O suco','O sorvete','O caderno','A caneta']);
    const cards=Math.random()<.5?[[sA,A],[sB,B]]:[[sB,B],[sA,A]];
    return {kind:'promo',A:{t:`R$ ${cards[0][0]}`,s:'na loja 1',v:cards[0][1]},B:{t:`R$ ${cards[1][0]}`,s:'na loja 2',v:cards[1][1]},q:`${it} custa:`,
      exp:`Complete com zero: ${sA} = ${w},${d1}0. Compare os centavos: ${d1}0 e ${String(c2).padStart(2,'0')}. O menor é R$ ${A<B?sA:sB}.`,key:`d${A}-${B}`};
  }
  if(t==='perc'){
    for(let k=0;k<400;k++){
      const opt=()=>{ const p=pick([10,25,50,0]); const step= p===25?20:10; const P=rint(Math.ceil(40/step),Math.floor(200/step))*step; return {P,p,f:P*(100-p)/100}; };
      const a=opt(), b=opt(); if(a.p===0&&b.p===0) continue; if(a.p===b.p) continue;
      if(Math.abs(a.f-b.f)<2||Math.abs(a.f-b.f)>20||Math.abs(a.P-b.P)>80) continue;
      const lab=o=>o.p?{t:`R$ ${o.P}`,s:`com ${o.p}% de desconto`}:{t:`R$ ${o.P}`,s:'sem desconto'};
      const it=pick(['O mesmo tênis','A mesma mochila','O mesmo fone de ouvido','A mesma bola','O mesmo jogo']);
      const ex=o=>o.p?`R$ ${o.P} − ${o.p}% (${o.p===50?'metade':o.p===25?'um quarto':'um décimo'}: R$ ${o.P*o.p/100}) = R$ ${o.f}`:`R$ ${o.P} sem desconto`;
      return {kind:'promo',A:{...lab(a),v:a.f},B:{...lab(b),v:b.f},q:`${it} em duas lojas. Onde sai mais barato?`,exp:`${ex(a)}. ${ex(b)}.`,key:`p${a.P}/${a.p}-${b.P}/${b.p}`};
    }
  }
  const U=[50,75,100,125,150,200,250]; const u=pick(U);
  const k=pick([2,4,5,10].filter(k=>(u*k)%50===0&&u*k<=2000));
  let y; do{ y=u+pick([-50,-25,25,50]); }while(y<=0);
  const it=pick([['sucos','suco'],['iogurtes','iogurte'],['pães','pão'],['canetas','caneta'],['sabonetes','sabonete']]);
  const cards=Math.random()<.5?[{t:`${k} ${it[0]}`,s:`por ${rs(u*k)}`,v:u},{t:`1 ${it[1]}`,s:`por ${rs(y)}`,v:y}]:[{t:`1 ${it[1]}`,s:`por ${rs(y)}`,v:y},{t:`${k} ${it[0]}`,s:`por ${rs(u*k)}`,v:u}];
  return {kind:'promo',A:cards[0],B:cards[1],unit:true,q:'Qual sai mais barato por unidade?',exp:`No pacote, cada ${it[1]} sai por ${rs(u*k)} ÷ ${k} = ${rs(u)}. Avulso: ${rs(y)}.`,key:`k${k}-${u}-${y}`};
}
function mkNota(){
  for(let i=0;i<500;i++){
    const w=rint(5,35); const p=rint(150,1290); if((w*p)%10!==0) continue; const v1=w*p/10;
    const d=pick([10,20,25,50]); if((v1*d)%100!==0) continue; const v2=v1-v1*d/100;
    const n=pick([2,3,4,5]); if(v2%n!==0) continue; const v3=v2/n;
    const it=pick([['banana','kg'],['queijo','kg'],['carne','kg'],['uva','kg'],['tomate','kg']]);
    return {kind:'nota',w,p,v1,d,v2,n,v3,it,key:`n${w}-${p}-${d}-${n}`};
  }
  return mkNota();
}
function mkGen(f){ return f===1?mkCaixa(): f===2?mkPromo(): mkNota(); }
function mkStart(f){
  stopTimer();
  MK={f,i:0,total:f===1?8:f===3?5:999,pts:0,combo:0,best:0,hits:0,mult:startRun('G4'),res:[],t:60,ended:false};
  VIEW.scr='mk'; mkNext(); render(); window.scrollTo(0,0); mkFocus();
  let last=Date.now();
  MKT=setInterval(()=>{ const now=Date.now(), dt=(now-last)/1000; last=now; const P=MK; if(!P) return;
    if(P.f===2){ P.t=Math.max(0,P.t-dt); const el=$('#mkT'); if(el){ el.textContent=Math.ceil(P.t)+'s'; el.classList.toggle('low',P.t<=10); } if(P.t<=0) mkEnd(); return; }
    if(P.busy) return; P.tl-=dt; const r=Math.max(0,P.tl/P.tmax); const b=$('#mkBar'); if(b){ b.style.width=(r*100)+'%'; b.className=r<.3?'low':r<.6?'mid':''; }
    if(P.tl<=0) mkMiss('tempo'); },100);
}
function mkNext(){
  const P=MK; P.i++; let q,t=0; do{ q=mkGen(P.f); t++; }while(MKREC.includes(q.key)&&t<60); MKREC.push(q.key); if(MKREC.length>25) MKREC.shift();
  P.q=q; P.msg=null; P.busy=false; P.typed={}; P.given=[];
  P.tmax= P.f===1? Math.max(25,40-P.hits*2) : 100; P.tl=P.tmax;
}

      <div class="cash">${DENOM.map(moneyBtn).join('')}</div>

  if(q.kind==='promo') return `<p style="font-weight:900;font-size:1.15rem">${q.q}${/:$/.test(q.q)?' qual é mais barato?':''}</p>
      <div class="offers">${[q.A,q.B].map((o,k)=>`<button class="offer" data-act="mkpick" data-v="${k}" ${dis}><span class="ot">${o.t}</span><span class="os">${o.s}</span></button>`).join('')}</div>`;
  const inp=(id,lab)=>`<label class="nrow"><span>${lab}</span><span class="nin">R$ <input class="ain sm" id="${id}" inputmode="decimal" autocomplete="off" value="${P.typed[id]??''}" ${dis}></span></label>`;
  return `<form id="fMk" class="nota"><div class="nhead">MERCADINHO DOS MATEMONSTROS · NOTA ${P.i}/5</div>
    ${inp('mk1',`${fmt(q.w/10)} kg de ${q.it[0]} × ${rs(q.p)} o kg`)}

    ${inp('mk3',`Dividido igualmente entre ${q.n} amigos, cada um paga`)}
    <button class="btn" type="submit" ${dis}>Fechar nota</button></form>`;
}

function mkOk(extra){
  const P=MK; P.busy=true; P.hits++; P.combo++; P.best=Math.max(P.best,P.combo); P.res.push(true);
  let pts=10*P.f+(P.f===2?5:Math.ceil(P.tl/(P.f===3?3:1))); if(P.combo>=3) pts*=2; P.pts+=pts; sfx.coin(); sfx.ok(); if(P.combo%3===0) sfx.combo();
  P.msg={c:'ok',m:`${pick(['Certinho!','Cliente satisfeito!','Conta fechada!','Boa compra!'])} +${pts} pontos${P.combo>=3?' (combo ×2)':''}${extra?`<span style="font-weight:700">${extra}</span>`:''}`};
  render(); setTimeout(()=>mkAfter(P),P.f===2?700:1400);
}
function mkMiss(why,detail){
  const P=MK; if(P.busy) return; P.busy=true; P.combo=0; P.res.push(false); sfx.bad();
  if(P.f===2) P.t=Math.max(0,P.t-3);
  P.msg={c:'bad',m: why==='tempo'?`O tempo acabou!${detail?`<span style="font-weight:700">${detail}</span>`:''}`:detail};
  render(); setTimeout(()=>mkAfter(P),P.f===2?1800:3800);
}
function mkAfter(P){ if(MK!==P||VIEW.scr!=='mk'||P.ended) return; if(P.f!==2&&P.i>=P.total) mkEnd(); else if(P.f===2&&P.t<=0) mkEnd(); else { mkNext(); render(); mkFocus(); } }
function mkGive(){ const P=MK, q=P.q; if(P.busy) return; const sum=P.given.reduce((a,b)=>a+b,0);
  if(!sum){ P.msg={c:'hint',m:'Toque nas notas e moedas para montar o troco.'}; render(); return; }
  if(sum===q.ans) mkOk(`${rsShort(q.V)} − ${rsShort(q.tot)} = ${rsShort(q.ans)}`);
  else mkMiss('erro',`Troco certo: <b>${rs(q.ans)}</b> (você deu ${rs(sum)}).<span style="font-weight:700">Arme a conta com vírgula embaixo de vírgula: ${rsShort(q.V)} − ${rsShort(q.tot)} = ${rsShort(q.ans)}.</span>`); }
function mkPick(k){ const P=MK, q=P.q; if(P.busy) return; const right=q.A.v<q.B.v?0:1;
  if(k===right) mkOk(); else mkMiss('erro',`A mais barata era a outra. ${q.exp} (−3 s)`); }
function mkSubmit(){
  const P=MK, q=P.q; if(P.busy) return;
  P.typed={}; ['mk1','mk2','mk3'].forEach(id=>P.typed[id]=esc($('#'+id).value));
  const v=['mk1','mk2','mk3'].map(id=>parseNum($('#'+id).value));
  if(v.some(x=>x===null)){ P.msg={c:'hint',m:'Preencha as três linhas com números (use vírgula nos centavos).'}; render(); return; }
  const ans=[q.v1,q.v2,q.v3].map(c=>c/100), ok=v.map((x,i)=>Math.abs(x-ans[i])<.001);
  if(ok.every(Boolean)){ mkOk(); return; }
  const lines=[];
  if(!ok[0]) lines.push(`${fmt(q.w/10)} × ${rsShort(q.p)} = <b>${rsShort(q.v1)}</b>. Multiplique sem as vírgulas (${q.w} × ${q.p} = ${q.w*q.p}) e conte as casas decimais dos dois fatores: 1 + 2 = 3 casas.`);
  if(!ok[1]) lines.push(`${q.d}% de ${rsShort(q.v1)} = ${rsShort(q.v1*q.d/100)}. Com desconto: ${rsShort(q.v1)} − ${rsShort(q.v1*q.d/100)} = <b>${rsShort(q.v2)}</b>.`);
  if(!ok[2]) lines.push(`${rsShort(q.v2)} ÷ ${q.n} = <b>${rsShort(q.v3)}</b>.`);
  mkMiss('erro',`Nota com erro:<span style="font-weight:700;display:grid;gap:4px">${lines.map(l=>`<span>${l}</span>`).join('')}</span>`);
}
function mkEnd(){
  mkStop(); const P=MK; if(!P||P.ended) return; P.ended=true;
  S.mk=S.mk||{}; P.rec=P.pts>(S.mk[P.f]||0); if(P.rec) S.mk[P.f]=P.pts;
  const F=MKF[P.f]; const base=Math.max(8,Math.min(F.cap,Math.round(2+P.hits*F.fat)));
  P.coins=earn(base,P.mult); save(); mission('gameDone'); sfx.end();
  VIEW.scr='mkend'; render(); window.scrollTo(0,0);
}

document.addEventListener('submit',e=>{
  e.preventDefault();
  const id=e.target.id;
  if(id==='fNew'){ const raw=$('#nick').value.trim().replace(/\s+/g,' '); const parts=raw.split(' ').filter(w=>w.length>=2);
    if(parts.length<2){ const er=$('#eNew'); er.textContent='Digite seu nome e sobrenome.'; er.hidden=false; return; }
    const n=`${titleCase(raw)} (${$('#turma').value})`;
    Object.assign(S,{apelido:n,coins:0,xp:0,pity:0,hatched:0,got:[],stars:{},rec:{},day:null,coinFrac:0,simBest:null,simN:0}); save(); go('hub',{tab:'contas'}); }
  if(id==='fLoad'){ const n=`${titleCase($('#lnick').value.trim().replace(/\s+/g,' '))} (${$('#lturma').value})`, c=$('#lcode').value; const d=unpackSave(n,c); const er=$('#eLoad');
    if(!n||!d){ er.textContent='O código não confere com esse nome e turma. Confira as letras do código e escreva o nome igual ao da primeira vez (maiúsculas e acentos não importam).'; er.hidden=false; return; }
    Object.assign(S,{apelido:n,rec:{},day:null,coinFrac:0,simN:0},d);
    const dd=day(); dd.locked=true; dd.ms.forEach(m=>{ m.done=true; m.p=m.n; }); RUNKEYS.forEach(k=>{ dd.runs[k]=Math.max(dd.runs[k]||0,2); });
    save(); toast('Progresso recuperado!'); go('hub',{tab:'contas'}); }
  if(id==='fAns'){ const r=readAnswer(); if(r.err){ G.fb={c:'bad',m:r.err}; const fb=document.querySelector('#qbox .fb'); if(fb) fb.remove(); $('#qbox').insertAdjacentHTML('beforeend',`<div class="fb bad">${r.err}</div>`); return; } answer(r.v); }
  if(id==='fTs'){ tsSubmit(); return; }
  if(id==='fMk'){ mkSubmit(); return; }
  if(id==='fProf'){ const r=checkConf($('#pn').value,$('#pc').value), box=$('#pres');
    if(!r){ box.innerHTML='<p class="err">Formato inválido. O código tem este formato: FQ2-340-K7M.</p>'; return; }
    const c=ctById(r.cid);
    box.innerHTML= r.ok? `<div class="fb ok"><span>Código verdadeiro</span><span class="ans">${r.pts} pontos</span><span>${c.nome} · Nível ${r.l}</span></div>`
                       : `<div class="fb bad"><span>Código não confere com esse apelido.</span><span>Pode ter sido digitado errado ou alterado.</span></div>`; }
});
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]'); if(!b) return;
  const a=b.dataset.act, v=b.dataset.v;
  if(a==='tab'){ VIEW.tab=v; VIEW.seen=null; VIEW.fresh=null; render(); }
  else if(a==='pickct'){ VIEW.cid=v; VIEW.lvl=[3,2,1].find(l=>unlocked(v,l)); go('setup'); }
  else if(a==='lvl'){ VIEW.lvl=+v; render(); }
  else if(a==='play'){ startGame(v); }
  else if(a==='choose'){ if(G&&G.state==='ask') answer(v); }
  else if(a==='hint'){ G.hint=true; render(); }
  else if(a==='next'){ nextQ(); render(); }
  else if(a==='quit'){ if(G&&G.mode==='relampago'){ go('setup'); } else go('setup'); }
  else if(a==='again'){ startGame('relampago'); }
  else if(a==='tomon'){ go('hub',{tab:'monstros'}); }
  else if(a==='hub'){ go('hub'); }
  else if(a==='start'){ go('start'); }
  else if(a==='hatch'){ hatch(); }
  else if(a==='seemon'){ VIEW.seen=+v; VIEW.fresh=null; render(); }
  else if(a==='save'){ go('save',{leaving:false}); }
  else if(a==='prof'){ go('prof'); }
  else if(a==='som'){ S.som=!S.som; save(); render(); }
  else if(a==='simstart'){ startSim(v); }
  else if(a==='simalt'){ SIM.ans[SIM.i]=+v; SIM.confirm=false; render(); }
  else if(a==='simgo'){ SIM.i=+v; SIM.confirm=false; render(); window.scrollTo(0,0); }
  else if(a==='simprev'){ if(SIM.i>0){ SIM.i--; SIM.confirm=false; render(); window.scrollTo(0,0); } }
  else if(a==='simnext'){ SIM.i++; SIM.confirm=false; render(); window.scrollTo(0,0); }
  else if(a==='simfinish'){ if(SIM.ans.filter(x=>x!=null).length<SIM.qs.length){ SIM.confirm=true; render(); } else finishSim(); }
  else if(a==='simforce'){ finishSim(); }
  else if(a==='simback'){ SIM.confirm=false; SIM.i=SIM.qs.findIndex((_,k)=>SIM.ans[k]==null); render(); }
  else if(a==='simquit'){ SIM=null; go('hub',{tab:'simulado'}); }
  else if(a==='simagain'){ startSim(SIM.mode); }
  else if(a==='pzmenu'){ go('pzmenu'); }
  else if(a==='rtmenu'){ go('rtmenu'); }
  else if(a==='tsmenu'){ go('tsmenu'); }
  else if(a==='mkmenu'){ go('mkmenu'); }
  else if(a==='mkstart'){ mkStart(+v); }
  else if(a==='mkadd'){ if(MK&&!MK.busy){ MK.given.push(+v); if(MK.msg&&MK.msg.c==='hint') MK.msg=null; sfx.coin(); render(); } }
  else if(a==='mkundo'){ if(MK&&!MK.busy){ MK.given.pop(); render(); } }
  else if(a==='mkclear'){ if(MK&&!MK.busy){ MK.given=[]; render(); } }
  else if(a==='mkgive'){ mkGive(); }
  else if(a==='mkpick'){ mkPick(+v); }
  else if(a==='mkquit'){ mkEnd(); }
  else if(a==='tsstart'){ tsStart(+v); }
  else if(a==='tssplit'){ tsSplit(+v); }
  else if(a==='tssack'){ const P=TS; if(!P||P.busy||P.stage!=='pick') return; const i=+v, k=P.sel.indexOf(i); if(k>=0) P.sel.splice(k,1); else P.sel.push(i); tone(600+P.sel.length*50,0,.06,'square',.04); render(); }
  else if(a==='tspick'){ tsPick(); }
  else if(a==='tsquit'){ tsEnd(); }
  else if(a==='rtstart'){ rtStart(+v); }
  else if(a==='rtfire'){ if(RT&&RT.f===3) rtShoot(RT.tx); }
  else if(a==='rtquit'){ rtEnd(); }
  else if(a==='hubgames'){ go('hub',{tab:'games'}); }
  else if(a==='pzstart'){ pzStart(+v); }
  else if(a==='pzslice'){ const P=PZ; if(!P||P.busy) return; const c=P.cust, i=+v;
    if(c.o.kind==='serve'){ const pi=+b.dataset.p, sel=c.sel[pi]; const k=sel.indexOf(i); if(k>=0) sel.splice(k,1); else sel.push(i); tone(520+sel.length*40,0,.06,'square',.04); }
    else if(c.o.kind==='rech'){ c.fill[i]= c.tool==='x'?null:c.tool; tone(600,0,.05,'square',.04); }
    if(P.msg&&P.msg.c==='hint') P.msg=null; render(); }
  else if(a==='pzgive'){ const P=PZ; if(!P||P.busy) return; const c=P.cust, i=+v; c.asg[i]= c.asg[i]===c.who?null:c.who; tone(560+c.who*90,0,.06,'square',.04); render(); }
  else if(a==='pzflavor'){ if(PZ&&!PZ.busy){ PZ.cust.tool=v; render(); } }
  else if(a==='pzwho'){ if(PZ&&!PZ.busy){ PZ.cust.who=+v; render(); } }
  else if(a==='pzcut'){ pzCut(+v); }
  else if(a==='pzleft'){ pzLeft(+v); }
  else if(a==='pzclear'){ const P=PZ; if(!P||P.busy) return; const c=P.cust; if(c.o.kind==='serve') c.sel=c.sel.map(()=>[]); if(c.o.kind==='rech') c.fill=c.fill.map(()=>null); if(c.o.kind==='cut'&&c.stage==='give') c.asg=c.asg.map(()=>null); render(); }
  else if(a==='pzserve'){ pzServe(); }
  else if(a==='pzcomp'){ pzComp(+v); }
  else if(a==='pzquit'){ pzEnd(); }
  else if(a==='sair'){ go('save',{leaving:true}); }
  else if(a==='leave'){ VIEW.leaving=false; go('start'); }
  else if(a==='copy'){ const code=$('#saveCode').textContent;
    const done=()=>{$('#copied').textContent='Copiado!'};
    try{ navigator.clipboard.writeText(code).then(done,()=>{ selectCode(); $('#copied').textContent='Selecionado: use Ctrl+C.'; }); }catch(err){ selectCode(); } }
});
function selectCode(){ const r=document.createRange(); r.selectNodeContents($('#saveCode')); const s=getSelection(); s.removeAllRanges(); s.addRange(r); }
document.addEventListener('pointerdown',e=>{
  const svg=e.target.closest&&e.target.closest('#rline'); if(!svg||!RT||RT.f===3||RT.busy||VIEW.scr!=='rt') return;
  const pt=svg.createSVGPoint(); pt.x=e.clientX; pt.y=e.clientY; const p=pt.matrixTransform(svg.getScreenCTM().inverse());
  const v=(p.x-RX0)/(RX1-RX0)*RT.q.M; if(v<-0.15||v>RT.q.M+0.15) return; rtShoot(Math.max(0,Math.min(RT.q.M,v)));
});
document.addEventListener('keydown',e=>{
  if(e.key===' '&&VIEW.scr==='rt'&&RT&&RT.f===3){ e.preventDefault(); if(!RT.busy) rtShoot(RT.tx); return; }
  if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('.slice')){ e.preventDefault(); e.target.dispatchEvent(new MouseEvent('click',{bubbles:true})); return; }
  if(VIEW.scr!=='play'||!G) return;
  if(e.key==='Enter'&&G.state==='done'&&G.mode==='treino'){ e.preventDefault(); nextQ(); render(); return; }
  if(G.state==='ask'&&G.q.kind==='choice'){
    const map={'>':'>','<':'<','=':'=','s':'S','n':'N'}; const k=map[e.key.toLowerCase()]; if(k&&G.q.opts.some(o=>o[0]===k)){ e.preventDefault(); answer(k); }
  }
});

/* início */
load();
if(S.apelido) VIEW={scr:'hub',tab:'contas'};
render();
</script>
