<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Matemonstros 7º ano</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
/* Layout: app de uma coluna estilo console — barra do jogador fixa no topo, abas, e telas de jogo centralizadas. Visual único e escuro de propósito (jogo). */
:root{
  color-scheme: dark;
  --bg:#0e1a2c; --bg2:#13243b; --panel:#182d48; --panel2:#1e3657; --line:#2a4669;
  --ink:#f3f7ff; --muted:#a3b6d1; --accent:#ffcf3f; --accent-ink:#2a1d00; --accent-dk:#b3540b;
  --ok:#2ee59d; --ok-ink:#05301f; --bad:#ff5d73; --bad-ink:#3a0610;
  --c-comum:#9fb2c9; --c-raro:#3fb8ff; --c-epico:#cf6bff; --c-lend:#ffc93c;
  --nu:#7ec8ff; --de:#ff9a8b;
  --display:'Lilita One','Arial Black',system-ui,sans-serif;
  --body:'Nunito',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;
  background-image:radial-gradient(circle at 1px 1px, rgba(255,255,255,.06) 1px, transparent 0);background-size:22px 22px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg2)}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
input{font:inherit}
.wrap{max-width:980px;margin:0 auto;padding-block:16px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;letter-spacing:.01em;text-wrap:balance}
h2{font-size:1.7rem} h3{font-size:1.3rem}
p{margin:0}
.muted{color:var(--muted)}
.stack{display:grid;gap:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* botões */
.btn{border:0;border-radius:14px;padding:13px 20px;font-weight:900;font-size:1.05rem;color:var(--accent-ink);background:var(--accent);box-shadow:0 5px 0 var(--accent-dk);transition:transform .08s, box-shadow .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--accent-dk)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:0 5px 0 var(--accent-dk)}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line);box-shadow:none}
.btn.ghost:hover{background:var(--panel)}
.btn.sm{padding:8px 14px;font-size:.92rem;border-radius:11px}
.link{background:none;border:0;color:var(--muted);text-decoration:underline;font-weight:800;padding:4px}

/* logo e início */
.logo{font-family:var(--display);font-size:clamp(2.6rem,9vw,4.2rem);line-height:.95;margin:0;color:var(--accent);
  text-shadow:0 4px 0 var(--accent-dk),0 8px 18px rgba(0,0,0,.45);-webkit-text-stroke:1.5px #5a2a00}
.start{max-width:520px;margin:6vh auto 0;display:grid;gap:18px;text-align:center;justify-items:center}
.start .mons{display:flex;justify-content:center;gap:4px}
.start .mons svg{width:96px}
.card-box{background:linear-gradient(180deg,var(--panel),var(--bg2));border:2px solid var(--line);border-radius:20px;padding:18px;display:grid;gap:12px;width:100%;text-align:left}
.field{display:grid;gap:6px}
.field label{font-weight:800;color:var(--muted);font-size:.9rem}
.txt{width:100%;padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);font-weight:800;font-size:1.1rem}
.err{color:var(--bad);font-weight:800;font-size:.92rem}

/* barra do jogador */
.player{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg2);border-bottom:2px solid var(--line)}
.player .in{max-width:980px;margin:0 auto;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.pname{font-family:var(--display);font-size:1.25rem;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:40vw}
.lvl{display:flex;align-items:center;gap:8px;font-weight:900;font-size:.9rem;flex:1;min-width:150px}
.lvl .xb{flex:1;height:10px;border-radius:999px;background:var(--panel);border:2px solid var(--line);overflow:hidden}
.lvl .xb i{display:block;height:100%;background:linear-gradient(90deg,var(--ok),var(--accent));width:0;transition:width .4s}
.coins{display:flex;align-items:center;gap:6px;font-family:var(--display);font-size:1.3rem;font-variant-numeric:tabular-nums}
.coin{width:22px;height:22px;flex:none}
.tabs{display:flex;gap:6px;margin:16px 0;overflow-x:auto}
.tab{flex:1;min-width:110px;border:2px solid var(--line);background:var(--panel);border-radius:14px;padding:10px 8px;font-weight:900;display:grid;justify-items:center;gap:2px}
.tab small{font-weight:800;font-size:.72rem;color:var(--muted)}
.tab.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);box-shadow:0 4px 0 var(--accent-dk)}
.tab.on small{color:var(--accent-ink)}

/* conteúdos */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.ct{border:2px solid var(--line);background:linear-gradient(180deg,var(--panel),var(--bg2));border-radius:18px;padding:14px;text-align:left;display:grid;gap:8px;align-content:start}
.ct:hover{border-color:var(--accent)}
.ct .ic{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;font-family:var(--display);font-size:1.15rem;background:var(--hue);color:#0e1a2c}
.ct h3{font-size:1.15rem}
.ct .st{display:flex;gap:10px;font-size:.8rem;font-weight:900;color:var(--muted)}
.starrow{letter-spacing:1px;color:var(--accent)}
.starrow .off{color:var(--line)}

/* setup */
.levels{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:620px){.levels{grid-template-columns:1fr}}
.lv{border:2px solid var(--line);background:var(--panel);border-radius:16px;padding:12px;text-align:left;display:grid;gap:6px}
.lv.on{border-color:var(--accent);background:var(--panel2);box-shadow:0 0 0 2px var(--accent) inset}
.lv:disabled{opacity:.5;cursor:not-allowed}
.lv b{font-family:var(--display);font-weight:400;font-size:1.15rem}
.lv span{font-size:.86rem;color:var(--muted);font-weight:700}
.modes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:520px){.modes{grid-template-columns:1fr}}
.mode{border:2px solid var(--line);background:var(--panel);border-radius:16px;padding:14px;text-align:left;display:grid;gap:4px}
.mode b{font-family:var(--display);font-weight:400;font-size:1.3rem}
.mode span{color:var(--muted);font-size:.9rem;font-weight:700}
.mode.fire{border-color:var(--accent)}
.back{display:inline-flex;align-items:center;gap:6px}

/* jogo */
.hud{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.pill{background:var(--panel);border:2px solid var(--line);border-radius:999px;padding:6px 14px;font-weight:900;font-variant-numeric:tabular-nums}
.pill.timer{font-family:var(--display);font-size:1.4rem;padding:4px 16px}
.pill.timer.low{border-color:var(--bad);color:var(--bad);animation:pulse .6s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.06)}}
.combo{font-family:var(--display);font-size:1.3rem;color:var(--accent);min-width:90px;text-align:right}
.combo.x2{color:#7ef0ff}.combo.x3{color:#ff7ae6}
.tbar{height:8px;border-radius:999px;background:var(--panel);overflow:hidden}
.tbar i{display:block;height:100%;background:var(--accent);width:100%;transition:width .25s linear}
.qbox{background:linear-gradient(180deg,var(--panel),var(--bg2));border:2px solid var(--line);border-radius:22px;padding:22px 18px;display:grid;gap:16px;justify-items:center;text-align:center;position:relative;overflow:hidden}
.qbox.good{animation:good .45s}
.qbox.badq{animation:badq .4s}
@keyframes good{0%{box-shadow:0 0 0 0 rgba(46,229,157,.0)}40%{box-shadow:0 0 0 6px rgba(46,229,157,.7)}100%{box-shadow:0 0 0 0 rgba(46,229,157,0)}}
@keyframes badq{20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
.qlabel{font-weight:900;color:var(--muted);font-size:.85rem;letter-spacing:.06em;text-transform:uppercase}
.qtext{font-size:clamp(1.15rem,3.2vw,1.45rem);font-weight:800;max-width:36ch}
.big{font-family:var(--display);font-size:clamp(2.2rem,8vw,3.4rem);line-height:1.1;display:flex;align-items:center;justify-content:center;gap:.35em;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.big .op{color:var(--muted);font-size:.8em}
.fr{display:inline-flex;flex-direction:column;align-items:center;line-height:1;vertical-align:middle;font-variant-numeric:tabular-nums}
.fr .n{color:var(--nu)} .fr .d{color:var(--de)}
.fr .b{align-self:stretch;height:.08em;min-height:3px;background:var(--ink);border-radius:2px;margin:.08em 0}
.mixed{display:inline-flex;align-items:center;gap:.12em}
.unk{display:inline-grid;place-items:center;min-width:1.3em;padding:0 .15em;border:3px dashed var(--accent);border-radius:10px;color:var(--accent);line-height:1.1}
.box{display:inline-grid;place-items:center;width:1.4em;height:1.2em;border:3px dashed var(--muted);border-radius:12px;color:var(--muted);font-size:.8em}
.ansrow{display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap}
.ain{width:8.5rem;text-align:center;font-family:var(--display);font-size:2rem;padding:6px 10px;border-radius:14px;border:3px solid var(--line);background:var(--bg);color:var(--ink)}
.ain:focus{border-color:var(--accent);outline:none}
.fin{display:grid;justify-items:center;gap:4px}
.fin .ain{width:6.5rem;font-size:1.8rem;padding:4px 8px}
.fin .ain.n{border-color:var(--nu)} .fin .ain.d{border-color:var(--de)}
.fin .bar{width:7.5rem;height:5px;background:var(--ink);border-radius:3px}
.fin small{font-weight:900;font-size:.75rem}
.fin small.n{color:var(--nu)} .fin small.d{color:var(--de)}
.choices{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.choice{min-width:110px;border:3px solid var(--line);background:var(--panel2);border-radius:16px;padding:12px 18px;font-family:var(--display);font-size:1.6rem}
.choice:hover{border-color:var(--accent)}
.choice small{display:block;font-family:var(--body);font-weight:800;font-size:.75rem;color:var(--muted)}
.fb{width:100%;border-radius:14px;padding:12px 14px;font-weight:800;text-align:left;display:grid;gap:4px}
.fb.ok{background:color-mix(in srgb,var(--ok) 18%,transparent);border:2px solid var(--ok);color:var(--ok)}
.fb.bad{background:color-mix(in srgb,var(--bad) 15%,transparent);border:2px solid var(--bad);color:#ffc2cb}
.fb.hint{background:color-mix(in srgb,var(--accent) 12%,transparent);border:2px solid var(--accent);color:var(--ink)}
.fb .ans{font-family:var(--display);font-weight:400;font-size:1.3rem;color:var(--ink);display:flex;gap:.4em;align-items:center;flex-wrap:wrap}
.float{position:absolute;right:18px;top:14px;font-family:var(--display);font-size:1.4rem;color:var(--ok);pointer-events:none;animation:up .8s ease-out forwards}
@keyframes up{from{transform:translateY(0);opacity:1}to{transform:translateY(-40px);opacity:0}}

/* plano cartesiano e sinal */
.plane{width:100%;max-width:400px;height:auto;display:block;font-family:var(--body);touch-action:manipulation}
.plane .hit{fill:transparent;cursor:pointer}
@media (hover:hover){.plane .hit:hover{fill:rgba(255,207,63,.45)}}
.sgin{display:inline-flex;align-items:center;gap:6px}
.pm{border:2px solid var(--line);background:var(--panel2);border-radius:12px;width:44px;height:52px;font-family:var(--display);font-size:1.5rem;color:var(--ink)}
.pm:hover{border-color:var(--accent)}
.pairin{display:inline-flex;align-items:center;gap:6px;font-family:var(--display);font-size:2rem;flex-wrap:wrap;justify-content:center}
.ain.sm2{width:5.2rem;font-size:1.7rem}

/* termômetro */
.tmwrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,240px);gap:16px;align-items:start}
.tmwrap.solo{grid-template-columns:minmax(0,1fr)}
@media (max-width:640px){.tmwrap{grid-template-columns:minmax(0,1fr)}}
.tmside{display:grid;justify-items:center;background:linear-gradient(180deg,var(--panel),var(--bg2));border:2px solid var(--line);border-radius:22px;padding:10px}
.thermo{width:100%;max-width:230px;height:auto;display:block;touch-action:manipulation}
.thermo .merc{transition:y .35s ease,height .35s ease}
@media (prefers-reduced-motion:reduce){.thermo .merc{transition:none}}
.tmtxt{font-size:1.12rem;font-weight:700;line-height:1.5}
.tmtxt .tmlist,.tmtxt .tmtab{margin-top:10px}
.tmlist{margin:0;padding-left:20px;display:grid;gap:4px}
.tmtab{border-collapse:collapse;font-variant-numeric:tabular-nums;width:100%;max-width:520px}
.tmtab th,.tmtab td{border:2px solid var(--line);padding:6px 8px;text-align:center}
.tmtab th{background:var(--panel2);font-size:.9rem;color:var(--muted)}
.tmsel{display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-weight:800;font-size:1.1rem}
.tmsel b{font-family:var(--display);font-weight:400;font-size:1.5rem;color:var(--accent)}

/* arquiteto */
.arfigwrap{width:100%;display:grid;justify-items:center}
.arfig{width:100%;max-width:440px;height:auto;display:block;touch-action:manipulation}
.arfig .arline{cursor:pointer;animation:pulse 1s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.arpiece{animation:pop .5s cubic-bezier(.2,1.6,.4,1) both;transform-box:fill-box;transform-origin:center}
.tile{animation:tilein .25s ease-out both;transform-box:fill-box;transform-origin:center}
@keyframes tilein{from{transform:scale(0);opacity:0}to{transform:none;opacity:1}}
.halfg{animation:halfout .7s ease-in 1.8s forwards}
@keyframes halfout{to{opacity:0}}
.house{width:100%;max-width:230px;height:auto;display:block}
.hpop{animation:pop .6s cubic-bezier(.2,1.6,.4,1) both;transform-box:fill-box;transform-origin:50% 100%}
.helms{display:flex;gap:4px}
.helm{width:30px;height:24px}
.helm.off{opacity:.7}
.saw{font-weight:900;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-size:.85rem}
.arparts{display:grid;gap:6px;width:100%;max-width:380px;justify-items:stretch}
.arparts .prow{background:var(--panel2);border:2px solid var(--line);border-radius:12px;padding:6px 10px;display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:800}
.arparts .nin{display:flex;align-items:center;gap:6px;font-weight:900}
.opline{text-align:center;font-family:var(--display);font-size:1.5rem;color:var(--muted);line-height:1}
.confetti{animation:glow 1.6s ease-in-out infinite}
@keyframes glow{50%{filter:drop-shadow(0 0 14px rgba(255,207,63,.8))}}
@media (prefers-reduced-motion:reduce){.tile,.arpiece,.hpop,.arfig .arline,.confetti{animation:none}.halfg{animation:none;opacity:0}}

/* cofre */
.cfbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:8px 12px}
.vlt{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;font-family:var(--display);background:var(--bg);border:2px solid var(--line);color:var(--muted)}
.vlt.cur{border-color:var(--accent);color:var(--accent)}
.vlt.open{background:color-mix(in srgb,var(--accent) 25%,transparent);border-color:var(--accent)}
.vlt.half{border-color:var(--ok);color:var(--ok)}
.vlt.big{width:52px;height:52px;font-size:1.5rem}
.lck{font-size:1.2rem;opacity:.55}
.lck.cur{opacity:1;filter:drop-shadow(0 0 6px var(--accent))}
.lck.ok{opacity:1}
.lck.bad{opacity:1;filter:grayscale(1)}
.alm{width:16px;height:16px;border-radius:50%;background:var(--panel2);border:2px solid var(--line)}
.alm.on{background:var(--bad);border-color:#ffc2cb;box-shadow:0 0 10px var(--bad);animation:pulse .8s ease-in-out infinite}
.cfbal{width:100%;max-width:440px;height:auto;display:block;touch-action:manipulation}
.cfbal .wgt{cursor:pointer}
@media (hover:hover){.cfbal .wgt:hover rect:first-child{fill:#ffcf3f}}
.cfeq{font-family:var(--display);font-weight:400;font-size:1.3em;color:var(--accent)}
.cfstep{font-weight:800;text-align:center;max-width:44ch}
.cfchain{font-family:var(--display);font-size:1.4rem;color:var(--accent);text-align:center}
.mach{display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap}
.mval{min-width:3.2rem;padding:6px 10px;border-radius:12px;background:var(--bg);border:3px solid var(--line);font-family:var(--display);font-size:1.5rem;text-align:center}
.mval.win{border-color:var(--ok);color:var(--ok)}
.arw{color:var(--muted);font-weight:900}
.gear{width:76px;height:76px;border:0;background:none;padding:0;position:relative;display:grid;place-items:center}
.gear::before{content:"";position:absolute;inset:0;background:radial-gradient(circle,#9fabbf 0 52%,transparent 53%),conic-gradient(from 0deg,#9fabbf 0 10%,transparent 0 15%,#9fabbf 0 25%,transparent 0 30%,#9fabbf 0 40%,transparent 0 45%,#9fabbf 0 55%,transparent 0 60%,#9fabbf 0 70%,transparent 0 75%,#9fabbf 0 85%,transparent 0 90%,#9fabbf 0 100%);border-radius:50%;-webkit-mask:radial-gradient(circle,#000 0 66%,transparent 67%);mask:radial-gradient(circle,#000 0 66%,transparent 67%);transition:transform .5s}
.gear span{position:relative;font-family:var(--display);font-size:1.35rem;color:#0e1a2c}
.gear:not(:disabled):hover::before{filter:brightness(1.15)}
.gear.sel::before{background:radial-gradient(circle,#ffcf3f 0 52%,transparent 53%),conic-gradient(from 0deg,#ffcf3f 0 10%,transparent 0 15%,#ffcf3f 0 25%,transparent 0 30%,#ffcf3f 0 40%,transparent 0 45%,#ffcf3f 0 55%,transparent 0 60%,#ffcf3f 0 70%,transparent 0 75%,#ffcf3f 0 85%,transparent 0 90%,#ffcf3f 0 100%);transform:rotate(-30deg)}
.gear.dn::before{background:radial-gradient(circle,#2ee59d 0 52%,transparent 53%),conic-gradient(from 0deg,#2ee59d 0 10%,transparent 0 15%,#2ee59d 0 25%,transparent 0 30%,#2ee59d 0 40%,transparent 0 45%,#2ee59d 0 55%,transparent 0 60%,#2ee59d 0 70%,transparent 0 75%,#2ee59d 0 85%,transparent 0 90%,#2ee59d 0 100%);transform:rotate(-120deg);opacity:.6}
.gear:disabled{cursor:default}

/* fim de rodada */
.end{display:grid;gap:14px;justify-items:center;text-align:center}
.end .score{font-family:var(--display);font-size:clamp(3rem,12vw,4.6rem);line-height:1;color:var(--accent);font-variant-numeric:tabular-nums}
.end .stars3{font-size:2.6rem;letter-spacing:6px}
.end .stars3 span{display:inline-block;color:var(--line)}
.end .stars3 span.on{color:var(--accent);animation:starpop .45s cubic-bezier(.2,1.6,.4,1) both}
@keyframes starpop{from{transform:scale(0) rotate(-90deg)}to{transform:none}}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;width:100%;max-width:520px}
.stat{background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:10px;display:grid;gap:2px}
.stat b{font-family:var(--display);font-weight:400;font-size:1.5rem;font-variant-numeric:tabular-nums}
.stat span{font-size:.78rem;font-weight:900;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.code{font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;font-size:1.5rem;font-weight:800;letter-spacing:.08em;background:var(--bg);border:2px dashed var(--accent);border-radius:12px;padding:10px 16px;user-select:all;word-break:break-all}
.newrec{background:var(--accent);color:var(--accent-ink);font-weight:900;border-radius:8px;padding:2px 10px;font-size:.85rem}

/* monstros */

  }catch(e){}
}

/* Código de salvamento: moedas(16) xp(20) pity(6) ovos(10) coleção(40) estrelas(42) + verificação(15) */
const CIDS=['IN','FR','DC','PC','AL','MM','PL'];
const RUNKEYS=[...CIDS.map(c=>'C:'+c),'SIM','G1','G2','G3','G4','G5','G6'];
function dayStamp(){ const d=new Date(); return Math.floor(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/864e5)%512; }
function packSave(){
  let n=0n; const put=(v,bits)=>{ v=Math.max(0,Math.min(v,2**bits-1)); n=(n<<BigInt(bits))|BigInt(v); };
  put(S.coins,14); put(S.xp,18); put(S.pity,6); put(S.hatched,9);
  let col=0n; S.got.forEach(k=>{ col|=1n<<BigInt(k-1); }); n=(n<<40n)|col;
  CIDS.forEach(c=>{ for(let l=1;l<=3;l++) put(S.stars[c+l]||0,2); });
  put(S.simBest==null?15:S.simBest,4);
  const body=toB32(n,27);
  const chk=fnv(normName(S.apelido)+'|'+body)%1024;
  return (body+toB32(chk,2)).match(/.{1,5}/g).join('-');
}
function unpackSave(apelido,code){
  const c=normCode(code); if(c.length!==29) return null;
  const body=c.slice(0,27), chk=fromB32(c.slice(27));
  if(chk===null||Number(chk)!==fnv(normName(apelido)+'|'+body)%1024) return null;
  let n=fromB32(body); if(n===null) return null;
  const take=bits=>{ const v=Number(n&((1n<<BigInt(bits))-1n)); n>>=BigInt(bits); return v; };
  const sb=take(4);
  const st={}; for(let i=CIDS.length-1;i>=0;i--) for(let l=3;l>=1;l--) st[CIDS[i]+l]=take(2);
  const col=n&((1n<<40n)-1n); n>>=40n;
  const got=[]; for(let k=1;k<=40;k++) if((col>>BigInt(k-1))&1n) got.push(k);
  const hatched=take(9), pity=take(6), xp=take(18), coins=take(14);
  return {coins,xp,pity,hatched,got,stars:st,simBest:sb===15?null:sb};
}
function confCode(cid,l,pts){ return `${cid}${l}-${pts}-${toB32(fnv(normName(S.apelido)+'|R|'+cid+l+'|'+pts)%32768,3)}`; }
function checkConf(apelido,code){
  const m=String(code||'').toUpperCase().replace(/\s/g,'').match(/^([A-Z]{2})([1-3])-(\d+)-([0-9A-Z]{3})$/);
  if(!m||!CIDS.includes(m[1])) return null;
  const ok=toB32(fnv(normName(apelido)+'|R|'+m[1]+m[2]+'|'+m[3])%32768,3)===normCode(m[4]);
  return {ok,cid:m[1],l:+m[2],pts:+m[3]};
}

function today(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function day(){ const t=today(); if(!S.day||S.day.date!==t||S.day.who!==S.apelido){ S.day={date:t,who:S.apelido,runs:{}}; S.day.ms=pickMissions(t); save(); } return S.day; }
function runsToday(key){ return (day().runs[key]||0); }

function earn(base,mult){ S.coinFrac=(S.coinFrac||0)+base*mult; const w=Math.floor(S.coinFrac+1e-9); S.coinFrac-=w; if(w>0) gain(w); else save(); return w; }
const MPOOL=[
 {id:'treino', n:10, ev:'treinoOk'},
 {id:'sim', n:1, ev:'simDone', t:'Faça 1 simulado completo'},
 {id:'retry', n:3, ev:'retryOk', t:'No Treino, acerte 3 contas de revisão (as que voltam depois de um erro)'},
 {id:'star', n:1, ev:'starNew', t:'Ganhe 1 estrela nova no Relâmpago'},
 {id:'rel', n:3, ev:'relDone', t:'Jogue 3 rodadas de Relâmpago'},
 {id:'combo', n:1, ev:'combo5', t:'Faça um combo de 5 acertos seguidos no Relâmpago'},
 {id:'sim5', n:1, ev:'sim5', t:'Acerte 5 questões ou mais em um simulado'},
 {id:'game', n:2, ev:'gameDone', t:'Jogue 2 turnos de qualquer game'}
];
function pickMissions(t){
  let seed=fnv(t+'|'+normName(S.apelido)); const rnd=()=>{ seed=(Math.imul(seed,1664525)+1013904223)>>>0; return seed/4294967296; };
  const allStars=CIDS.every(c=>[1,2,3].every(l=>(S.stars[c+l]||0)===3));
  let pool=MPOOL.filter(m=>!(m.id==='star'&&allStars));
  const out=[{...MPOOL[0]}];
  pool=pool.filter(m=>m.id!=='treino');
  while(out.length<3){ const m=pool.splice(Math.floor(rnd()*pool.length),1)[0]; out.push({...m}); }
  // treino: conteúdo com menos estrelas (empate decidido pelo sorteio do dia)
  const score=c=>[1,2,3].reduce((a,l)=>a+(S.stars[c+l]||0),0)+rnd()*.9;
  const cid=[...CIDS].sort((a,b)=>score(a)-score(b))[0];
  out[0].cid=cid; out[0].t=`Acerte 10 contas no Treino de ${ctById(cid).nome}`;
  return out.map(m=>({id:m.id,ev:m.ev,n:m.n,t:m.t,cid:m.cid||null,p:0,done:false}));
}
function mission(ev,cid){
  const d=day(); let changed=false;
  d.ms.forEach(m=>{ if(m.done||m.ev!==ev||(m.cid&&m.cid!==cid)) return; m.p++; changed=true;
    if(m.p>=m.n){ m.done=true; gain(20); toast('Missão cumprida! +20 moedas'); sfx.combo(); } });
  if(changed) save();
}
function missionsHTML(){
  const d=day();
  if(d.locked) return `<div class="missions"><h3>Missões do dia</h3><p class="muted" style="font-weight:700">Você entrou com código de salvamento hoje, então as missões de hoje ficaram encerradas. Amanhã aparecem 3 missões novas!</p></div>`;
  return `<div class="missions"><div class="row" style="justify-content:space-between"><h3>Missões do dia</h3><span class="muted" style="font-weight:800;font-size:.85rem">+20 moedas cada</span></div>
    ${d.ms.map(m=>`<div class="ms ${m.done?'done':''}"><span class="ck">${m.done?'✓':''}</span><span class="mt">${m.t}</span><span class="mp">${Math.min(m.p,m.n)}/${m.n}</span></div>`).join('')}</div>`;
}

const sg=n=>n<0?'−'+(-n):String(n);              // número com sinal de menos tipográfico
const pr=n=>n<0?`(${sg(n)})`:String(n);          // negativo entre parênteses
const nz=(a,b)=>{ let x; do{ x=rint(a,b); }while(x===0); return x; };
const SUP={2:'²',3:'³',4:'⁴',5:'⁵'};
const shuf=a=>{ a=[...a]; for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const SIGN_TIP='Sinais iguais: resultado positivo. Sinais diferentes: resultado negativo.';
// monta expressão a partir de termos [coef, letra]: [[3,'x'],[-2,'']] -> "3x − 2"
function poly(terms){
  return terms.map(([c,v],i)=>{
    const a=Math.abs(c), body= v? (a===1?v:a+v) : String(a);
    if(i===0) return (c<0?'−':'')+body;
    return (c<0?' − ':' + ')+body;
  }).join('');
}

// --- Números inteiros
function genIN(l){
  if(l===1){
    const op=Math.random()<.5?'+':'−';
    let A=nz(-20,20), B=nz(-20,20);
    if(A>0&&B>0){ if(Math.random()<.5) A=-A; else B=-B; }
    const ans= op==='+'?A+B:A-B;
    const subNeg= op==='−'&&B<0;
    const hint= subNeg? `Subtrair um negativo é somar o oposto: ${sg(A)} − (${sg(B)}) = ${sg(A)} + ${-B}.`
      : 'Pense num saldo: positivo é ganhar, negativo é perder. Somar um negativo é o mesmo que tirar.';
    return {kind:'int', neg:true, label:'Calcule', html:`<div class="big">${sg(A)}<span class="op">${op}</span>${pr(B)}<span class="op">=</span><span class="box">?</span></div>`,
      ans, show:sg(ans), hint,
      wrong:v=>{ if(subNeg&&v===A+B) return `Menos com menos: subtrair um negativo vira soma. ${sg(A)} − (${sg(B)}) = ${sg(A)} + ${-B}.`;
        if(v===-ans&&ans!==0) return 'O valor está certo, mas o sinal não. O resultado fica com o sinal do número que "pesa mais" (maior valor absoluto).';
        return null; }};
  }
  if(l===2){
    const op=Math.random()<.5?'×':'÷';
    let a=nz(-12,12), b=nz(-12,12);
    while(Math.abs(a)===1) a=nz(-12,12); while(Math.abs(b)===1) b=nz(-12,12);
    if(a>0&&b>0){ if(Math.random()<.5) a=-a; else b=-b; }
    const A= op==='×'?a:a*b, B=b, ans= op==='×'?a*b:a;
    return {kind:'int', neg:true, label:'Calcule', html:`<div class="big">${sg(A)}<span class="op">${op}</span>${pr(B)}<span class="op">=</span><span class="box">?</span></div>`,
      ans, show:sg(ans), hint:`${SIGN_TIP} ${op==='×'?'Multiplique':'Divida'} os números sem o sinal e depois aplique a regra.`,
      wrong:v=>{ if(v===-ans) return 'O número está certo, o sinal não. '+SIGN_TIP; return null; }};
  }
  if(Math.random()<.12){ // pegadinha clássica: −3² é diferente de (−3)²
    const b=rint(2,5), e= b===2? rint(2,4) : 2, ans=-(b**e);
    return {kind:'int', neg:true, label:'Calcule a potência', html:`<div class="big">−${b}${SUP[e]}<span class="op">=</span><span class="box">?</span></div>`,
      ans, show:sg(ans), hint:`Sem parênteses, o expoente vale só para o ${b}: −${b}${SUP[e]} = −(${Array(e).fill(b).join(' × ')}). É diferente de (−${b})${SUP[e]}.`,
      wrong:v=>{ if(v===-ans) return `Sem parênteses, o sinal de menos fica de fora da potência: −${b}${SUP[e]} = −${b**e}. Só (−${b})${SUP[e]} daria ${(-b)**e}.`; return null; }};
  }
  if(Math.random()<.45){
    let b=nz(-5,5); while(Math.abs(b)===1) b=nz(-5,5);
    const ab=Math.abs(b), e= ab===2? rint(2,5) : ab===3? rint(2,3) : 2;
    if(b>0&&Math.random()<.7) b=-b;
    const ans=b**e, prod=Array(e).fill(pr(b)).join(' × ');
    return {kind:'int', neg:true, label:'Calcule a potência', html:`<div class="big">${pr(b)}${SUP[e]}<span class="op">=</span><span class="box">?</span></div>`,
      ans, show:sg(ans), hint:`${pr(b)}${SUP[e]} = ${prod}. Expoente par deixa o resultado positivo; expoente ímpar mantém o sinal negativo.`,
      wrong:v=>{ if(v===-ans) return 'Confira o sinal: '+(e%2===0?'expoente par deixa o resultado positivo.':'expoente ímpar mantém o sinal negativo.');
        if(v===b*e) return `Potência não é base × expoente: ${pr(b)}${SUP[e]} = ${prod}.`; return null; }};
  }
  const t=pick(['a+bc','a-bc','(a+b)c','ab+c']);
  let a,b,c,ans,lr,html;
  do{
    a=nz(-9,9); b=nz(-9,9); c=nz(-9,9);
    if(a>0&&b>0&&c>0){ const k=rint(0,2); if(k===0)a=-a; else if(k===1)b=-b; else c=-c; }
    if(t==='a+bc'){ ans=a+b*c; lr=(a+b)*c; html=`${sg(a)}<span class="op">+</span>${pr(b)}<span class="op">×</span>${pr(c)}`; }
    if(t==='a-bc'){ ans=a-b*c; lr=(a-b)*c; html=`${sg(a)}<span class="op">−</span>${pr(b)}<span class="op">×</span>${pr(c)}`; }
    if(t==='(a+b)c'){ ans=(a+b)*c; lr=null; html=`(${sg(a)}<span class="op">+</span>${pr(b)})<span class="op">×</span>${pr(c)}`; }
    if(t==='ab+c'){ ans=a*b+c; lr=a*(b+c); html=`${sg(a)}<span class="op">×</span>${pr(b)}<span class="op">+</span>${pr(c)}`; }
  }while(t==='(a+b)c'&&a+b===0);
  return {kind:'int', neg:true, label:'Resolva a expressão', html:`<div class="big" style="font-size:clamp(1.8rem,6.5vw,2.8rem)">${html}<span class="op">=</span><span class="box">?</span></div>`,
    ans, show:sg(ans), hint:'Ordem: primeiro o que está entre parênteses, depois multiplicação, depois soma e subtração. Cuidado com os sinais.',
    wrong:v=>{ if(lr!==null&&v===lr&&lr!==ans) return 'Você resolveu da esquerda para a direita. A multiplicação vem antes da soma e da subtração.';
      if(v===-ans) return 'Quase! Confira o sinal. '+SIGN_TIP; return null; }};
}

// --- Frações
function genFR(l){
  let a,b,c,d,op,N,D,html,hint,wrong;
  if(l===1){
    op=Math.random()<.5?'+':'−'; d=rint(3,12); a=rint(1,d-1); c=rint(1,d-1);
    if(op==='−'){ if(a<c)[a,c]=[c,a]; if(a===c) op='+'; }
    N= op==='+'?a+c:a-c; D=d; html=`${fr(a,d)}<span class="op">${op}</span>${fr(c,d)}`;
    hint='Denominadores iguais: conserve o denominador e opere só os numeradores.';
    wrong=v=>v.d===2*D?'Você somou os denominadores. Com denominadores iguais, ele se conserva.':null;
    return {kind:'frac', label:'Calcule (pode deixar sem simplificar)', html:`<div class="big">${html}<span class="op">=</span><span class="box">?</span></div>`,
      ans:{n:N,d:D}, show:frNice(N,D), hint, check:v=>v.d>0&&v.n*D===N*v.d, wrong};
  }
  if(l===2){
    const ds=[2,3,4,5,6,8,9,10,12]; op=Math.random()<.5?'+':'−';
    b=pick(ds); do{ d=pick(ds); }while(d===b);
    a=rint(1,b-1); c=rint(1,d-1);
    if(op==='−'&&a*d<=c*b){ [a,b,c,d]=[c,d,a,b]; if(a*d===c*b) op='+'; }
    N= op==='+'?a*d+c*b:a*d-c*b; D=b*d; html=`${fr(a,b)}<span class="op">${op}</span>${fr(c,d)}`;
    hint=`Transforme as frações em equivalentes com o mesmo denominador (um múltiplo comum de ${b} e ${d}, como ${lcm(b,d)}) e depois opere os numeradores.`;
    wrong=v=>{ if(op==='+'&&v.n===a+c&&v.d===b+d) return 'Não se soma numerador com numerador e denominador com denominador. Iguale os denominadores primeiro.';
      if(op==='−'&&v.n===a-c&&v.d===b-d) return 'Não se subtrai denominador com denominador. Iguale os denominadores primeiro.'; return null; };
    return {kind:'frac', label:'Calcule (pode deixar sem simplificar)', html:`<div class="big">${html}<span class="op">=</span><span class="box">?</span></div>`,
      ans:{n:N,d:D}, show:frNice(N,D), hint, check:v=>v.d>0&&v.n*D===N*v.d, wrong};
  }
  op=Math.random()<.5?'×':'÷';
  b=rint(2,9); a=rint(1,b-1); d=rint(2,9); c=rint(1,d-1);
  if(op==='×'){ N=a*c; D=b*d; hint='Na multiplicação, multiplique numerador com numerador e denominador com denominador.';
    wrong=v=>(v.d>0&&v.n*(b*c)===(a*d)*v.d&&a*d*D!==N*b*c)?'Você inverteu a segunda fração. Inverter é só na divisão.':null; }
  else { N=a*d; D=b*c; hint=`Na divisão, conserve a primeira fração e multiplique pelo inverso da segunda: ${fr(a,b)} × ${fr(d,c)}.`;
    wrong=v=>(v.d>0&&v.n*(b*d)===(a*c)*v.d&&a*c*D!==N*b*d)?'Você multiplicou direto. Na divisão, multiplique pelo inverso da segunda fração.':null; }
  return {kind:'frac', label:'Calcule (pode deixar sem simplificar)', html:`<div class="big">${fr(a,b)}<span class="op">${op}</span>${fr(c,d)}<span class="op">=</span><span class="box">?</span></div>`,
    ans:{n:N,d:D}, show:frNice(N,D), hint, check:v=>v.d>0&&v.n*D===N*v.d, wrong};
}

// --- Decimais (trabalha com inteiros por dentro para não errar arredondamento)
function genDC(l){
  let A,B,op,ans,tip,html=null,label='Calcule';
  const d2=x=>x/100;
  if(l===1){
    op=Math.random()<.5?'+':'−';
    let x=rint(5,9999), y=rint(5,9999);
    if(Math.random()<.5) x=Math.round(x/10)*10;
    if(op==='−'&&y>x) [x,y]=[y,x]; if(op==='−'&&x===y) x+=7;
    A=d2(x); B=d2(y); ans= op==='+'?d2(x+y):d2(x-y);
    tip='Arme a conta com vírgula embaixo de vírgula. Complete com zeros se precisar.';
  } else if(l===2){
    const t=pick(['p10','nat','dd']);
    if(t==='p10'){ const p=pick([10,100,1000]); const x=rint(11,9999); A=d2(x); B=p; op='×'; ans=x*p/100; tip=`Multiplicar por ${p} desloca a vírgula ${String(p).length-1} casa(s) para a direita.`; }
    if(t==='nat'){ const x=rint(11,999), n=rint(2,9); A=x/10; B=n; op='×'; ans=x*n/10; tip='Multiplique como se não houvesse vírgula e depois coloque a mesma quantidade de casas decimais.'; }
    if(t==='dd'){ const x=rint(11,99), y=rint(11,59); A=x/10; B=y/10; op='×'; ans=x*y/100; tip='Multiplique sem as vírgulas. O resultado tem tantas casas decimais quanto os dois fatores juntos.'; }
  } else {
    const t=pick(['divnat','natdiv','arr']);
    if(t==='divnat'){ const n=rint(2,9), q=rint(11,999); A=q*n/100; B=n; op='÷'; ans=q/100; tip='Divida normalmente e coloque a vírgula no resultado quando "descer" a vírgula do dividendo.'; }
    if(t==='natdiv'){ const n=pick([2,4,5,8]); let m=rint(3,60); while(m%n===0) m++; A=m; B=n; op='÷'; ans=m/n; tip='Quando a divisão não é exata, coloque vírgula no quociente e acrescente um zero no resto para continuar dividindo.'; }
    if(t==='arr'){
      let X; do{ X=rint(1001,99999); }while(X%10===0);
      const k=pick(['inteiro','décimos','centésimos']);
      let q,r; if(k==='inteiro'){ q=Math.floor(X/1000); r=X%1000>=500; ans=q+(r?1:0); }
      if(k==='décimos'){ q=Math.floor(X/100); r=X%100>=50; ans=(q+(r?1:0))/10; }
      if(k==='centésimos'){ q=Math.floor(X/10); r=X%10>=5; ans=(q+(r?1:0))/100; }
      const trunc= k==='inteiro'?q: k==='décimos'?q/10:q/100;
      const lab= k==='inteiro'?'o inteiro mais próximo':'os '+k;
      label='Arredondamento';
      html=`<p class="qtext">Arredonde para ${lab}:</p><div class="big">${fmt(X/1000)}<span class="op">≈</span><span class="box">?</span></div>`;
      tip='Olhe o algarismo logo depois da casa pedida: se for 5 ou mais, aumente 1; se for menos que 5, mantenha.';
      return {kind:'dec', label, html, ans, show:fmt(ans), hint:tip,
        wrong:v=>{ if(r&&Math.abs(v-trunc)<1e-9) return 'O algarismo seguinte é 5 ou mais, então arredonde para cima.'; if(!r&&Math.abs(v-trunc-(k==='inteiro'?1:k==='décimos'?.1:.01))<1e-9) return 'O algarismo seguinte é menor que 5, então mantenha.'; return null; }};
    }
  }
  return {kind:'dec', label, html:`<div class="big">${fmt(A)}<span class="op">${op}</span>${fmt(B)}<span class="op">=</span><span class="box">?</span></div>`,
    ans, show:fmt(ans), hint:tip,
    wrong:v=>{ for(const f of [10,100,1000]) if(Math.abs(v*f-ans)<1e-6||Math.abs(v/f-ans)<1e-6) return 'Os algarismos estão certos! Confira a posição da vírgula.'; return null; }};
}

// --- Porcentagem
function genPC(l){
  if(l<3){
    let p,T;
    if(l===1){ p=pick([10,25,50]); T= p===10? rint(2,90)*10 : p===25? rint(2,60)*4 : rint(2,99)*2; }
    else { p=pick([5,15,20,30,40,60,75,80,12,35,1]); const step=100/gcd(p,100); T=step*rint(1,Math.floor(1000/step)); while(T<20) T+=step; }
    const ans=T*p/100;
    const tip={10:`10% é a décima parte: ${T} ÷ 10.`,50:`50% é a metade: ${T} ÷ 2.`,25:`25% é a quarta parte: ${T} ÷ 4.`}[p]
      || `${p}% = ${p}/100. Ache 1% (${T} ÷ 100 = ${fmt(T/100)}) e multiplique por ${p}. Ou use 10%: ${fmt(T/10)}.`;
    return {kind:'int', label:'Calcule', html:`<div class="big">${p}%<span class="op">de</span>${T}<span class="op">=</span><span class="box">?</span></div>`, ans, show:String(ans), hint:tip,
      wrong:v=>{ if(v===T-ans) return `Esse é o que sobra (${100-p}%). A pergunta é quanto vale ${p}%.`; return null; }};
  }
  const desc=Math.random()<.6, p=pick([5,10,15,20,25,30,40,50]);
  const step=100/gcd(p,100); let P=step*rint(1,Math.floor(600/step)); while(P<20) P+=step;
  const part=P*p/100, ans= desc?P-part:P+part;
  const ctx= desc? pick([`Um tênis de R$ ${P} está com ${p}% de desconto. Qual é o novo preço?`,`Uma mochila custava R$ ${P} e teve ${p}% de desconto. Quanto vai custar?`,`Um jogo de R$ ${P} entrou em promoção com ${p}% de desconto. Qual é o preço com desconto?`,`Uma bicicleta de R$ ${P} será paga à vista com ${p}% de desconto. Quanto será pago?`])
                   : pick([`A conta de luz de R$ ${P} teve aumento de ${p}%. Qual é o novo valor?`,`Um ingresso de R$ ${P} ficou ${p}% mais caro. Quanto custa agora?`,`O lanche custava R$ ${P} e subiu ${p}%. Qual é o novo preço?`,`Uma compra de R$ ${P} parcelada tem ${p}% de acréscimo. Qual é o valor total?`]);
  return {kind:'int', label:desc?'Desconto':'Acréscimo', html:`<p class="qtext">${ctx}</p>`, ans, show:'R$ '+ans,
    hint:`Calcule ${p}% de ${P} e depois ${desc?'subtraia do':'some ao'} preço.`,
    wrong:v=>{ if(v===part) return `Esse é o valor do ${desc?'desconto':'aumento'}. Agora ${desc?'subtraia do':'some ao'} preço.`; if(v===(desc?P+part:P-part)) return desc?'Desconto diminui o preço: subtraia.':'Acréscimo aumenta o preço: some.'; return null; }};
}

// --- Equações e álgebra
function genAL(l){
  if(l===1){
    const a=rint(2,9), x= Math.random()<.7? rint(1,12) : -rint(1,10), b=nz(-20,20), c=a*x+b;
    return {kind:'int', neg:true, label:'Resolva a equação', html:`<div class="big">${a}x<span class="op">${b<0?'−':'+'}</span>${Math.abs(b)}<span class="op">=</span>${sg(c)}</div><p class="qtext">x = ?</p>`,
      ans:x, show:'x = '+sg(x), hint:`Isole o x. Passe o ${Math.abs(b)} para o outro lado com a operação inversa: ${a}x = ${sg(c)} ${b<0?'+':'−'} ${Math.abs(b)} = ${sg(c-b)}. Depois divida por ${a}.`,
      wrong:v=>{ if(v===(c+b)/a&&b!==0) return `Ao passar o ${Math.abs(b)} para o outro lado, a operação se inverte: ${b<0?'o − vira +':'o + vira −'}.`;
        if(v===c-b) return `Você achou ${a}x = ${sg(c-b)}. Falta dividir por ${a}.`;
        if(v===-x) return 'Confira o sinal na hora de dividir. '+SIGN_TIP; return null; }};
  }
  if(l===2){
    const hasY=Math.random()<.2;
    let X=nz(-5,5); if(X>0&&Math.random()<.6) X=-X;
    let terms, f;
    if(!hasY){
      const t=pick(['ax+b','ax2','ax2+bx','x2+b','a(x+b)']);
      if(t==='ax+b'){ let a=nz(-6,6); if(Math.abs(a)===1) a*=2; const b=nz(-12,12); terms=[[a,'x'],[b,'']]; f=s=>a*X+b; }
      if(t==='ax2'){ const a=nz(-4,5); terms=[[a,'x²']]; f=s=>a*s*X*X; }
      if(t==='ax2+bx'){ const a=pick([1,2,3,-1,-2]), b=nz(-6,6); terms=[[a,'x²'],[b,'x']]; f=s=>a*s*X*X+b*X; }
      if(t==='x2+b'){ const b=nz(-12,12); terms=[[1,'x²'],[b,'']]; f=s=>s*X*X+b; }
      if(t==='a(x+b)'){ const a=pick([2,3,4,5,-2,-3]), b=nz(-9,9);
        const expr=`${a<0?'−'+(-a):a}(x ${b<0?'−':'+'} ${Math.abs(b)})`;
        const ans=a*(X+b);
        return {kind:'int', neg:true, label:'Valor numérico', html:`<p class="qtext">Calcule o valor de</p><div class="big">${expr}</div><p class="qtext">para x = ${sg(X)}</p>`,
          ans, show:sg(ans), hint:`Troque x por ${pr(X)}: ${sg(a)} × (${sg(X)} ${b<0?'−':'+'} ${Math.abs(b)}). Resolva primeiro o parêntese.`,
          wrong:v=>{ if(v===a*X+b) return `O ${sg(a)} multiplica todo o parêntese, não só o x.`; if(v===-ans) return 'Confira o sinal. '+SIGN_TIP; return null; }};
      }
    } else {
      let Y=nz(-6,6);
      if(Math.random()<.6){ const a=nz(-6,6), b=nz(-6,6); terms=[[a,'x'],[b,'y']]; f=s=>a*X+b*Y; }
      else { const c=nz(-12,12); terms=[[1,'xy'],[c,'']]; f=s=>X*Y+c; }
      const ans=f(1);
      return {kind:'int', neg:true, label:'Valor numérico', html:`<p class="qtext">Calcule o valor de</p><div class="big">${poly(terms)}</div><p class="qtext">para x = ${sg(X)} e y = ${sg(Y)}</p>`,
        ans, show:sg(ans), hint:`Troque cada letra pelo número entre parênteses: x = ${pr(X)} e y = ${pr(Y)}. Faça as multiplicações primeiro.`,
        wrong:v=>{ if(v===-ans) return 'Confira os sinais. '+SIGN_TIP; return null; }};
    }
    const ans=f(1), sq=terms.some(t=>t[1]==='x²');
    return {kind:'int', neg:true, label:'Valor numérico', html:`<p class="qtext">Calcule o valor de</p><div class="big">${poly(terms)}</div><p class="qtext">para x = ${sg(X)}</p>`,
      ans, show:sg(ans), hint:`Troque x por ${pr(X)}.${sq?` Lembre: ${pr(X)}² = ${pr(X)} × ${pr(X)} = ${X*X}.`:''} Depois resolva na ordem: potência, multiplicação, soma e subtração.`,
      wrong:v=>{ if(sq&&X<0&&v===f(-1)&&v!==ans) return `${pr(X)}² = +${X*X}: o quadrado de um número negativo é positivo.`; if(v===-ans) return 'Confira os sinais. '+SIGN_TIP; return null; }};
  }
  // sequências algébricas
  const ex=(a,b)=>poly(b===0?[[a,'n']]:[[a,'n'],[b,'']]);
  if(Math.random()<.5){
    let a,b; do{ a=rint(2,9); b=rint(-5,9); }while(b===0||a+b<1);
    const right=ex(a,b);
    const cand=[ex(a,a+b), ex(1,a), ex(a,b+1), ex(a,b-1), ex(a+1,b-1), ex(b>0?b:a+1,a)];
    const opts=[right]; for(const c of cand) if(!opts.includes(c)&&opts.length<4) opts.push(c);
    const terms=[1,2,3,4].map(n=>a*n+b);
    const tip=`A sequência cresce de ${a} em ${a}, então a expressão tem ${a}n. Teste n = 1: ${a} × 1 ${b<0?'−':'+'} ${Math.abs(b)} = ${a+b}, que é o 1º termo.`;
    return {kind:'choice', label:'Sequência algébrica', html:`<p class="qtext">Qual expressão gera esta sequência? (n é a posição do termo)</p><div class="big" style="font-size:clamp(1.8rem,6.5vw,2.8rem)">${terms.join('<span class="op">,</span>')}<span class="op">, …</span></div>`,
      ans:right, opts:shuf(opts).map(o=>[o,'']), show:right, hint:tip, wrong:()=>tip};
  }
  let a=rint(2,9), b=nz(-9,9); const p=rint(6,25);
  const ans=a*p+b;
  return {kind:'int', label:'Sequência algébrica', html:`<p class="qtext">Os termos de uma sequência são dados por</p><div class="big">${ex(a,b)}</div><p class="qtext">em que n é a posição. Qual é o <b>${p}º termo</b>?</p>`,
    ans, show:String(ans), hint:`Troque n por ${p}: ${a} × ${p} ${b<0?'−':'+'} ${Math.abs(b)}.`,
    wrong:v=>{ if(v===a*p) return `Faltou ${b<0?'subtrair':'somar'} o ${Math.abs(b)}.`; if(v===a+p+b) return `${a}n quer dizer ${a} × n, não ${a} + n.`; return null; }};
}

// --- MMC e MDC
const DIVN=[12,18,20,24,28,30,32,36,40,42,45,48,54,56,60,63,64,72,75,80,84,90,96,100];
const divsOf=n=>{ const r=[]; for(let i=1;i<=n;i++) if(n%i===0) r.push(i); return r; };
function genMM(l){
  if(l===1){
    const t=pick(['mult','div','count']);
    if(t==='mult'){
      const k=rint(3,12), right=k*rint(3,12);
      const pool=[]; for(let v=right-k+1;v<=right+k-1;v++) if(v>1&&v%k!==0) pool.push(v);
      const opts=shuf([right,...shuf(pool).slice(0,3)]).map(String);
      const tip=`Múltiplos de ${k} estão na tabuada do ${k}: ${k} × ${right/k} = ${right}. Os outros deixam resto na divisão por ${k}.`;
      return {kind:'choice', label:'Múltiplos', html:`<p class="big" style="font-size:clamp(1.5rem,5.5vw,2.2rem)">Qual destes números é múltiplo de ${k}?</p>`,
        ans:String(right), opts:opts.map(o=>[o,'']), show:String(right), hint:`Procure o número que está na tabuada do ${k}.`, wrong:()=>tip};
    }
    if(t==='div'){
      const N=pick(DIVN), ds=divsOf(N).filter(x=>x>1&&x<N), right=pick(ds);
      const pool=[]; for(let v=2;v<N&&v<=30;v++) if(N%v!==0) pool.push(v);
      const opts=shuf([right,...shuf(pool).slice(0,3)]).map(String);
      const tip=`${N} ÷ ${right} = ${N/right}, sem resto. Divisores de ${N}: ${divsOf(N).join(', ')}.`;
      return {kind:'choice', label:'Divisores', html:`<p class="big" style="font-size:clamp(1.5rem,5.5vw,2.2rem)">Qual destes números é divisor de ${N}?</p>`,
        ans:String(right), opts:opts.map(o=>[o,'']), show:String(right), hint:`Divisor é quem divide ${N} sem deixar resto.`, wrong:()=>tip};
    }
    const N=pick([6,8,10,12,14,15,16,18,20,21,24,28,30,32,36,40]), ds=divsOf(N);
    return {kind:'int', label:'Divisores', html:`<p class="big" style="font-size:clamp(1.5rem,5.5vw,2.2rem)">Quantos divisores tem o número ${N}?</p>`,
      ans:ds.length, show:`${ds.length} (${ds.join(', ')})`, hint:`Procure os pares que multiplicados dão ${N}: 1 × ${N}, 2 × …`,
      wrong:v=>{ if(v===ds.length-2) return `Não esqueça do 1 e do próprio ${N}: eles também são divisores.`; if(v===ds.length-1) return 'Faltou um. Lembre que 1 e o próprio número também contam.'; return null; }};
  }
  const pairL=()=>{ let a,b; do{ a=rint(2,20); b=rint(2,20); }while(a===b||lcm(a,b)>120||lcm(a,b)===Math.max(a,b)&&Math.random()<.7); return [a,b]; };
  const pairG=(mx)=>{ let g,m,n; do{ g=rint(2,12); m=rint(1,9); n=rint(1,9); }while(m===n||gcd(m,n)!==1||g*Math.max(m,n)>mx||Math.min(m,n)===1&&Math.random()<.6); return [g*m,g*n,g]; };
  if(l===2){
    if(Math.random()<.5){
      const [a,b]=pairL(), L=lcm(a,b), G=gcd(a,b);
      return {kind:'int', label:'MMC', html:`<div class="big">MMC(${a}, ${b})<span class="op">=</span><span class="box">?</span></div>`,
        ans:L, show:String(L), hint:`Liste os múltiplos de ${Math.max(a,b)} (${Math.max(a,b)}, ${2*Math.max(a,b)}, ${3*Math.max(a,b)}…) até achar um que também seja múltiplo de ${Math.min(a,b)}.`,
        wrong:v=>{ if(v===a*b&&a*b!==L) return `${a} × ${b} = ${a*b} é múltiplo comum, mas não é o menor.`; if(v===G&&G!==L) return 'Esse é o MDC (maior divisor comum). O MMC é o menor múltiplo comum.'; return null; }};
    }
    const [a,b,g]=pairG(120), L=lcm(a,b);
    return {kind:'int', label:'MDC', html:`<div class="big">MDC(${a}, ${b})<span class="op">=</span><span class="box">?</span></div>`,
      ans:g, show:String(g), hint:`Liste os divisores de ${Math.min(a,b)} e veja qual é o maior que também divide ${Math.max(a,b)}.`,
      wrong:v=>{ if(v===L) return 'Esse é o MMC. O MDC é o maior divisor comum.'; if(v===1&&g>1) return `1 divide os dois, mas existe um divisor comum maior.`; if(g%v===0&&v<g) return `${v} divide os dois, mas não é o maior divisor comum.`; return null; }};
  }
  if(Math.random()<.5){
    const t=pick(['onibus','luz','remedio','corrida']);
    let a,b;
    if(t==='remedio'){ [a,b]=shuf([4,6,8,12]).slice(0,2); }
    else { do{ [a,b]=shuf([6,8,9,10,12,15,18,20,24,30]).slice(0,2); }while(lcm(a,b)>180); }
    const L=lcm(a,b), G=gcd(a,b);
    const txt={onibus:`Dois ônibus saem juntos do terminal. Um parte a cada <b>${a} minutos</b> e o outro a cada <b>${b} minutos</b>. Depois de quantos minutos eles vão sair juntos de novo?`,
      luz:`Duas luzes de Natal piscam juntas. Uma pisca a cada <b>${a} segundos</b> e a outra a cada <b>${b} segundos</b>. Depois de quantos segundos elas vão piscar juntas de novo?`,
      remedio:`Uma pessoa toma um remédio de <b>${a} em ${a} horas</b> e outro de <b>${b} em ${b} horas</b>. Tomou os dois juntos agora. Daqui a quantas horas vai tomar os dois juntos de novo?`,
      corrida:`Dois atletas largam juntos numa pista circular. Um completa a volta em <b>${a} minutos</b> e o outro em <b>${b} minutos</b>. Depois de quantos minutos passam juntos pela largada de novo?`}[t];
    return {kind:'int', label:'Problema', html:`<p class="qtext">${txt}</p>`, ans:L, show:String(L),
      hint:'"Acontecer junto de novo" é um múltiplo comum dos dois tempos. O primeiro encontro é o MMC.',
      wrong:v=>{ if(v===a*b&&a*b!==L) return `${a*b} também é múltiplo comum, mas eles se encontram antes: o primeiro é o MMC.`; if(v===G) return 'Você calculou o MDC. Aqui o tempo vai se repetindo: é múltiplo, então é MMC.'; return null; }};
  }
  const t=pick(['fita','kit','grupo']);
  const [a,b,g]= t==='fita'? pairG(150) : pairG(90);
  const L=lcm(a,b);
  const txt={fita:`Uma costureira tem duas fitas, de <b>${a} cm</b> e <b>${b} cm</b>. Ela quer cortar as duas em pedaços do mesmo tamanho, <b>o maior possível</b>, sem sobrar nada. Qual será o tamanho de cada pedaço, em cm?`,
    kit:`Uma escola tem <b>${a} lápis</b> e <b>${b} borrachas</b> para montar kits iguais, com o <b>maior número de kits possível</b> e sem sobrar nada. Quantos kits serão montados?`,
    grupo:`Duas turmas, uma com <b>${a} alunos</b> e outra com <b>${b} alunos</b>, serão divididas em grupos do mesmo tamanho, <b>o maior possível</b>, sem misturar as turmas. Quantos alunos terá cada grupo?`}[t];
  return {kind:'int', label:'Problema', html:`<p class="qtext">${txt}</p>`, ans:g, show:String(g),
    hint:'Dividir em partes iguais, sem sobra e do maior tamanho (ou maior quantidade) possível: procure o maior divisor comum, o MDC.',
    wrong:v=>{ if(v===L) return 'Você calculou o MMC. Aqui estamos dividindo em partes iguais: é divisor, então é MDC.'; if(v<g&&g%v===0) return `${v} funciona, mas dá para ser maior: o MDC é ${g}.`; return null; }};
}

// --- Plano cartesiano
const PLR=6, PLC=24, PLO=PLR*PLC+32;
const plX=x=>PLO+x*PLC, plY=y=>PLO-y*PLC;
const pt=(x,y)=>`(${sg(x)}, ${sg(y)})`;
function planeSVG({pts=[],segs=[],click=false,axis=null}){
  const S2=2*PLO, lo=plX(-PLR-.6), hi=plX(PLR+.6);
  let g='';
  for(let i=-PLR;i<=PLR;i++){ if(i===0) continue;
    g+=`<line x1="${plX(i)}" y1="${lo}" x2="${plX(i)}" y2="${hi}" stroke="var(--line)" stroke-width="1"/><line x1="${lo}" y1="${plY(i)}" x2="${hi}" y2="${plY(i)}" stroke="var(--line)" stroke-width="1"/>`;
    g+=`<text x="${plX(i)}" y="${PLO+17}" text-anchor="middle" font-size="11" fill="var(--muted)" font-weight="800">${sg(i)}</text><text x="${PLO-7}" y="${plY(i)+4}" text-anchor="end" font-size="11" fill="var(--muted)" font-weight="800">${sg(i)}</text>`; }
  const ax=(hl)=>hl?'var(--accent)':'var(--ink)';
  g+=`<line x1="${lo-8}" y1="${PLO}" x2="${hi+8}" y2="${PLO}" stroke="${ax(axis==='x')}" stroke-width="${axis==='x'?3.5:2}"/><line x1="${PLO}" y1="${hi+8}" x2="${PLO}" y2="${lo-8}" stroke="${ax(axis==='y')}" stroke-width="${axis==='y'?3.5:2}"/>`;
  g+=`<path d="M${hi+8} ${PLO} l-8 -5 v10z" fill="${ax(axis==='x')}"/><path d="M${PLO} ${lo-8} l-5 8 h10z" fill="${ax(axis==='y')}"/>`;
  g+=`<text x="${hi+4}" y="${PLO-8}" font-size="14" font-weight="900" fill="var(--ink)">x</text><text x="${PLO+8}" y="${lo-2}" font-size="14" font-weight="900" fill="var(--ink)">y</text><text x="${PLO-6}" y="${PLO+15}" text-anchor="end" font-size="11" fill="var(--muted)" font-weight="800" opacity=".8">0</text>`;
  segs.forEach(([p,q,dash])=>{ g+=`<line x1="${plX(p[0])}" y1="${plY(p[1])}" x2="${plX(q[0])}" y2="${plY(q[1])}" stroke="var(--ok)" stroke-width="3" ${dash?'stroke-dasharray="6 5"':''} stroke-linecap="round"/>`; });
  pts.forEach(p=>{ const c=p.c||'var(--accent)';
    g+=`<circle cx="${plX(p.x)}" cy="${plY(p.y)}" r="6.5" fill="${c}" stroke="#0e1a2c" stroke-width="2"/>`;
    if(p.lab){ const right=p.x<PLR-1; g+=`<text x="${plX(p.x)+(right?10:-10)}" y="${plY(p.y)-9}" text-anchor="${right?'start':'end'}" font-size="14" font-weight="900" fill="${c}" paint-order="stroke" stroke="#0e1a2c" stroke-width="4">${p.lab}</text>`; } });
  if(click) for(let x=-PLR;x<=PLR;x++) for(let y=-PLR;y<=PLR;y++) g+=`<circle class="hit" cx="${plX(x)}" cy="${plY(y)}" r="11" data-act="plane" data-v="${x},${y}"><title>${pt(x,y)}</title></circle>`;
  return `<svg class="plane" viewBox="0 0 ${S2} ${S2}" role="img" aria-label="Plano cartesiano">${g}</svg>`;
}
function plWrong(ans){ return v=>{
  if(v.x===ans.y&&v.y===ans.x&&ans.x!==ans.y) return 'Você trocou a ordem. No par (x, y), primeiro vem o x (horizontal), depois o y (vertical).';
  if(Math.abs(v.x)===Math.abs(ans.x)&&Math.abs(v.y)===Math.abs(ans.y)) return 'Os números estão certos, mas confira os sinais: x negativo fica à esquerda e y negativo fica abaixo do eixo x.';
  return null; }; }
const PL_TIP='Comece na origem (0, 0). O x anda na horizontal (direita +, esquerda −) e o y anda na vertical (cima +, baixo −).';
function genPL(l){
  if(l===1){
    let x=nz(-PLR,PLR), y=nz(-PLR,PLR); if(Math.random()<.2){ if(Math.random()<.5) x=0; else y=0; }
    const ans={x,y};
    return {kind:'pair', label:'Qual é a coordenada do ponto P?', html:planeSVG({pts:[{x,y,lab:'P'}]}), ans, show:'P'+pt(x,y), hint:PL_TIP, wrong:plWrong(ans)};
  }
  if(l===2){
    if(Math.random()<.3){
      const x=nz(-9,9), y=nz(-9,9), q= x>0&&y>0?'1º':x<0&&y>0?'2º':x<0&&y<0?'3º':'4º';
      const tip='1º quadrante: (+, +). 2º: (−, +). 3º: (−, −). 4º: (+, −). A contagem gira no sentido anti-horário, começando em cima à direita.';
      return {kind:'choice', label:'Quadrantes', html:`<p class="qtext">Em qual quadrante está o ponto</p><div class="big">${pt(x,y)}</div>`,
        ans:q, opts:['1º','2º','3º','4º'].map(o=>[o,'quadrante']), show:q+' quadrante', hint:tip, wrong:()=>tip};
    }
    let x=nz(-PLR,PLR), y=nz(-PLR,PLR); if(Math.random()<.25){ if(Math.random()<.5) x=0; else y=0; }
    const ans={x,y};
    return {kind:'plane', label:'Localize o ponto', html:`<p class="qtext">Clique no ponto</p><div class="big">${pt(x,y)}</div>${planeSVG({click:true})}`,
      ans, show:pt(x,y), hint:PL_TIP+(x===0||y===0?' Se uma coordenada é 0, o ponto fica em cima de um eixo.':''), wrong:plWrong(ans)};
  }
  const t=pick(['ret','quad','sim']);
  if(t==='sim'){
    const axis=pick(['x','y']);
    let P,Q; do{ P=[rint(1,PLR),nz(-5,5)]; Q=[rint(1,PLR),nz(-5,5)]; if(axis==='x'){ P=[nz(-5,5),rint(1,PLR)]; Q=[nz(-5,5),rint(1,PLR)]; } }while(P[0]===Q[0]&&P[1]===Q[1]||Math.abs(P[0]-Q[0])+Math.abs(P[1]-Q[1])<3);
    const m=p=> axis==='y'?[-p[0],p[1]]:[p[0],-p[1]];
    const Qm=m(Q), Pm=m(P), ans={x:Pm[0],y:Pm[1]};
    const html=`<p class="qtext">A figura é <b>simétrica em relação ao eixo ${axis}</b>. Clique no ponto P', simétrico de P${pt(P[0],P[1])}.</p>`+
      planeSVG({click:true,axis,pts:[{x:P[0],y:P[1],lab:'P'},{x:Q[0],y:Q[1],lab:'Q'},{x:Qm[0],y:Qm[1],lab:"Q'"}],segs:[[P,Q],[Q,Qm,true]]});
    const tip= axis==='y'? 'Na simetria em relação ao eixo y, o ponto "espelha" para o outro lado: o x troca de sinal e o y continua igual.' : 'Na simetria em relação ao eixo x, o ponto "espelha" para cima ou para baixo: o y troca de sinal e o x continua igual.';
    return {kind:'plane', label:'Simetria', html, ans, show:"P'"+pt(ans.x,ans.y), hint:tip,
      wrong:v=>{ if(v.x===-P[0]&&v.y===-P[1]) return `Você trocou os dois sinais. Em relação ao eixo ${axis}, só o ${axis==='y'?'x':'y'} troca de sinal.`; if(v.x===P[0]&&v.y===P[1]) return 'Esse é o próprio P. Procure o ponto do outro lado do eixo.'; return tip; }};
  }
  let x1,y1,w,h;
  if(t==='quad'){ const s=rint(2,5); w=h=s; x1=rint(-PLR,PLR-s); y1=rint(-PLR,PLR-s); }
  else { do{ w=rint(2,8); h=rint(2,7); }while(w===h); x1=rint(-PLR,PLR-w); y1=rint(-PLR,PLR-h); }
  const V=[[x1,y1],[x1+w,y1],[x1+w,y1+h],[x1,y1+h]];
  const rot=rint(0,3), L=['A','B','C','D'], Vr=[0,1,2,3].map(i=>V[(i+rot)%4]);
  const miss=rint(0,3), known=[0,1,2,3].filter(i=>i!==miss);
  const ord=[1,2,3].map(k=>(miss+k)%4);
  const segs=[[Vr[ord[0]],Vr[ord[1]]],[Vr[ord[1]],Vr[ord[2]]]];
  const ans={x:Vr[miss][0],y:Vr[miss][1]};
  const nome= t==='quad'?'um quadrado':'um retângulo';
  const html=`<p class="qtext">ABCD é ${nome}. Clique onde fica o vértice <b>${L[miss]}</b>.</p>`+
    planeSVG({click:true,pts:known.map(i=>({x:Vr[i][0],y:Vr[i][1],lab:L[i]+pt(Vr[i][0],Vr[i][1])})),segs});
  return {kind:'plane', label:'Completar a figura', html, ans, show:L[miss]+pt(ans.x,ans.y),
    hint:`Os lados de ${nome} aqui são paralelos aos eixos: o vértice que falta tem o mesmo x de um vizinho e o mesmo y do outro vizinho.`,
    wrong:v=>{ const w0=plWrong(ans)(v); if(w0) return w0; return `Os vizinhos de ${L[miss]} são ${L[ord[0]]}${pt(Vr[ord[0]][0],Vr[ord[0]][1])} e ${L[ord[2]]}${pt(Vr[ord[2]][0],Vr[ord[2]][1])}. Use o x de um e o y do outro.`; }};
}

function startGame(mode){

function nextQ(){

function multOf(combo){ return combo>=10?3:combo>=5?2:1; }

function focusInput(){ const el=$('#a1')||$('#an')||$('#px')||$('#nextBtn'); if(el) setTimeout(()=>el.focus(),30); }
function readAnswer(){
  const q=G.q;
  if(q.kind==='frac'){ const n=$('#an').value.trim(), d=$('#ad').value.trim(); if(!/^\d+$/.test(n)||!/^\d+$/.test(d)||+d===0) return {err:'Preencha numerador e denominador com números (o denominador não pode ser 0).'}; return {v:{n:+n,d:+d}}; }
  if(q.kind==='pair'){ const x=parseNum($('#px').value), y=parseNum($('#py').value); if(x===null||y===null||!Number.isInteger(x)||!Number.isInteger(y)) return {err:'Preencha o x e o y com números inteiros. Use ± para o sinal de menos.'}; return {v:{x,y}}; }
  const v=parseNum($('#a1').value); if(v===null) return {err:'Digite sua resposta com números.'+(q.kind==='dec'?' Use vírgula para decimais.':'')}; return {v};
}
function isRight(q,v){
  if(q.kind==='choice') return v===q.ans;
  if(q.kind==='frac') return q.check?q.check(v):(v.n===q.ans.n&&v.d===q.ans.d);
  if(q.kind==='dec') return Math.abs(v-q.ans)<1e-6;
  if(q.kind==='pair'||q.kind==='plane') return v.x===q.ans.x&&v.y===q.ans.y;
  return v===q.ans;
}
function answer(v){
  const q=G.q, rel=G.mode==='relampago';
  G.tries++;
  const right=isRight(q,v);
  const box=$('#qbox');
  if(right){
    G.ok++; G.combo++; G.best=Math.max(G.best,G.combo);
    let base=1;
    if(rel){ G.pts+=10*G.l*multOf(G.combo); if(G.combo%5===0){ base+=2; sfx.combo(); mission('combo5'); } }
    else { mission('treinoOk',G.cid); if(q.retry) mission('retryOk'); if(G.ok%20===0){ G.mult=startRun('C:'+G.cid); toast(`20 acertos! Agora este Treino rende ${Math.round(G.mult*100)}%. Varie o conteúdo.`); } }

    if(rel){ nextQ(); render(); const b=$('#qbox'); if(b){ b.classList.add('good'); const f=document.createElement('span'); f.className='float'; f.textContent=coins?'+'+coins:'✓'; b.appendChild(f); } return; }
    G.state='done'; G.fb={c:'ok',m:pick(['Isso aí!','Mandou bem!','Certinho!','Perfeito!','Acertou!'])+(coins?` +${coins} moeda${coins>1?'s':''}`:'')};
    render(); return;
  }
  G.combo=0; sfx.bad();
  const w=(q.wrong&&q.wrong(v))||'';
  if(rel){
    G.state='done'; G.fb={c:'bad',m:`<span>Resposta certa:</span><span class="ans">${q.show}</span>${w&&q.kind!=='choice'?`<span>${w}</span>`:''}`};
    render();
    setTimeout(()=>{ if(G&&G.state==='done'&&VIEW.scr==='play'){ nextQ(); render(); } }, 1400);
    return;
  }
  G.queue.push({q:{...q},due:G.tries+3});
  G.state='done'; G.fb={c:'bad',m:`<span>Resposta certa:</span><span class="ans">${q.show}</span>${w?`<span>${w}</span>`:`<span>${q.hint}</span>`}<span class="muted" style="font-weight:700">Essa conta vai voltar daqui a pouco.</span>`};
  render(); if(box) {}
  const b=$('#qbox'); if(b) b.classList.add('badq');
}

const shuffle=a=>{ a=[...a]; for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };

function mkQ(area,hab,enun,ok,wrongs,expl,fig=''){

  if(alts.length<4) return null;

}

function figTri(A,B,C,ask){

function ordRecheio(){
  for(let t=0;t<200;t++){
    const c=pick([4,6,8,12]); const dens=[2,3,4,6,8,12].filter(x=>c%x===0&&x<=c);
    const nf=Math.random()<.4?1:2; const fl=shuffle(['cal','fra','mil']).slice(0,nf);
    const parts=fl.map(k=>{ const d=pick(dens); let n=rint(1,Math.max(1,Math.floor(d/2))); const g=gcd(n,d); return {k,n:n/g,d:d/g}; });
    const used=parts.reduce((a,p)=>a+p.n*c/p.d,0);
    if(used>=c||used<1) continue;
    if(nf===2&&parts[0].n*parts[1].d===parts[1].n*parts[0].d&&Math.random()<.5) continue;
    const rest=c-used;
    const txt=`Quero ${parts.map(p=>`${fr(p.n,p.d)} de <b>${FLAV[p.k].t.toLowerCase()}</b>`).join(nf===2?', ':'')}${nf===2?'':''} e <b>o resto de queijo</b>!`;
    return {kind:'rech',c,parts,rest,txt};

const lcm=(a,b)=>a*b/gcd(a,b);

  for(let t=0;t<300;t++){
    const k=hard&&Math.random()<.7?3:2;
    const ds=[]; for(let i=0;i<k;i++) ds.push(pick(hard?[2,3,4,6]:[2,3,4,6,8]));
    const L=ds.reduce(lcm,1); if(L>12||L<3) continue;
    if(!hard){ const mx=Math.max(...ds); if(!ds.every(d=>mx%d===0)) continue; }
    else if(k===2&&ds.every(d=>Math.max(...ds)%d===0)) continue;
    const ns=ds.map(d=>Math.random()<.7?1:rint(1,d-1));
    const parts=ds.map((d,i)=>{ const g=gcd(ns[i],d); return {n:ns[i]/g,d:d/g}; });
    const sum=parts.reduce((a,p)=>a+p.n*L/p.d,0); if(sum>L) continue;
    const mons=shuffle(SP.filter(s=>s.r!=='lend')).slice(0,k);
    return {kind:'cut',parts,L,mons,txt:`Somos ${k} e vamos dividir <b>uma pizza só</b>:`, ask: sum<L&&Math.random()<.6};
  }
  return {kind:'cut',parts:[{n:1,d:2},{n:1,d:4}],L:4,mons:SP.slice(0,2),txt:'Somos 2 e vamos dividir <b>uma pizza só</b>:',ask:true};
}
function pzNext(){
  const f=PZ.f; PZ.nCust++;

  let o,t=0; do{ o= f===1?ordAprendiz(): f===2?ordRecheio(): ordCortador(); t++; }while(PZREC.includes(key(o))&&t<60);
  PZREC.push(key(o)); if(PZREC.length>15) PZREC.shift();
  const pmax=Math.max(f===3?35:15,PZF[f].pac-Math.floor(PZ.served/3)*(f===3?3:1));
  const mon= o.kind==='cut'? o.mons[0] : pick(SP.filter(s=>s.r!=='lend'||Math.random()<.2));

function sliceGeom(c,i,R=86){
  const cx=100,cy=100, a0=-Math.PI/2+i*2*Math.PI/c, a1=a0+2*Math.PI/c, am=(a0+a1)/2;
  return {am, d:`M${cx} ${cy} L${(cx+R*Math.cos(a0)).toFixed(1)} ${(cy+R*Math.sin(a0)).toFixed(1)} A${R} ${R} 0 0 1 ${(cx+R*Math.cos(a1)).toFixed(1)} ${(cy+R*Math.sin(a1)).toFixed(1)} Z`, pt:k=>[(cx+Math.cos(am)*R*k).toFixed(1),(cy+Math.sin(am)*R*k).toFixed(1)]};
}
function topping(kind,g,c){
  const r=c>8?4:6;
  if(kind==='cal') return [.5,.78].map((k,j)=>{ const [x,y]=g.pt(k); return `<circle cx="${x}" cy="${y}" r="${r+1}" fill="#c0392b" stroke="#8e2316" stroke-width="1.5"/>`; }).join('');
  if(kind==='fra') return [.45,.7,.85].map(k=>{ const [x,y]=g.pt(k); return `<rect x="${x-r/1.5}" y="${y-r/2.2}" width="${r*1.4}" height="${r}" rx="2" fill="#c98b3a"/>`; }).join('');
  if(kind==='mil') return [.4,.58,.74,.88].map(k=>{ const [x,y]=g.pt(k); return `<circle cx="${x}" cy="${y}" r="${r/2+1}" fill="#f4b400" stroke="#b07d00" stroke-width="1"/>`; }).join('');
  if(kind==='que') return [.55,.8].map(k=>{ const [x,y]=g.pt(k); return `<circle cx="${x}" cy="${y}" r="${r/2+1.5}" fill="#fff8d6" opacity=".9"/>`; }).join('');
  return '';
}
function pizzaSVG(c,opts={}){
  const {pi=0,lifted=[],fill=null,color=null,act='pzslice',plain=false}=opts;
  let s=`<circle cx="100" cy="100" r="98" fill="#c98b3a"/><circle cx="100" cy="100" r="92" fill="#e2a24c"/>`;
  if(plain){ s+=`<circle cx="100" cy="100" r="86" fill="#ffd166" stroke="#b5651d" stroke-width="2.5"/>`; return `<svg class="pizza" viewBox="0 0 200 200">${s}</svg>`; }
  for(let i=0;i<c;i++){
    const g=sliceGeom(c,i), on=lifted.includes(i), off=on?9:0;
    const base= fill? (fill[i]?FLAV[fill[i]].c:'#b98a5a') : '#ffd166';
    const top= fill? (fill[i]?topping(fill[i],g,c):'') : topping('cal',g,c);
    const ring= color&&color[i]!=null? `<path d="${g.d}" fill="${WHO_C[color[i]]}" opacity=".55"/>` : '';
    s+=`<g class="slice ${on?'on':''}" transform="translate(${(Math.cos(g.am)*off).toFixed(1)} ${(Math.sin(g.am)*off).toFixed(1)})" data-act="${act}" data-p="${pi}" data-v="${i}" tabindex="0" role="button" aria-label="Fatia ${i+1}">
      <path d="${g.d}" fill="${base}" stroke="#b5651d" stroke-width="2.5"/>${top}${ring}${on?`<path d="${g.d}" fill="none" stroke="#2ee59d" stroke-width="5"/>`:''}</g>`;
  }
  return `<svg class="pizza" viewBox="0 0 200 200">${s}</svg>`;
}

function pzOk(extra){
  const P=PZ, c=P.cust; P.busy=true;
  P.served++; P.combo++; P.best=Math.max(P.best,P.combo);
  let pts=10*P.f+Math.ceil(c.pac); if(P.combo>=3) pts*=2; P.pts+=pts;
  sfx.ok(); if(P.combo%3===0) sfx.combo();
  P.msg={c:'ok',m:`${pick(['Delícia!','Perfeito!','Cliente feliz!','Essa saiu certinha!'])} +${pts} pontos${P.combo>=3?' (combo ×2)':''}${extra?`<span style="font-weight:700">${extra}</span>`:''}`};
  render(); setTimeout(()=>{ if(PZ===P&&VIEW.scr==='pz'&&P.t>0){ pzNext(); render(); } },1300);
}
function pzFail(why,detail){
  const P=PZ; if(P.busy) return; P.busy=true; P.lives--; P.combo=0; sfx.bad();
  P.msg={c:'bad',m: why==='tempo'?`${P.cust.o.kind==='cut'?'A mesa':P.cust.mon.nome} cansou de esperar e foi embora! 😠`:detail};
  render();
  setTimeout(()=>{ if(PZ!==P||VIEW.scr!=='pz') return; if(P.lives<=0) pzEnd(); else { pzNext(); render(); } }, why==='tempo'?1400:3200);
}
function pzServe(){
  const P=PZ, c=P.cust, o=c.o; if(P.busy) return;
  if(o.kind==='serve'){
    const cc=o.cuts[0], s=c.sel.reduce((a,x)=>a+x.length,0);
    if(s===0){ P.msg={c:'hint',m:'Toque nas fatias para separar o pedido.'}; render(); return; }
    const need=o.n*cc/o.d;
    if(s*o.d===o.n*cc){ pzOk(cc!==o.d?`${fr(o.n,o.d)} = ${fr(s,cc)}`:''); return; }
    pzFail('erro',`O cliente pediu ${fr(o.n,o.d)}. Com ${cc} fatias, isso é ${fr(need,cc)}: <b>${need} fatias</b>. Você serviu ${s}.${cc!==o.d?` (${fr(o.n,o.d)} = ${fr(need,cc)}: multiplique em cima e embaixo por ${cc/o.d})`:''}`); return;
  }
  if(o.kind==='rech'){
    if(c.fill.some(x=>!x)){ P.msg={c:'hint',m:'Ainda tem fatia sem recheio. Toda a pizza precisa ser recheada.'}; render(); return; }
    const cnt=k=>c.fill.filter(x=>x===k).length;
    const errs=o.parts.filter(p=>cnt(p.k)!==p.n*o.c/p.d);
    const qOk=cnt('que')===o.rest;
    if(!errs.length&&qOk){ pzOk(o.parts.map(p=>`${FLAV[p.k].t}: ${fr(p.n,p.d)} = ${fr(p.n*o.c/p.d,o.c)}`).join(' · ')+` · Queijo (o resto): ${fr(o.rest,o.c)}`); return; }
    const lines=o.parts.map(p=>`${FLAV[p.k].t}: ${fr(p.n,p.d)} = ${fr(p.n*o.c/p.d,o.c)} → <b>${p.n*o.c/p.d} fatias</b> (você pôs ${cnt(p.k)})`);
    lines.push(`Queijo (o resto): ${o.c} − ${o.c-o.rest} = <b>${o.rest} fatias</b> (você pôs ${cnt('que')})`);
    pzFail('erro',`Pedido errado! Numa pizza de ${o.c} fatias:<span style="font-weight:700;display:grid;gap:2px">${lines.map(l=>`<span>${l}</span>`).join('')}</span>`); return;
  }
  if(o.kind==='cut'&&c.stage==='give'){
    const need=o.parts.map(p=>p.n*c.cut/p.d);
    const got=o.parts.map((_,k)=>c.asg.filter(x=>x===k).length);
    if(need.every((n,k)=>n===got[k])){
      const left=c.cut-need.reduce((a,b)=>a+b,0);
      if(o.ask&&left>0){
        const g=gcd(left,c.cut); const ok=fr(left/g,c.cut/g);
        const cand=[fr(left,c.cut)===ok?null:fr(left,c.cut), fr(c.cut-left,c.cut), fr(left,c.cut+1), fr(1,left+1), fr(left+1,c.cut)].filter(Boolean);
        const val=t=>{ const m=t.match(/class="n">(\d+)<.*class="d">(\d+)</); return +m[1]/+m[2]; };
        const opts=[ok]; for(const x of cand){ if(opts.length>=3) break; if(!opts.some(y=>Math.abs(val(y)-val(x))<1e-9)) opts.push(x); }
        c.opts=shuffle(opts); c.okIdx=c.opts.indexOf(ok); c.left=left; c.stage='ask'; P.msg={c:'ok',m:'Mesa servida! Agora responda o gerente.'}; render(); return;
      }
      pzOk(`Corte em ${c.cut}: ${o.parts.map((p,k)=>`${fr(p.n,p.d)} = ${fr(need[k],c.cut)}`).join(' · ')}`); return;
    }
    pzFail('erro',`Com a pizza em ${c.cut} fatias: ${o.parts.map((p,k)=>`${o.mons[k].nome} pediu ${fr(p.n,p.d)} = ${fr(need[k],c.cut)} → <b>${need[k]} fatias</b> (recebeu ${got[k]})`).join('; ')}.`);
  }
}
function pzCut(n){
  const P=PZ, c=P.cust, o=c.o; if(P.busy||c.stage!=='cut') return;
  const bad=o.parts.filter(p=>n%p.d!==0);

  c.pac=Math.max(1,c.pac-4); sfx.bad();

  render();
}

function pzComp(k){

const ARF=[null,
  {nome:'Telhado',desc:'Ache o ângulo que falta no triângulo e corte a peça do canto do telhado.',fat:2,cap:20},
  {nome:'Piso',desc:'Calcule a área do cômodo e compre o número exato de pisos de 1 m².',fat:3,cap:30},
  {nome:'Planta da obra',desc:'Divida a figura em partes, calcule cada uma e some (ou desconte).',fat:4,cap:40}];
let AR=null; const ARREC=[];
const D2R=Math.PI/180;
function arGen(f){
  if(f===1){
    const t=pick(['qual','qual','ret','isoT','isoB']);
    let A,B,C,ask,given,txt,exp,iso=false,right=null;
    if(t==='qual'){ do{ A=rint(5,19)*5; B=rint(5,19)*5; C=180-A-B; }while(C<25||A===B||B===C||A===C);
      ask=pick(['A','B','C']); txt='Quanto mede o ângulo que falta?'; const g=['A','B','C'].filter(k=>k!==ask).map(k=>({A,B,C})[k]);
      exp=`A soma dos ângulos internos de um triângulo é 180°. 180° − ${g[0]}° − ${g[1]}° = ${({A,B,C})[ask]}°.`; }
    if(t==='ret'){ A=90; B=rint(5,13)*5; C=90-B; if(Math.random()<.5){ ask='C'; } else { ask='B'; }
      right='A'; txt='Este telhado tem um ângulo reto (90°). Quanto mede o ângulo que falta?';
      exp=`Ângulo reto vale 90°. 180° − 90° − ${ask==='C'?B:C}° = ${ask==='C'?C:B}°. (Os dois ângulos agudos de um triângulo retângulo somam 90°.)`; }
    if(t==='isoT'){ C=rint(2,14)*10; A=B=(180-C)/2; ask='A'; iso=true; txt='O telhado é um triângulo <b>isósceles</b> (os lados marcados são iguais). Quanto mede cada ângulo da base?';
      exp=`Os ângulos da base são iguais. 180° − ${C}° = ${180-C}°, dividido igualmente pelos dois: ${180-C}° ÷ 2 = ${A}°.`; }
    if(t==='isoB'){ A=B=rint(6,16)*5; C=180-2*A; ask='C'; iso=true; txt='O telhado é um triângulo <b>isósceles</b> (os lados marcados são iguais). Quanto mede o ângulo do topo?';
      exp=`No isósceles, os dois ângulos da base são iguais: ${A}° e ${A}°. 180° − ${A}° − ${A}° = ${C}°.`; }
    const ans=({A,B,C})[ask];
    const trap= t==='ret'? 180-(ask==='C'?B:C) : t==='isoT'? 180-C : t==='isoB'? 180-A : null;
    return {t:'ang',A,B,C,ask,iso,right,txt,exp,ans,trap,kind:t,key:`a:${A}:${B}:${ask}`};
  }
  if(f===2){
    const t=pick(['mret','mtri','dret','dtri']);
    if(t==='mret'){ const w=rint(3,9), h=rint(2,6); return {t:'area',grid:true,shape:'ret',w,h,ans:w*h,txt:'Cada quadradinho da malha tem 1 m². Quantos pisos de 1 m² cobrem este cômodo?',exp:`Retângulo: ${w} quadradinhos × ${h} quadradinhos = ${w*h} m².`,trap:2*(w+h),key:`mr:${w}:${h}`}; }
    if(t==='mtri'){ let w,h; do{ w=rint(3,9); h=rint(2,6); }while((w*h)%2); const apex=pick(['left','mid']); if(apex==='mid'&&w%2) return arGen(2);
      return {t:'area',grid:true,shape:'tri',apex,w,h,ans:w*h/2,txt:'Cada quadradinho da malha tem 1 m². Quantos pisos de 1 m² cobrem este canteiro triangular?',exp:`Triângulo: base × altura ÷ 2 = ${w} × ${h} ÷ 2 = ${w*h/2} m². Ele é metade do retângulo de ${w} × ${h}.`,trap:w*h,key:`mt:${w}:${h}:${apex}`}; }
    if(t==='dret'){ const w=rint(4,15), h=rint(3,12); return {t:'area',grid:false,shape:'ret',w,h,ans:w*h,txt:`Uma sala retangular mede <b>${w} m</b> por <b>${h} m</b>. Quantos pisos de 1 m² são necessários?`,exp:`Área do retângulo = comprimento × largura = ${w} × ${h} = ${w*h} m².`,trap:2*(w+h),key:`dr:${w}:${h}`}; }
    let w,h; do{ w=rint(4,16); h=rint(3,12); }while((w*h)%2);
    return {t:'area',grid:false,shape:'tri',apex:pick(['left','mid']),w,h,ans:w*h/2,txt:`Um canteiro triangular tem <b>base de ${w} m</b> e <b>altura de ${h} m</b>. Quantos m² de grama cobrem o canteiro?`,exp:`Triângulo: base × altura ÷ 2 = ${w} × ${h} ÷ 2 = ${w*h/2} m².`,trap:w*h,key:`dt:${w}:${h}`};
  }
  const t=pick(['L','pisc','casa']);
  if(t==='L'){ const W=rint(8,14), H=rint(6,11), cw=rint(2,W-4), ch=rint(2,H-3);
    return {t:'plan',kind:'L',W,H,cw,ch,ans:W*H-cw*ch,txt:'Este terreno tem formato de L. Toque numa das linhas tracejadas para dividir o terreno em dois retângulos.',key:`L:${W}:${H}:${cw}:${ch}`}; }
  if(t==='pisc'){ const W=rint(10,18), H=rint(8,13), pw=rint(3,W-5), ph=rint(2,H-4);
    return {t:'plan',kind:'pisc',W,H,pw,ph,ans:W*H-pw*ph,txt:`O quintal retangular mede ${W} m por ${H} m e tem uma piscina de ${pw} m por ${ph} m. Vamos colocar grama no quintal, menos na piscina. Toque na piscina para descontá-la.`,key:`P:${W}:${H}:${pw}:${ph}`}; }
  let w,hw,hr; do{ w=rint(3,8)*2; hw=rint(3,7); hr=rint(2,6); }while(false);
  return {t:'plan',kind:'casa',w,hw,hr,ans:w*hw+w*hr/2,txt:'A fachada da casa é um retângulo com um triângulo em cima. Toque na linha tracejada que separa a parede do telhado.',key:`C:${w}:${hw}:${hr}`};
}
/* ---------- desenhos ---------- */
function arTriSVG(q,cut){
  const {A,B,C}=q, b=Math.sin(B*D2R)/Math.sin(C*D2R);
  const P={A:[0,0],B:[1,0],C:[b*Math.cos(A*D2R),b*Math.sin(A*D2R)]};
  const xs=[0,1,P.C[0]], ys=[0,P.C[1]];
  const minx=Math.min(...xs), maxx=Math.max(...xs), maxy=Math.max(...ys);
  const sc=Math.min(260/(maxx-minx), 170/maxy), ox=50-minx*sc, oy=215;
  const T=k=>[ox+P[k][0]*sc, oy-P[k][1]*sc];
  const [a,bb,c]=['A','B','C'].map(T);
  const nb={A:['B','C'],B:['C','A'],C:['A','B']};
  const ang=k=>({A,B,C})[k];
  const dirDeg=(from,to)=>{ const p=T(from), r=T(to); return Math.atan2(-(r[1]-p[1]), r[0]-p[0])/D2R; };
  // ângulo interno: começa na direção do 1º vizinho e gira até o 2º
  function arcData(k){ const d1=dirDeg(k,nb[k][0]), d2=dirDeg(k,nb[k][1]); let diff=((d2-d1)%360+360)%360; const s= Math.abs(diff-ang(k))<1?1:-1; return {d1,s}; }
  const pt=(k,deg,r)=>{ const p=T(k); return [p[0]+r*Math.cos(deg*D2R), p[1]-r*Math.sin(deg*D2R)]; };
  function sector(k,deg,r,fill,stroke,cls=''){ const {d1,s}=arcData(k); const p=T(k), s1=pt(k,d1,r), s2=pt(k,d1+s*deg,r);
    return `<path class="${cls}" d="M${p[0]} ${p[1]} L${s1[0]} ${s1[1]} A${r} ${r} 0 ${deg>180?1:0} ${s>0?0:1} ${s2[0]} ${s2[1]} Z" fill="${fill}" stroke="${stroke}" stroke-width="2"/>`; }
  let g='';
  const beam=(p,r,col)=>`<line x1="${p[0]}" y1="${p[1]}" x2="${r[0]}" y2="${r[1]}" stroke="${col}" stroke-width="9" stroke-linecap="round"/><line x1="${p[0]}" y1="${p[1]}" x2="${r[0]}" y2="${r[1]}" stroke="#e0a96d" stroke-width="5" stroke-linecap="round"/>`;
  g+=beam(a,bb,'#6b4226')+beam(bb,c,'#6b4226')+beam(c,a,'#6b4226');
  if(q.iso){ for(const [p,r] of [[a,c],[bb,c]]){ const m=[(p[0]+r[0])/2,(p[1]+r[1])/2], dx=r[0]-p[0], dy=r[1]-p[1], L=Math.hypot(dx,dy), nx=-dy/L*9, ny=dx/L*9;
    g+=`<line x1="${m[0]-nx}" y1="${m[1]-ny}" x2="${m[0]+nx}" y2="${m[1]+ny}" stroke="#ffcf3f" stroke-width="3"/>`; } }
  for(const k of ['A','B','C']){ const {d1,s}=arcData(k), mid=d1+s*ang(k)/2, isAsk= k===q.ask||(!cut&&q.kind==='isoT'&&k==='B');
    if(cut&&k===q.ask) continue;
    if(q.right===k){ const p=T(k), u=pt(k,d1,16), w=pt(k,d1+s*90,16), cc=pt(k,d1+s*45,16*Math.SQRT2); g+=`<path d="M${u[0]} ${u[1]} L${cc[0]} ${cc[1]} L${w[0]} ${w[1]}" fill="none" stroke="#f3f7ff" stroke-width="2.5"/><circle cx="${pt(k,mid,8)[0]}" cy="${pt(k,mid,8)[1]}" r="2" fill="#f3f7ff"/>`; }
    else g+=sector(k,ang(k),26,isAsk?'rgba(255,207,63,.25)':'rgba(126,200,255,.18)',isAsk?'#ffcf3f':'#7ec8ff');
    const lp=pt(k,mid,48), lab= isAsk? '?' : ang(k)+'°';
    g+=`<text x="${lp[0]}" y="${lp[1]+6}" text-anchor="middle" font-size="${isAsk?22:17}" font-weight="900" fill="${isAsk?'#ffcf3f':'#f3f7ff'}" font-family="Nunito,sans-serif">${lab}</text>`; }
  if(cut){ const ok=cut.v===q.ans, v=Math.max(3,Math.min(178,cut.v)), {d1,s}=arcData(q.ask), p=T(q.ask), e=pt(q.ask,d1+s*v,110);
    g+=`<g class="arpiece">${sector(q.ask,v,40,ok?'rgba(46,229,157,.55)':'rgba(255,93,115,.5)',ok?'#2ee59d':'#ff5d73')}${ok?'':`<line x1="${p[0]}" y1="${p[1]}" x2="${e[0]}" y2="${e[1]}" stroke="#ff5d73" stroke-width="3" stroke-dasharray="6 5"/>`}
      <text x="${pt(q.ask,d1+s*v/2,62)[0]}" y="${pt(q.ask,d1+s*v/2,62)[1]+6}" text-anchor="middle" font-size="18" font-weight="900" fill="${ok?'#2ee59d':'#ff5d73'}" font-family="Nunito,sans-serif">${cut.v}°</text></g>`;
  }
  return `<svg class="arfig" viewBox="0 0 360 240" role="img" aria-label="Triângulo do telhado">${g}</svg>`;
}
function arAreaSVG(q,done){
  const {w,h}=q, s=Math.min(30, 300/w, 200/h), W=w*s, H=h*s, ox=(340-W)/2, oy=20;
  let g='';
  const inTri=(i,j)=>{ // centro da célula dentro do triângulo?
    const x=i+.5, y=h-(j+.5);
    if(q.apex==='left') return x/w + y/h <= 1+1e-9 || false;
    const m=w/2; return y <= h*(1-Math.abs(x-m)/m)+1e-9; };
  if(q.grid||done){ for(let i=0;i<=w;i++) g+=`<line x1="${ox+i*s}" y1="${oy}" x2="${ox+i*s}" y2="${oy+H}" stroke="var(--line)" stroke-width="1"/>`;

function arParts(q){
  if(q.kind==='L'){ const {W,H,cw,ch}=q; const p= AR.cut==='v'? [(W-cw)*H, cw*(H-ch)] : [W*(H-ch), (W-cw)*ch];

  if(q.kind==='pisc'){ const a=q.W*q.H, b=q.pw*q.ph; return {labs:['Quintal inteiro','Piscina','Área de grama'],vals:[a,b,q.ans],op:'−',exp:`Quintal: ${q.W} × ${q.H} = ${a} m². Piscina: ${q.pw} × ${q.ph} = ${b} m². Grama: ${a} − ${b} = ${q.ans} m².`}; }

}

   GAME 4: COFRE DA EQUAÇÃO (balança, equações e operações inversas)
   ===================================================================== */
const CFF=[null,
  {nome:'Balança',desc:'A balança está equilibrada. Descubra quanto pesa cada caixa misteriosa.',fat:1.6,cap:20},
  {nome:'Cofre forte',desc:'Equações ax ± b = c com negativos. Cada solução é um número da combinação.',fat:2.5,cap:30},
  {nome:'Máquina secreta',desc:'Rode a máquina de trás para frente com as operações inversas e descubra o número.',fat:3.3,cap:40}];
let CF=null; const CFREC=[];
const OPS={'+':{inv:'−',f:(v,n)=>v+n},'−':{inv:'+',f:(v,n)=>v-n},'×':{inv:'÷',f:(v,n)=>v*n},'÷':{inv:'×',f:(v,n)=>v/n}};
function cfGen(f,vault){
  if(f===1){
    const t=pick(['xb','ax','axb','axb']); let a,b,x;
    do{ a= t==='xb'?1:rint(2,4); b= t==='ax'?0:rint(1,8); x=rint(1,7); }while(a*x+b>16||a*x+b<3);
    return {t:'bal',a,b,c:a*x+b,x,key:`b:${a}:${b}:${x}`};
  }
  if(f===2){
    const a=rint(2,9), x= Math.random()<.55? -rint(1,10) : rint(1,12), b=nz(-20,20), c=a*x+b;
    return {t:'eq',a,b,c,x,key:`e:${a}:${b}:${x}`};
  }
  const n= vault>=3? 3 : 2;
  let x,ops,vals;
  for(let tries=0;tries<500;tries++){
    x=nz(-9,12); ops=[]; vals=[x]; let ok=true;
    for(let i=0;i<n;i++){ const cur=vals[i];
      const cand=['+','−','×','÷'].filter(o=>!(i>0&&(o===ops[i-1][0]||OPS[o].inv===ops[i-1][0])));
      let o=pick(cand), k=rint(2,9);
      if(o==='÷'){ const ds=[2,3,4,5,6].filter(d=>cur!==0&&cur%d===0); if(!ds.length){ o=pick(['+','−','×']); } else k=pick(ds); }
      if(o==='×') k=rint(2,5);
      const nv=OPS[o].f(cur,k); if(Math.abs(nv)>99){ ok=false; break; }
      ops.push([o,k]); vals.push(nv); }
    if(ok&&vals.some(v=>v<0)) break;
  }
  return {t:'maq',x,ops,vals,y:vals[vals.length-1],shuffled: vault===4&&Math.random()<.7, order:shuf(ops.map((_,i)=>i)), key:`m:${x}:${ops.flat().join('')}`};
}
function cfEqText(q){ let e='x';
  for(const [o,k] of q.ops){
    if(o==='×') e= e==='x'? `${k}x` : `${k}(${e})`;
    else if(o==='÷') e= e==='x'? `x ÷ ${k}` : `(${e}) ÷ ${k}`;
    else e=`${e} ${o} ${k}`; }
  return `${e} = ${vsg(q.y)}`;
}
function cfNew(){
  const vault=Math.floor(CF.done/3)+1;
  let q,t=0; do{ q=cfGen(CF.f,vault); t++; }while((CF.used.has(q.key)||t<40&&CFREC.includes(q.key))&&t<200);
  CF.used.add(q.key); CFREC.push(q.key); if(CFREC.length>40) CFREC.shift();
  CF.q=q; CF.state='ask'; CF.msg=null; CF.lockErr=false;
  if(q.t==='bal'){ CF.lb=q.b; CF.rc=q.c; CF.div=false; }
  if(q.t==='maq'){ CF.undone=0; CF.pickG=null; }
}

      const sum=parts.reduce((a,p)=>a+p.n/p.d,0); if(sum>=1) continue;
