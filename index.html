    for(let k=0;k<400;k++){
      const opt=()=>{ const p=pick([10,25,50,0]); const step= p===25?20:10; const P=rint(Math.ceil(40/step),Math.floor(200/step))*step; return {P,p,f:P*(100-p)/100}; };
      const a=opt(), b=opt(); if(a.p===0&&b.p===0) continue; if(a.p===b.p) continue;
      if(Math.abs(a.f-b.f)<2||Math.abs(a.f-b.f)>20||Math.abs(a.P-b.P)>80) continue;
      const lab=o=>o.p?{t:`R$ ${o.P}`,s:`com ${o.p}% de desconto`}:{t:`R$ ${o.P}`,s:'sem desconto'};
      const it=pick(['O mesmo tênis','A mesma mochila','O mesmo fone de ouvido','A mesma bola','O mesmo jogo']);
      const ex=o=>o.p?`R$ ${o.P} − ${o.p}% (${o.p===50?'metade':o.p===25?'um quarto':'um décimo'}: R$ ${o.P*o.p/100}) = R$ ${o.f}`:`R$ ${o.P} sem desconto`;
      return {kind:'promo',A:{...lab(a),v:a.f},B:{...lab(b),v:b.f},q:`${it} em duas lojas. Onde sai mais barato?`,exp:`${ex(a)}. ${ex(b)}.`,key:`p${a.P}/${a.p}-${b.P}/${b.p}`};
    }
  }
  const U=[50,75,100,125,150,200,250]; const u=pick(U);
  const k=pick([2,4,5,10].filter(k=>(u*k)%50===0&&u*k<=2000));
  let y; do{ y=u+pick([-50,-25,25,50]); }while(y<=0);
  const it=pick([['sucos','suco'],['iogurtes','iogurte'],['pães','pão'],['canetas','caneta'],['sabonetes','sabonete']]);
  const cards=Math.random()<.5?[{t:`${k} ${it[0]}`,s:`por ${rs(u*k)}`,v:u},{t:`1 ${it[1]}`,s:`por ${rs(y)}`,v:y}]:[{t:`1 ${it[1]}`,s:`por ${rs(y)}`,v:y},{t:`${k} ${it[0]}`,s:`por ${rs(u*k)}`,v:u}];
  return {kind:'promo',A:cards[0],B:cards[1],unit:true,q:'Qual sai mais barato por unidade?',exp:`No pacote, cada ${it[1]} sai por ${rs(u*k)} ÷ ${k} = ${rs(u)}. Avulso: ${rs(y)}.`,key:`k${k}-${u}-${y}`};
}
function mkNota(){
  for(let i=0;i<500;i++){
    const w=rint(5,35); const p=rint(150,1290); if((w*p)%10!==0) continue; const v1=w*p/10;
    const d=pick([10,20,25,50]); if((v1*d)%100!==0) continue; const v2=v1-v1*d/100;
    const n=pick([2,3,4,5]); if(v2%n!==0) continue; const v3=v2/n;
    const it=pick([['banana','kg'],['queijo','kg'],['carne','kg'],['uva','kg'],['tomate','kg']]);
    return {kind:'nota',w,p,v1,d,v2,n,v3,it,key:`n${w}-${p}-${d}-${n}`};
  }
  return mkNota();
}
function mkGen(f){ return f===1?mkCaixa(): f===2?mkPromo(): mkNota(); }
function mkStart(f){
  stopTimer();
  MK={f,i:0,total:f===1?8:f===3?5:999,pts:0,combo:0,best:0,hits:0,mult:startRun('G6'),res:[],t:60,ended:false};
  VIEW.scr='mk'; mkNext(); render(); window.scrollTo(0,0); mkFocus();
  let last=Date.now();
  MKT=setInterval(()=>{ const now=Date.now(), dt=(now-last)/1000; last=now; const P=MK; if(!P) return;
    if(P.f===2){ P.t=Math.max(0,P.t-dt); const el=$('#mkT'); if(el){ el.textContent=Math.ceil(P.t)+'s'; el.classList.toggle('low',P.t<=10); } if(P.t<=0) mkEnd(); return; }
    if(P.busy) return; P.tl-=dt; const r=Math.max(0,P.tl/P.tmax); const b=$('#mkBar'); if(b){ b.style.width=(r*100)+'%'; b.className=r<.3?'low':r<.6?'mid':''; }
    if(P.tl<=0) mkMiss('tempo'); },100);
}
function mkNext(){
  const P=MK; P.i++; let q,t=0; do{ q=mkGen(P.f); t++; }while(MKREC.includes(q.key)&&t<60); MKREC.push(q.key); if(MKREC.length>25) MKREC.shift();
  P.q=q; P.msg=null; P.busy=false; P.typed={}; P.given=[];
  P.tmax= P.f===1? Math.max(25,40-P.hits*2) : 100; P.tl=P.tmax;
}

function mkOk(extra){
  const P=MK; P.busy=true; P.hits++; P.combo++; P.best=Math.max(P.best,P.combo); P.res.push(true);
  let pts=10*P.f+(P.f===2?5:Math.ceil(P.tl/(P.f===3?3:1))); if(P.combo>=3) pts*=2; P.pts+=pts; sfx.coin(); sfx.ok(); if(P.combo%3===0) sfx.combo();
  P.msg={c:'ok',m:`${pick(['Certinho!','Cliente satisfeito!','Conta fechada!','Boa compra!'])} +${pts} pontos${P.combo>=3?' (combo ×2)':''}${extra?`<span style="font-weight:700">${extra}</span>`:''}`};
  render(); setTimeout(()=>mkAfter(P),P.f===2?700:1400);
}
function mkMiss(why,detail){
  const P=MK; if(P.busy) return; P.busy=true; P.combo=0; P.res.push(false); sfx.bad();
  if(P.f===2) P.t=Math.max(0,P.t-3);
  P.msg={c:'bad',m: why==='tempo'?`O tempo acabou!${detail?`<span style="font-weight:700">${detail}</span>`:''}`:detail};
  render(); setTimeout(()=>mkAfter(P),P.f===2?1800:3800);
}
function mkAfter(P){ if(MK!==P||VIEW.scr!=='mk'||P.ended) return; if(P.f!==2&&P.i>=P.total) mkEnd(); else if(P.f===2&&P.t<=0) mkEnd(); else { mkNext(); render(); mkFocus(); } }
function mkGive(){ const P=MK, q=P.q; if(P.busy) return; const sum=P.given.reduce((a,b)=>a+b,0);
  if(!sum){ P.msg={c:'hint',m:'Toque nas notas e moedas para montar o troco.'}; render(); return; }
  if(sum===q.ans) mkOk(`${rsShort(q.V)} − ${rsShort(q.tot)} = ${rsShort(q.ans)}`);
  else mkMiss('erro',`Troco certo: <b>${rs(q.ans)}</b> (você deu ${rs(sum)}).<span style="font-weight:700">Arme a conta com vírgula embaixo de vírgula: ${rsShort(q.V)} − ${rsShort(q.tot)} = ${rsShort(q.ans)}.</span>`); }
function mkPick(k){ const P=MK, q=P.q; if(P.busy) return; const right=q.A.v<q.B.v?0:1;
  if(k===right) mkOk(); else mkMiss('erro',`A mais barata era a outra. ${q.exp} (−3 s)`); }
function mkSubmit(){
  const P=MK, q=P.q; if(P.busy) return;
  P.typed={}; ['mk1','mk2','mk3'].forEach(id=>P.typed[id]=esc($('#'+id).value));
  const v=['mk1','mk2','mk3'].map(id=>parseNum($('#'+id).value));
  if(v.some(x=>x===null)){ P.msg={c:'hint',m:'Preencha as três linhas com números (use vírgula nos centavos).'}; render(); return; }
  const ans=[q.v1,q.v2,q.v3].map(c=>c/100), ok=v.map((x,i)=>Math.abs(x-ans[i])<.001);
  if(ok.every(Boolean)){ mkOk(); return; }
  const lines=[];
  if(!ok[0]) lines.push(`${fmt(q.w/10)} × ${rsShort(q.p)} = <b>${rsShort(q.v1)}</b>. Multiplique sem as vírgulas (${q.w} × ${q.p} = ${q.w*q.p}) e conte as casas decimais dos dois fatores: 1 + 2 = 3 casas.`);
  if(!ok[1]) lines.push(`${q.d}% de ${rsShort(q.v1)} = ${rsShort(q.v1*q.d/100)}. Com desconto: ${rsShort(q.v1)} − ${rsShort(q.v1*q.d/100)} = <b>${rsShort(q.v2)}</b>.`);
  if(!ok[2]) lines.push(`${rsShort(q.v2)} ÷ ${q.n} = <b>${rsShort(q.v3)}</b>.`);
  mkMiss('erro',`Nota com erro:<span style="font-weight:700;display:grid;gap:4px">${lines.map(l=>`<span>${l}</span>`).join('')}</span>`);
}
function mkEnd(){

  const F=MKF[P.f]; const base=Math.max(8,Math.min(F.cap,Math.round(2+P.hits*F.fat)));
  P.coins=earn(base,P.mult); save(); mission('gameDone'); sfx.end();
  VIEW.scr='mkend'; render(); window.scrollTo(0,0);
}

  else if(a==='cfquit'){ cfEnd(); }
  else if(a==='arstart'){ arStart(+v); }
  else if(a==='arcut'){ if(AR&&AR.state==='ask'&&!AR.cut){ AR.cut=v; tone(700,0,.08,'square',.05); render(); const i=$('#ap0'); if(i) i.focus(); } }
  else if(a==='arnext'){ if(AR){ if(AR.lives<=0||AR.n>=AR.total) arEnd(); else { arNew(); render(); window.scrollTo(0,0); } } }
  else if(a==='arquit'){ arEnd(); }
  else if(a==='tmstart'){ tmStart(+v); }
  else if(a==='tmstep'){ if(TM&&TM.state==='ask'){ TM.sel=Math.max(TLO,Math.min(THI,(TM.sel??TM.q.a)+(+v))); tone(500+TM.sel*12,0,.05,'square',.04); render(); } }
  else if(a==='tmok'){ if(TM&&TM.state==='ask'&&TM.sel!=null&&TM.sel!==TM.q.a) tmAnswer(TM.sel); }
  else if(a==='tmchoose'){ if(TM&&TM.state==='ask') tmAnswer(v); }
  else if(a==='tmnext'){ if(TM){ if(TM.n>=TM.total) tmEnd(); else { tmNew(); render(); } } }
  else if(a==='tmquit'){ tmEnd(); }
  else if(a==='mkstart'){ mkStart(+v); }
  else if(a==='mkadd'){ if(MK&&!MK.busy){ MK.given.push(+v); if(MK.msg&&MK.msg.c==='hint') MK.msg=null; sfx.coin(); render(); } }
  else if(a==='mkundo'){ if(MK&&!MK.busy){ MK.given.pop(); render(); } }
  else if(a==='mkclear'){ if(MK&&!MK.busy){ MK.given=[]; render(); } }
  else if(a==='mkgive'){ mkGive(); }
  else if(a==='mkpick'){ mkPick(+v); }
  else if(a==='mkquit'){ mkEnd(); }
  else if(a==='tsstart'){ tsStart(+v); }
  else if(a==='tssplit'){ tsSplit(+v); }
  else if(a==='tssack'){ const P=TS; if(!P||P.busy||P.stage!=='pick') return; const i=+v, k=P.sel.indexOf(i); if(k>=0) P.sel.splice(k,1); else P.sel.push(i); tone(600+P.sel.length*50,0,.06,'square',.04); render(); }
  else if(a==='tspick'){ tsPick(); }
  else if(a==='tsquit'){ tsEnd(); }
  else if(a==='rtstart'){ rtStart(+v); }
  else if(a==='rtfire'){ }
  else if(a==='rtquit'){ rtEnd(); }
  else if(a==='hubgames'){ go('hub',{tab:'games'}); }
  else if(a==='pzstart'){ pzStart(+v); }
  else if(a==='pzslice'){ const P=PZ; if(!P||P.busy) return; const c=P.cust, i=+v;
    if(c.o.kind==='serve'){ const pi=+b.dataset.p, sel=c.sel[pi]; const k=sel.indexOf(i); if(k>=0) sel.splice(k,1); else sel.push(i); tone(520+sel.length*40,0,.06,'square',.04); }
    else if(c.o.kind==='rech'){ c.fill[i]= c.tool==='x'?null:c.tool; tone(600,0,.05,'square',.04); }
    if(P.msg&&P.msg.c==='hint') P.msg=null; render(); }
  else if(a==='pzgive'){ const P=PZ; if(!P||P.busy) return; const c=P.cust, i=+v; c.asg[i]= c.asg[i]===c.who?null:c.who; tone(560+c.who*90,0,.06,'square',.04); render(); }
  else if(a==='pzflavor'){ if(PZ&&!PZ.busy){ PZ.cust.tool=v; render(); } }
  else if(a==='pzwho'){ if(PZ&&!PZ.busy){ PZ.cust.who=+v; render(); } }
  else if(a==='pzcut'){ pzCut(+v); }
  else if(a==='pzleft'){ pzLeft(+v); }
  else if(a==='pzclear'){ const P=PZ; if(!P||P.busy) return; const c=P.cust; if(c.o.kind==='serve') c.sel=c.sel.map(()=>[]); if(c.o.kind==='rech') c.fill=c.fill.map(()=>null); if(c.o.kind==='cut'&&c.stage==='give') c.asg=c.asg.map(()=>null); render(); }
  else if(a==='pzserve'){ pzServe(); }
  else if(a==='pzcomp'){ pzComp(+v); }
  else if(a==='pzquit'){ pzEnd(); }
  else if(a==='sair'){ go('save',{leaving:true}); }
  else if(a==='leave'){ VIEW.leaving=false; go('start'); }
  else if(a==='copy'){ const code=$('#saveCode').textContent;
    const done=()=>{$('#copied').textContent='Copiado!'};
    try{ navigator.clipboard.writeText(code).then(done,()=>{ selectCode(); $('#copied').textContent='Selecionado: use Ctrl+C.'; }); }catch(err){ selectCode(); } }
});
function selectCode(){ const r=document.createRange(); r.selectNodeContents($('#saveCode')); const s=getSelection(); s.removeAllRanges(); s.addRange(r); }
document.addEventListener('pointerdown',e=>{
  const svg=e.target.closest&&e.target.closest('#rline'); if(!svg||!RT||RT.busy||VIEW.scr!=='rt') return;
  const pt=svg.createSVGPoint(); pt.x=e.clientX; pt.y=e.clientY; const p=pt.matrixTransform(svg.getScreenCTM().inverse());
  const v=RT.q.lo+(p.x-RX0)/(RX1-RX0)*(RT.q.hi-RT.q.lo); if(v<RT.q.lo-.5||v>RT.q.hi+.5) return; rtShoot(Math.max(RT.q.lo,Math.min(RT.q.hi,v)));
});
document.addEventListener('pointerdown',e=>{
  const svg=e.target.closest&&e.target.closest('#thermo'); if(!svg||!TM||TM.state!=='ask'||VIEW.scr!=='tm') return;
  const pt=svg.createSVGPoint(); pt.x=e.clientX; pt.y=e.clientY; const p=pt.matrixTransform(svg.getScreenCTM().inverse());
  const v=Math.round(THI-(p.y-TY0)/TU); TM.sel=Math.max(TLO,Math.min(THI,v)); tone(500+TM.sel*12,0,.05,'square',.04); render();
});
document.addEventListener('keydown',e=>{
  if(e.key===' '&&VIEW.scr==='rt'&&RT&&RT.moving){ e.preventDefault(); if(!RT.busy) rtShoot(RT.tx); return; }
  if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('.slice')){ e.preventDefault(); e.target.dispatchEvent(new MouseEvent('click',{bubbles:true})); return; }
  if(VIEW.scr!=='play'||!G) return;
  if(e.key==='Enter'&&G.state==='done'&&G.mode==='treino'){ e.preventDefault(); nextQ(); render(); return; }
  if(G.state==='ask'&&G.q.kind==='choice'){
    const map={'>':'>','<':'<','=':'=','s':'S','n':'N'}; const k=map[e.key.toLowerCase()]; if(k&&G.q.opts.some(o=>o[0]===k)){ e.preventDefault(); answer(k); }
  }
});

/* início */
load();
if(S.apelido) VIEW={scr:'hub',tab:'contas'};
render();
</script>
